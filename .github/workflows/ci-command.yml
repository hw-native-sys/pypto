name: CI Command

# GitHub receives comments; no public webhook server or App secret is needed.
# This file must be installed on main before /ci full becomes available.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ci full')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-command-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout trusted command handler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Authorize and dispatch full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_control.py dispatch
