name: CI A5 Rerun Progress

on:
  workflow_run:
    workflows: [CI A5 Distributed]
    types: [in_progress]

permissions: {}

jobs:
  route:
    if: >-
      github.event.workflow_run.event == 'issue_comment' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt > 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      number: ${{ steps.route.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: route
        run: python .github/scripts/ci_a5_distributed.py route-rerun

  progress:
    needs: route
    if: needs.route.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fresh commands can retire older checks. Serialize all writers for this PR.
    concurrency:
      group: ci-a5-admission-${{ needs.route.outputs.number }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Update the check for the current attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_a5_distributed.py reopen
