name: CI Full Progress

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing full CI run to monitor (does not rerun tests)
        type: string
        required: true
  workflow_run:
    workflows: [CI]
    types: [in_progress, completed]

permissions: {}

jobs:
  progress:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 310
    concurrency:
      # Completion notifications reconcile after the live monitor exits.
      # Serialize attempts too, so they cannot create checks concurrently.
      group: ci-full-progress-${{ inputs.run_id || github.event.workflow_run.id }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: read
      statuses: read
      checks: write
    steps:
      - name: Checkout trusted progress publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Mirror full-test jobs onto the PR
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_progress.py
      - name: Reconcile the merge gate after monitoring
        if: always() && steps.monitor.outputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.monitor.outputs.source_run }}
        run: >-
          gh workflow run ci-full-status.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f run_id="$SOURCE_RUN"
