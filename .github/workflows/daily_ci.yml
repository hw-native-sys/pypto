name: Daily CI

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = Beijing 02:00 (next day)
  workflow_dispatch:

jobs:
  toolchain:
    # ptoas from toolchain/versions.env; pto-isa derived from the pinned runtime
    # submodule's runtime/pto_isa.pin — see the matching job in ci.yml.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pto_isa_commit: ${{ steps.read.outputs.PTO_ISA_COMMIT }}
      ptoas_version: ${{ steps.read.outputs.PTOAS_VERSION }}
      ptoas_sha256_aarch64: ${{ steps.read.outputs.PTOAS_SHA256_AARCH64 }}
      ptoas_sha256_x86_64: ${{ steps.read.outputs.PTOAS_SHA256_X86_64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Read pinned toolchain versions
        id: read
        run: |
          grep -E '^[A-Z0-9_]+=' toolchain/versions.env >> "$GITHUB_OUTPUT"
          commit="$(tr -d '[:space:]' < runtime/pto_isa.pin)"
          if ! printf '%s' "$commit" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error file=runtime/pto_isa.pin::expected a 40-char hex commit, got '$commit'"
            exit 1
          fi
          echo "PTO_ISA_COMMIT=$commit" >> "$GITHUB_OUTPUT"

  a5-system-tests:
    # Nightly A5 (Ascend950) on-board coverage. Setup is the standard device-job
    # shape — the same composite action / env / task-submit mechanism as ci.yml
    # `mixed-kernel-tests-a5` and the `qwen3-perf` job below — on the npu-a5
    # runner pool. That runner must satisfy the setup-ci-job contract for a
    # bundle job: CI_CACHE_ROOT / CANN_ROOT + DEVICE_ID in its .env, the
    # pypto-toolchain bundle installed, and task-submit / npu-smi / ccache /
    # git / curl on PATH. No conda: CONDA_ROOT is read only on the conda path.
    #
    # The card comes from the runner's DEVICE_ID rather than the old hardcoded
    # `--device 6`, so the job schedules on any card in the pool.
    #
    # Checkout / install land under ./daily-a5-checkout — a dir distinct from
    # ci.yml's ./a5-checkout, because kill-orphaned-tasks matches tasks by
    # "$GITHUB_WORKSPACE/<checkout-path>". Sharing a dir would let one workflow's
    # cleanup kill the other's tasks on a shared workspace root.
    needs: toolchain
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    runs-on: [self-hosted, linux, npu-a5]
    defaults:
      run:
        working-directory: daily-a5-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/daily-a5-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared ci-cache/ccache dir still holds root-owned entries from the
      # container era; keep the umask that leaves new entries mutually writable.
      # The cache *paths* and CCACHE_NAMESPACE are derived by setup-ci-job from
      # the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./daily-a5-checkout — sparse-fetch
        # just the action defs at the workspace root first (clean: false leaves
        # sibling subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: daily-a5-checkout
          needs-device: 'true'
          pip-cache-name: pip-daily-a5
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          # Python and GCC come from the pypto-toolchain bundle, like every
          # other self-hosted job. The npu-a5 pool is provisioned with the
          # bundle and carries no conda env, so this is not optional here.
          toolchain: bundle

      - name: Run A5 system tests
        timeout-minutes: 60
        # Mechanism B: one task-submit card session wrapping a single pytest run,
        # executed in-process on the borrowed card. The `cd $GITHUB_WORKSPACE/
        # daily-a5-checkout` also puts this job's checkout dir into the task
        # command, which is how the cleanup step below finds THIS job's tasks.
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 3600 \
            --run "cd $GITHUB_WORKSPACE/daily-a5-checkout && source activate.sh && python -m pytest \
              tests/st/runtime/ops/test_assemble.py \
              tests/st/runtime/ops/test_gather.py \
              tests/st/runtime/ops/test_mscatter.py \
              tests/st/runtime/ops/test_random.py \
              tests/st/runtime/framework_and_models/test_qwen3_decode_scope3_mixed.py \
              tests/st/runtime/control_flow/test_dyn_orch_shape.py::TestDynOrchShapeOperations::test_dyn_orch_paged_attention \
              -v --forked --platform=a5 --device=\$TASK_DEVICE \
              -k 'not (test_tile_row_expand or test_fillpad_zero or test_fillpad_max or test_fillpad_min or TestMscatter)'"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: daily-a5-checkout

  qwen3-perf:
    # Qwen3-14B decode performance monitoring (moved out of per-PR ci.yml).
    # Samples the L2-swimlane makespan several times and averages to absorb the
    # ~8.5% run-to-run jitter, then compares against the committed baseline.
    #
    # No container: each perf sample borrows an NPU via `task-submit --device
    # auto` (mechanism B), so the job holds no card and runs on a CPU runner.
    # Host setup mirrors dist-system-tests (toolchain bundle + venv + activate.sh).
    needs: toolchain
    # Perf sampling only reads the repo — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the device runner and pin task-submit to its card (see
    # ci.yml system-tests). FLIP TO PROD: cpu runner + `--device auto`.
    runs-on: [self-hosted, linux, npu]
    defaults:
      run:
        working-directory: perf-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/perf-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./perf-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: perf-checkout
          needs-device: 'true'
          pip-cache-name: pip-perf
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          toolchain: bundle

      - name: Clone pypto-lib (Qwen3-14B decode forward)
        # $GITHUB_WORKSPACE/pypto-lib is a sibling of the perf-checkout checkout
        # path, so actions/checkout won't clean it on a persistent self-hosted
        # runner — a leftover dir from a previous run makes `git clone` fail with
        # "destination path already exists". Remove it first.
        run: |
          rm -rf "$GITHUB_WORKSPACE/pypto-lib"
          git clone --depth 1 https://github.com/hw-native-sys/pypto-lib.git "$GITHUB_WORKSPACE/pypto-lib"

      - name: Install pypto-lib runner dependencies
        run: |
          source activate.sh
          # uv, not pip: this job asks for toolchain: bundle, and that venv is
          # built by `uv venv` and carries no pip.
          #
          # torch is deliberately NOT named here, though the samples need it.
          # setup-ci-job installs it at a pin and from the CPU index, and naming
          # it again would either duplicate that pin — two places to keep in step
          # on the next bump — or, bare as it was, let a future divergence
          # resolve `torch` from PyPI, whose aarch64 wheel drags in the entire
          # CUDA stack on an Ascend host. One owner for that decision.
          uv pip install nanobind  # version from build-constraints.txt (UV_CONSTRAINT)

      - name: Run Qwen3-14B decode perf samples (L2 swimlane, 5x)
        id: qwen3_perf_run
        continue-on-error: true   # perf signal is advisory; never fail the job
        shell: bash   # bash adds `-eo pipefail`; per-run `|| echo` keeps the loop resilient
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        # Each sample borrows a card via task-submit; its stdout streams back and
        # is tee'd (carrying "Total Test Time: <X> us") into one log perf_guard
        # averages over. Host job (no container) → $GITHUB_WORKSPACE is the host
        # path, so the log location is unambiguous.
        run: |
          source activate.sh
          : > "$GITHUB_WORKSPACE/qwen3_perf.log"   # truncate any stale log
          for i in $(seq 1 5); do
            echo "=== qwen3 decode perf sample $i/5 ==="
            task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
              --run "source $GITHUB_WORKSPACE/perf-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/qwen3_14b/decode_fwd.py -p a2a3 -d \$TASK_DEVICE --enable-l2-swimlane --max-seq --seed 1234" \
              2>&1 | tee -a "$GITHUB_WORKSPACE/qwen3_perf.log" \
              || echo "WARN: perf sample $i exited non-zero"
          done

      - name: Qwen3-14B decode perf guard (warn-only, avg of samples)
        if: always()
        continue-on-error: true   # regression -> yellow warning on this step, job stays green
        run: >-
          source activate.sh &&
          python .github/scripts/perf_guard.py
          --log "$GITHUB_WORKSPACE/qwen3_perf.log"
          --baseline .github/perf_baselines/qwen3_14b_decode.json
          --name "qwen3-14b decode_fwd"
          --metric makespan_us

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: perf-checkout

  notify-on-failure:
    name: Open issue on failure
    needs: [a5-system-tests, qwen3-perf]
    if: |
      always() &&
      github.event_name == 'schedule' &&
      (needs.a5-system-tests.result == 'failure' ||
       needs.qwen3-perf.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update Daily CI failure issue
        uses: actions/github-script@v7
        env:
          A5_RESULT: ${{ needs.a5-system-tests.result }}
          QWEN3_PERF_RESULT: ${{ needs.qwen3-perf.result }}
        with:
          script: |
            const ISSUE_LABEL = 'daily-ci-failure';
            const ISSUE_TITLE = '[Daily CI] Failure';

            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;

            const failedJobs = [];
            if (process.env.A5_RESULT === 'failure') failedJobs.push('a5-system-tests');
            if (process.env.QWEN3_PERF_RESULT === 'failure') failedJobs.push('qwen3-perf');

            const body = [
              `Daily CI run failed on **${today}**.`,
              ``,
              `- Workflow run: ${runUrl}`,
              `- Commit: [\`${context.sha.slice(0, 7)}\`](${commitUrl})`,
              `- Branch: \`${context.ref}\``,
              `- Failed jobs: ${failedJobs.map(j => `\`${j}\``).join(', ') || 'unknown'}`,
              ``,
              `Please investigate the failure and either fix the underlying issue or update this issue with progress. Close this issue once Daily CI is green again.`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ISSUE_LABEL,
              per_page: 100,
            });

            const match = existing.data.find(issue => issue.title === ISSUE_TITLE);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              core.notice(`Appended failure comment to existing issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: ISSUE_TITLE,
                body,
                labels: [ISSUE_LABEL, 'bug'],
              });
              core.notice(`Created new Daily CI failure issue #${created.data.number}`);
            }
