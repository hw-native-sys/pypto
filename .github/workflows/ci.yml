      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./lib-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: lib-checkout
          needs-device: 'true'
          toolchain: bundle
          pip-cache-name: pip-lib
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}

      - name: Clone pypto-lib (Qwen3-14B + DeepSeek-V4-Flash models)
        # $GITHUB_WORKSPACE/pypto-lib is a sibling of lib-checkout, so
        # actions/checkout won't clean it on a persistent self-hosted runner — a
        # leftover dir from a previous run makes `git clone` fail with
        # "destination path already exists". Remove it first (mirrors daily_ci).
        run: |
          rm -rf "$GITHUB_WORKSPACE/pypto-lib"
          git clone --depth 1 https://github.com/hw-native-sys/pypto-lib.git "$GITHUB_WORKSPACE/pypto-lib"

      # Each model run borrows a card via task-submit for the whole `python ...`
      # invocation (compile + run). task-submit propagates the inner exit code,
      # so a model crash fails the step. $TASK_DEVICE is the lent card.
      - name: Run pypto-lib Qwen3-14B decode example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/qwen3_14b/decode_fwd.py -p a2a3 -d \$TASK_DEVICE"

      # Prefill exercises the dynamic-shape host path that decode does not: its
      # token axis is a `pl.dynamic()` symbol, the per-layer temp is sized from
      # `pl.tensor.dim(...)`, and the layer result is reassigned to the same
      # loop-carried var. Regressions in cross-function dynamic-shape typing
      # surface here (and only here) before they reach pypto-serving.
      - name: Run pypto-lib Qwen3-14B prefill example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/qwen3_14b/prefill_fwd.py -p a2a3 -d \$TASK_DEVICE"

      # NOTE: Qwen3-14B decode performance monitoring (L2-swimlane makespan +
      # perf_guard) lives in the daily_ci.yml `qwen3-perf` job, not here. Per-PR
      # CI only checks functional correctness; perf is noisy (~8.5% jitter) and
      # is sampled daily with multiple runs averaged to keep the signal stable.

      - name: Run pypto-lib DeepSeek-V4-Flash decode_swa example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/decode_swa.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash decode_hca example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/decode_hca.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash decode_csa example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/decode_csa.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash prefill_csa example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/prefill_csa.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash prefill_hca example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/prefill_hca.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash prefill_swa example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/prefill_swa.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash moe example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 2 --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/moe.py -p a2a3 -d \$TASK_DEVICE --ep 2"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: lib-checkout

  mixed-kernel-tests-a5:
    # A5 (Ascend950) on-board coverage for MIXED KERNELS — InCore scopes holding
    # both Cube (AIC) and Vector (AIV) work, which ExpandMixedKernel splits into
    # an AIC + AIV pair wrapped in a Group (docs/en/dev/passes/21-expand_mixed_kernel.md).
    # Everything else in this workflow exercises that path on a2a3 (910B) only:
    # `system-tests*` run --platform=a2a3, and `system-tests-a5sim` runs the a5
    # profile in the SIMULATOR. This job is the first per-PR run of the mixed /
    # cross-core path on real A5 silicon.
    #
    # Scope — cross_core/test_cross_core.py, already validated on the a5 profile
    # elsewhere (it runs on a5sim in the job below), so a red result here means a
    # regression and not an unvalidated combination: V<->C tpush/tpop over all
    # three split modes (UP_DOWN / LEFT_RIGHT / none), multi-pipe, explicit
    # slot_num (arch-aware sizing), bidirectional-in-spmd.
    #
    # test_qwen3_decode_scope3_mixed.py is deliberately NOT here. It stalls on
    # board under --platform=a5 — PTO2 scheduler timeout, sub_class=S1
    # running-stalled, always inside the oproj_block mixed kernel, at a different
    # task index and core on every run. It is not a regression this job can gate
    # on: an on-board bisect over 71020585..e5aa8131 came back red at every point
    # INCLUDING 71020585 itself, the commit that passed here on 2026-08-13 on this
    # same runner and card, so no source change explains it. Restore this case
    # once the stall is understood.
    # Two cross_core cases are handled specially under --platform=a5; the first
    # on-board run of this job is what found them:
    #   - test_explicit_slot_num       DESELECTED via @pytest.mark.platforms.
    #                                  `local_slot_num` on
    #                                  pto.{aic,aiv}_initialize_pipe is an
    #                                  a2/a3-only operand — ptoas rejects it for
    #                                  the 950 frontend pipe lowering whatever
    #                                  its value — so the manual
    #                                  pl.{aic,aiv}_initialize_pipe route the case
    #                                  exercises does not exist on this arch. A
    #                                  platform limitation, not a defect awaiting
    #                                  a fix, so it is not xfail.
    #   - test_multiple_pipes_nosplit  XFAIL (strict) — every output element is
    #                                  wrong on 950 silicon; passes on a5sim and
    #                                  a2a3. 950 expects a fractal layout at the
    #                                  cross-core boundary, and the V->C adapter
    #                                  is inserted only by ExpandMixedKernel (the
    #                                  sole consumer of RequiresVtoCFractalAdapt),
    #                                  so a hand-written pl.tpush_to_aic pushes a
    #                                  bare ND tile the cube then reads as
    #                                  fractal. Strict because a layout mismatch
    #                                  is deterministic: an XPASS means the
    #                                  adapter now reaches manual pipes.
    # The xfail is attached as a marker rather than raised via pytest.xfail(),
    # which aborts before the body and could never report XPASS — the case runs
    # on every job, so a backend fix surfaces here instead of the verdict being
    # frozen at whatever the first on-board run produced.
    # Deliberately NOT here: the mixed suites carrying `@pytest.mark.platforms("a2a3")`
    # (syncall, sync_set_wait, split parity incl. split_aiv, tpush/grouped-tfree
    # valid-shape, split-reduce parity) — pytest deselects them under --platform=a5,
    # so listing them would only add collection noise; and test_fused_matmul_scatter.py,
    # whose test cases hardcode `get_backend_type() -> Ascend910B`, so under
    # --platform=a5 it would compile for 910B and run on A5 silicon. Widen this
    # list once those are made arch-agnostic.
    #
    # Setup is the standard device-job shape (same composite action / env as
    # `system-tests`), on the npu-a5 runner pool. That runner must satisfy the
    # setup-ci-job contract for a bundle job: CI_CACHE_ROOT / CANN_ROOT +
    # DEVICE_ID in its .env, the pypto-toolchain bundle installed, and
    # task-submit / npu-smi / ccache / git / curl on PATH. No conda: CONDA_ROOT
    # is read only on the conda path.
    # Checkout / install land under ./a5-checkout so they never collide with the
    # other jobs' trees on a shared self-hosted host.
    #
    # Lint gate (see the pre-commit job) — never claim an NPU slot for a tree that
    # doesn't lint. Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    runs-on: [self-hosted, linux, npu-a5]
    defaults:
      run:
        working-directory: a5-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/a5-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared ci-cache/ccache dir still holds root-owned entries from the
      # container era; keep the umask that leaves new entries mutually writable.
      # The cache *paths* and CCACHE_NAMESPACE are derived by setup-ci-job from
      # the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./a5-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: a5-checkout
          needs-device: 'true'
          pip-cache-name: pip-a5
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          # Python and GCC come from the pypto-toolchain bundle, like every
          # other self-hosted job. The npu-a5 pool is provisioned with the
          # bundle and carries no conda env, so this is not optional here.
          toolchain: bundle

      - name: Test mixed-kernel system tests (A5, on board)
        timeout-minutes: 60
        # Mechanism B: one task-submit card session wrapping a single pytest run
        # (no precompile pipeline), executed in-process on the borrowed card. The
        # suite is parametrized over the platform ids, so --platform=a5 selects
        # exactly the a5 variants and deselects the a2a3-marked ones.
        # --forked isolates each case's device init, as the daily a5 job does.
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 3600 \
            --run "cd $GITHUB_WORKSPACE/a5-checkout && source activate.sh && python -m pytest \
              tests/st/runtime/cross_core/test_cross_core.py \
              -v --forked --platform=a5 --device=\$TASK_DEVICE"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: a5-checkout

  system-tests-a5sim:
    # Lint gate (see the pre-commit job); `toolchain` is ungated and runs
    # alongside it.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    #
    # The gate is spelled out rather than left implicit because
    # `prebuild-wheels-github` joined `needs`: the default "skip when a
    # dependency failed" would let a failed prebuild skip this job, and a
    # skipped required context reads as satisfied. Lint still gates it exactly
    # as before; the prebuild only decides whether the install step has a wheel
    # to use.
    needs: [changes, toolchain, pre-commit, clang-tidy, prebuild-wheels-github]
    if: >-
      !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && needs.pre-commit.result == 'success'
      && (needs.clang-tidy.result == 'success' || needs.clang-tidy.result == 'skipped')
      && needs.toolchain.result == 'success'
    runs-on: ubuntu-latest
    env:
      PTOAS_ROOT: ${{ github.workspace }}/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      # Build inputs from build-constraints.txt; see the unit-tests job.
      PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
    container:
      image: ghcr.io/hw-native-sys/pypto/github-ci:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Same story as unit-tests: 7m52 of from-scratch compiling on run
      # 32452961616 because a GitHub-hosted runner keeps nothing between runs.
      # Kept as a separate cache from that job's on purpose — this one builds
      # inside ghcr.io/.../github-ci (ubuntu 22.04, gcc-15), unit-tests builds
      # on the runner image, and mixing objects from two toolchains in one
      # namespace is how a compile cache starts serving the wrong ones.
      # Both wheels come from prebuild-wheels-github, which runs in this same
      # image — so unlike the unit-tests job there is not even a container
      # boundary between building them and installing them.
      # Before the restore, and for the same reason the prebuild installs it:
      # actions/cache folds the compression method into the cache *version*, so
      # a reader without zstd asks for a `cache.tgz` version that a zstd-capable
      # writer never produced, and misses on an exact key match. This job shares
      # the prebuild's image, so whatever that job can write, this one must be
      # able to read -- fixing only the writer just moved the miss from
      # `unit-tests` (on the runner image, which has zstd) to here.
      #
      # A no-op once the image carries zstd; it is in the Dockerfile now, but
      # that only reaches a PR after the image is rebuilt on main.
      - name: Ensure zstd
        if: needs.prebuild-wheels-github.outputs.cache_key != ''
        run: |
          if ! command -v zstd >/dev/null; then
            apt-get update -qq &&
              apt-get install -y -qq --no-install-recommends zstd || true
          fi
          command -v zstd >/dev/null ||
            echo "::warning::zstd unavailable — the prebuilt wheel cache will miss"

      - name: Restore the prebuilt wheels
        if: needs.prebuild-wheels-github.outputs.cache_key != ''
        uses: actions/cache/restore@v4
        with:
          path: wheelhouse
          key: ${{ needs.prebuild-wheels-github.outputs.cache_key }}

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          whl="$(ls wheelhouse/pypto-*.whl 2>/dev/null | head -1)"
          if [ -n "$whl" ]; then
            echo "installing the prebuilt wheel: $whl"
            pip install "pypto[dev] @ file://$PWD/$whl"
          else
            echo "::warning::no prebuilt wheel — building in place"
            pip install -v .[dev]
          fi

      - name: Cache ptoas environment
        id: cache-ptoas
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ptoas-bin
          key: ptoas-x86_64-${{ env.PTOAS_VERSION }}-${{ env.PTOAS_SHA256 }}

      - name: Install ptoas
        if: steps.cache-ptoas.outputs.cache-hit != 'true'
        run: |
          PTOAS_PACKAGE_VERSION="${PTOAS_VERSION#v}"
          PTOAS_WHEEL_NAME="ptoas-${PTOAS_PACKAGE_VERSION}-cp310-cp310-manylinux_2_34_x86_64.whl"
          PTOAS_WHEEL="/tmp/$PTOAS_WHEEL_NAME"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/hw-native-sys/PTOAS/releases/download/${PTOAS_VERSION}/${PTOAS_WHEEL_NAME}" \
            -o "$PTOAS_WHEEL"
          echo "${PTOAS_SHA256}  $PTOAS_WHEEL" | sha256sum -c -
          rm -rf "$PTOAS_ROOT"
          python -m venv "$PTOAS_ROOT" --system-site-packages
          "$PTOAS_ROOT/bin/python" -m pip install "$PTOAS_WHEEL"
          "$PTOAS_ROOT/bin/ptoas" --version

      - name: Install simpler
        run: |
          whl="$(ls wheelhouse/simpler-*.whl 2>/dev/null | head -1)"
          if [ -n "$whl" ]; then
            echo "installing the prebuilt wheel: $whl"
            pip install "simpler @ file://$PWD/$whl"
          else
            echo "::warning::no prebuilt wheel — building in place"
            rm -rf ./runtime/build
            pip install -v ./runtime
          fi
          python -c "import pypto, simpler; print('env OK:', pypto.__file__)"

      - name: Test A5 system tests (simulator)
        # TestMscatter is deselected: the a5 simulator compiles incore kernels
        # against the runtime's bundled pto-isa, which still clones from the
        # stale PTO-ISA/pto-isa mirror (lacks pto::Coalesce) until the runtime
        # submodule is bumped past simpler #806. Re-enable once that lands.
        run: pytest tests/st/runtime/ops/test_assemble.py tests/st/runtime/ops/test_gather.py tests/st/runtime/ops/test_gatherb.py tests/st/runtime/ops/test_mscatter.py tests/st/runtime/ops/test_prelu.py tests/st/runtime/ops/test_random.py tests/st/runtime/ops/test_sels.py tests/st/runtime/ops/test_tri.py tests/st/runtime/framework_and_models/test_qwen3_decode_scope3_mixed.py tests/st/runtime/control_flow/test_dyn_orch_shape.py::TestDynOrchShapeOperations::test_dyn_orch_paged_attention -v --platform=a5sim --forked -k "not TestMscatter"

      - name: Test A5 cross-core system tests (simulator)
        run: pytest tests/st/runtime/cross_core/test_cross_core.py -v --forked --platform=a5sim

      - name: Test A2A3 cross-core system tests (simulator)
        run: pytest tests/st/runtime/cross_core/test_cross_core.py -v --forked --platform=a2a3sim
