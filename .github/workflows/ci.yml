name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # DOCS-ONLY GATE — classifies a pull request's changed paths and, when every
  # one of them is documentation, elides the whole build/test pipeline below:
  # `clang-tidy`, `unit-tests`, `codegen-tests`, the four device jobs and
  # `system-tests-a5sim`. A prose-only change cannot break a build or a test, so
  # spending four in-house CPU / NPU slots (a scarce shared pool) on it
  # only delays every other PR in the queue.
  #
  # Two mechanisms, because one of them does not work for a matrix job:
  #  - every job except `unit-tests` is skipped outright via `if:`;
  #  - `unit-tests` runs with its expensive *steps* gated instead, since
  #    `jobs.<job_id>.if` is evaluated before `strategy.matrix` expands and a
  #    skipped matrix job never creates the per-matrix required contexts. The
  #    full reasoning, with the run that demonstrates it, is on that job.
  #
  # What still runs on a docs-only PR — the checks that actually validate docs:
  #  - `pre-commit`: markdownlint, `check-docs-en-zh-parity`, `check-docs-nav`,
  #    `check-english-only`, trailing whitespace / EOF. Free ubuntu runner.
  #  - the separate `Docs` workflow (docs.yml): `mkdocs build --strict`, which
  #    fails on a dead intra-docs link, a bad anchor, or a page missing from nav.
  #  - `toolchain`: seconds-long metadata read on a free GitHub-hosted runner,
  #    deliberately ungated here for the same reason it is ungated behind the
  #    lint gate — gating it would protect no scarce capacity.
  #
  # This cannot weaken the merge rule. The skipped jobs are required status
  # checks (repo ruleset "default"); each is a non-matrix job, so skipping it
  # still creates a check run under its exact required context name with a
  # `skipped` conclusion, which required status checks count as satisfied. (This
  # is why the gate uses a job-level `if:` and not a workflow-level `paths`
  # filter: the filter creates no check run at all, leaving every required
  # context "expected" and the PR unmergeable.) `unit-tests` is the exception the
  # note above covers. Nothing becomes un-runnable either: pushing a single
  # non-documentation file to the PR flips the classification and the full
  # pipeline runs on the next event.
  #
  # Deliberately conservative — `docs_only` is true only for a `pull_request`
  # whose every changed path (both sides of a rename) matches the allowlist in the
  # step below, and only when the file list is provably complete. A `push` to
  # main, a `workflow_dispatch`, an API failure, an empty list and a truncated
  # list all fall through to the full pipeline, so a mis-detection costs CI time
  # rather than coverage.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      # `pull-requests: read` is what the PR files API below needs; nothing is
      # checked out or written.
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only a pull request has a well-defined "files this change touches"
          # list; everything else runs the full pipeline.
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            echo "event '$EVENT_NAME' is not a pull request -> full pipeline"
            exit 0
          fi

          # Every failure below writes docs_only=false and exits 0 rather than
          # letting the step die. A *failed* `changes` job would skip every job
          # that needs it (the promised conservative path is the FULL pipeline,
          # not a skip), and for the matrix `unit-tests` a skip is worse still --
          # see the note on that job.
          fail_open() {
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            echo "$1 -> full pipeline"
            exit 0
          }

          # `changed_files` is the PR's own count, used below to detect a
          # truncated file list. Read before the list so a failure here fails
          # open too.
          if ! expected="$(gh api "repos/$REPO/pulls/$PR_NUMBER" \
                             --jq '.changed_files')"; then
            fail_open 'PR metadata request failed'
          fi

          # The PR files API instead of a `git diff`: it needs no checkout at all
          # (let alone the fetch-depth: 0 clone a base..head diff would need) and
          # already reports the merge-base diff GitHub shows in the PR.
          #
          # One TSV row per file, carrying BOTH names: a rename reports its
          # destination in `filename` and its source in `previous_filename`, and
          # classifying only the destination would read `src/foo.cpp` renamed to
          # `docs/foo.md` as documentation while the build-relevant source path
          # disappeared.
          if ! files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
                          --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')"; then
            fail_open 'PR files request failed'
          fi

          # Empty list -> nothing to classify.
          if [ -z "$files" ]; then
            fail_open 'no changed files reported'
          fi

          # The endpoint caps out at 3000 files, and a truncated list is still
          # non-empty: every entry returned could be documentation while the code
          # change sits past the cap. Trust the list only when it accounts for
          # every file the PR reports.
          retrieved="$(printf '%s\n' "$files" | wc -l)"
          if [ "$retrieved" -ne "$expected" ]; then
            fail_open "file list truncated ($retrieved of $expected files)"
          fi

          # Allowlist. Every entry must be incapable of affecting a build or a
          # test result:
          #   docs/**    the documentation tree, including docs/requirements.txt
          #              (only the docs.yml toolchain reads it)
          #   **/*.md    prose anywhere -- README, .claude/ rules, docs pages.
          #
          # `docs_only` means "no build, no device tests". It does NOT mean the
          # change is inert: the user manual carries runnable code blocks that
          # `tests/docs/run_doc_examples.py` extracts and executes, so a doc edit
          # can break a real check. `docs_changed` below gates the `docs-examples`
          # job, which runs those blocks on the paths this fast path skips.
          # The markdown lint scripts (check_docs_nav / check_docs_en_zh_parity)
          # run in `pre-commit`, which stays ungated.
          #   mkdocs.yml site config, consumed only by docs.yml
          # `case` globs are not path-aware, so `*.md` matches at any depth.
          # One full pass, no early exit: `docs_only` and `docs_changed` are
          # independent questions, and short-circuiting on the first
          # non-documentation path would answer the second by file order alone.
          docs_only=true
          docs_changed=false
          while IFS="$(printf '\t')" read -r new_path old_path; do
            for f in "$new_path" "$old_path"; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/*) docs_changed=true ;;
              esac
              case "$f" in
                docs/*|*.md|mkdocs.yml) ;;
                *)
                  if [ "$docs_only" = 'true' ]; then
                    echo "non-documentation change: $f -> full pipeline"
                  fi
                  docs_only=false
                  ;;
              esac
            done
          done <<< "$files"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = 'true' ]; then
            echo "all $expected changed paths are documentation:"
            printf '%s\n' "$files" | cut -f1 | sed 's/^/  /'
          fi

  toolchain:
    # Single source of truth for the toolchain versions every device job uses.
    # ptoas is declared in toolchain/versions.env (pypto-owned); pto-isa is
    # DERIVED from the pinned runtime submodule's runtime/pto_isa.pin (the
    # runtime owns it and enforces build == run). Both are re-exported as outputs
    # consumed via `needs.toolchain.outputs.*`. Bumping the runtime submodule
    # moves pypto's pto-isa in lockstep.
    #
    # Only greps/reads pinned files (no build, no pip), so it runs on a
    # GitHub-hosted runner — the same as daily_ci.yml's toolchain job — instead of
    # occupying an in-house self-hosted slot behind a container.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pto_isa_commit: ${{ steps.read.outputs.PTO_ISA_COMMIT }}
      ptoas_version: ${{ steps.read.outputs.PTOAS_VERSION }}
      ptoas_sha256_aarch64: ${{ steps.read.outputs.PTOAS_SHA256_AARCH64 }}
      ptoas_sha256_x86_64: ${{ steps.read.outputs.PTOAS_SHA256_X86_64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Read pinned toolchain versions
        id: read
        run: |
          # ptoas: pypto-owned, from versions.env
          grep -E '^[A-Z0-9_]+=' toolchain/versions.env >> "$GITHUB_OUTPUT"
          # pto-isa: derived from the pinned runtime submodule (runtime owns it)
          commit="$(tr -d '[:space:]' < runtime/pto_isa.pin)"
          if ! printf '%s' "$commit" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error file=runtime/pto_isa.pin::expected a 40-char hex commit, got '$commit'"
            exit 1
          fi
          echo "PTO_ISA_COMMIT=$commit" >> "$GITHUB_OUTPUT"
          echo "pinned pto-isa (from runtime submodule): $commit"
      - name: Guard against un-centralized toolchain literals
        run: |
          status=0
          if grep -rn -- '--pto-isa''-commit' python/ tests/ .github/workflows/; then
            echo "::error::The PyPTO pto-isa commit override has been removed. Bump runtime/pto_isa.pin instead."
            status=1
          fi
          if grep -rnE 'git checkout [0-9a-f]{40}' .github/workflows/; then
            echo "::error::Hardcoded pto-isa commit found in a workflow. Use \${{ needs.toolchain.outputs.pto_isa_commit }}; pto-isa is bumped via the runtime submodule (runtime/pto_isa.pin)."
            status=1
          fi
          if grep -rnE 'PTOAS_SHA256(_[A-Z0-9]+)?: *[0-9a-f]{64}' .github/workflows/; then
            echo "::error::Hardcoded PTOAS_SHA256 found in a workflow. Reference needs.toolchain.outputs.ptoas_sha256_* and bump toolchain/versions.env instead."
            status=1
          fi
          exit $status

  # ---------------------------------------------------------------------------
  # LINT GATE — `pre-commit` + `clang-tidy` run first, on their own. Every other
  # test job lists both of them in its `needs` (the five jobs that also consume
  # `needs.toolchain.outputs.*` list `toolchain` alongside), so a formatting or
  # static-analysis failure short-circuits the run before any downstream job
  # claims a GitHub-hosted ubuntu slot or one of the in-house CPU / NPU
  # slots (a scarce shared pool).
  #
  # This cannot weaken the merge rule: `pre-commit` and `clang-tidy` are
  # themselves required status checks (repo ruleset "default" → Require status
  # checks), so when lint is red the merge is blocked by those two contexts
  # regardless of how the skipped downstream jobs report — a job skipped via a
  # failed `needs` reports `skipped`, which rulesets count as satisfied. Keep
  # both in that required list; the whole gate rests on it.
  #
  # Accepted trade-offs:
  #  - `clang-tidy` runs on the in-house *cpu* pool, so that pool is now a
  #    serialization point for the whole workflow: if it is saturated or offline,
  #    no test job starts. Its setup is not cheap either (per-job venv, pip
  #    install of cmake/ninja/nanobind + pinned clang-tidy, a full CMake
  #    configure), and that wall time is prepended to every test job on the green
  #    path. Accepted to keep a non-linting tree off the scarce device runners.
  #  - `codegen-tests` used to run concurrently with `clang-tidy` on that same
  #    self-hosted cpu pool (hence their separate checkout trees, so neither one's
  #    `git clean` wipes the other). They are serialized within a run now, which
  #    frees a slot for other PRs at the cost of self-hosted cpu wall time.
  #
  # `toolchain` is deliberately NOT gated: it is a seconds-long metadata read on
  # a free GitHub-hosted runner, so gating it would protect no scarce capacity
  # while pushing every device job's start back by its runtime. It runs
  # concurrently with the gate instead.
  # ---------------------------------------------------------------------------
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: pre-commit
      uses: pre-commit/action@v3.0.0
      with:
        extra_args: --all-files

  clang-tidy:
    # Build inputs come from build-constraints.txt rather than from whatever
    # PyPI offers today; pip applies a constraints file to build-dependency
    # installs too, so this reaches the CMake configure below. The path carries
    # this job's checkout directory: unlike unit-tests it checks out into
    # clang-tidy-checkout, and pip fails hard on a constraints file that is not
    # there.
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/clang-tidy-checkout/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/clang-tidy-checkout/build-constraints.txt
    # De-containered: runs host-native on the in-house CPU runner (same
    # infra as before, minus the localhost:5000/ci-py310 image). clang_tidy.py
    # generates compile_commands.json via a CMake configure (needs cmake / ninja /
    # nanobind and a C++ compiler) and pip-installs the pinned clang-tidy, so it
    # borrows the runner's conda py310 env for the toolchain. It never builds the
    # full extension or goes on-board, so it does NOT use setup-ci-job (no ptoas /
    # pto-isa / simpler / device) — just the conda env + a per-job venv.
    #
    # Checks out under ./clang-tidy-checkout so its `git clean` never wipes the
    # sibling codegen-checkout tree (both jobs share the cpu runner pool).
    #
    # Docs-only gate (see the `changes` job) — a prose-only PR touches no C++, and
    # skipping the gate here keeps the scarce cpu pool free.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: [self-hosted, linux, cpu]
    defaults:
      run:
        working-directory: clang-tidy-checkout
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        path: clang-tidy-checkout
        # Host-native on a persistent self-hosted runner now: don't leave the
        # token in the reused .git/config between runs (zizmor artipacked), same
        # as every setup-ci-job / action-defs checkout in these workflows.
        persist-credentials: false

    - name: Fetch base branch for diff
      if: github.event_name == 'pull_request'
      run: git fetch origin ${{ github.base_ref }} --depth=1

    - name: Derive pip cache dir from runner config
      # Read the host layout from the runner's .env (no absolute path in git); the
      # pip cache lives under CI_CACHE_ROOT like every other job's.
      shell: bash
      run: |
        set -uo pipefail
        for key in CI_CACHE_ROOT; do
          if [ -z "${!key:-}" ]; then
            echo "::error::$key is not set — add it to this runner's .env"
            exit 1
          fi
        done
        mkdir -p "$CI_CACHE_ROOT"
        echo "PIP_CACHE_DIR=$CI_CACHE_ROOT/pip-clang-tidy" >> "$GITHUB_ENV"
        # No bundle path is resolved here. The two steps below enter the bundle
        # through `pypto-toolchain export`, which resolves the same install root
        # and `current` symlink that `pypto-toolchain verify` resolves, so this
        # job cannot verify one bundle and lint with another. See the longer
        # note in .github/actions/setup-ci-job/action.yml.

    # The system image used to ship Ubuntu's clang-tidy 14, which predates checks
    # the project enables (misc-include-cleaner needs LLVM 17+) and skips them
    # silently. Install the version clang_tidy.py requires (single source of truth)
    # into a per-job venv on top of the toolchain bundle.
    - name: Bootstrap venv + install pinned clang-tidy
      shell: bash
      run: |
        # Same toolchain the build jobs use, so the compile_commands.json
        # clang-tidy reads is generated by the compiler the build actually uses.
        pypto-toolchain verify --require python=3.10 --require 'gcc>=15'
        # Enter the bundle verify just checked, via the tool's own resolution
        # rather than a path of ours. No ccache requirement here — this job sets
        # no CCACHE_NAMESPACE, so the #1139 floor is the build jobs' concern.
        bundle_env="$(pypto-toolchain export)" || exit 1
        eval "$bundle_env"
        command -v python3.10 g++-15 >/dev/null
        python3.10 -c 'import sys; assert sys.version_info[:2]==(3,10)'
        rm -rf venv
        python3.10 -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        # cmake / ninja / nanobind: clang_tidy.py configures CMake with
        # -DCMAKE_EXPORT_COMPILE_COMMANDS=ON and reads nanobind's cmake dir.
        # Versions come from build-constraints.txt via PIP_CONSTRAINT, so lint
        # reads the same headers the wheel is built against.
        pip install cmake ninja nanobind
        VERSION=$(python -c "import sys; sys.path.insert(0, 'tests/lint'); from clang_tidy import REQUIRED_VERSION; print(REQUIRED_VERSION)")
        pip install --retries 5 --timeout 60 "clang-tidy==${VERSION}"
        clang-tidy --version

    - name: Run clang-tidy
      shell: bash
      run: |
        bundle_env="$(pypto-toolchain export)" || exit 1
        eval "$bundle_env"
        source venv/bin/activate
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          python tests/lint/clang_tidy.py --strict-version --jobs=$(nproc) --diff-base=origin/${{ github.base_ref }}
        else
          python tests/lint/clang_tidy.py --strict-version --jobs=$(nproc)
        fi

  prebuild-wheels:
    # Build the pypto and simpler wheels ONCE PER MACHINE, into that host's
    # wheel cache, so the eight jobs below install them instead of each
    # rebuilding the same commit. Nothing depends on this job: setup-ci-job's
    # cache is a flock, so whichever job arrives at a cold key first becomes the
    # builder and the rest wait on it. Making the consumers `needs:` this one
    # would turn a helper into a hard gate — a saturated CPU pool would then
    # stall the whole workflow instead of just leaving the cache cold.
    #
    # The point is WHEN it runs, not that it runs. On run 32452961616 the heavy
    # jobs could not start until 06:10:38 because clang-tidy (in-house cpu,
    # 5m15) had to finish, and then each spent another ~3 min building. This job
    # starts as soon as pre-commit is green (06:07:25 on that run) and has the
    # wheels published before the gate opens, so the consumers install in
    # seconds and start testing ~3 minutes earlier.
    #
    # Gated on pre-commit but deliberately NOT on clang-tidy. The lint gate's
    # rule is "don't spend a scarce in-house slot on a tree that doesn't lint";
    # pre-commit is the cheap half of it (GitHub-hosted, ~2 min) and keeps that
    # promise, while waiting for clang-tidy would consume the entire head start
    # this job exists to create. Cost of the exception: a tree that passes
    # pre-commit but fails clang-tidy burns one cpu slot per architecture for
    # one build — against the seven builds it removes from every green run.
    #
    # One leg per architecture, because the cache it fills is the host's own
    # disk and the self-hosted fleet is no longer one machine. The `cpu` and
    # `npu` pools each span an aarch64 box (cpu-N / npu-N) and an x86_64 one
    # (infra024-cpu-x64-N / infra024-npu-a2a3-N), and #2525 dropped the `arm64`
    # pin from every consumer so a job lands on whichever is free — measured
    # over eight runs, 43% of cpu-pool jobs and half the npu ones go to the
    # x86_64 host. A single-arch prebuild would leave that host cold and those
    # jobs building in place, which is exactly what this removes. Each leg's
    # cpu runner shares a machine, and therefore a CI_CACHE_ROOT, with that
    # machine's npu runners, so warming from the cpu pool reaches both.
    #
    # `arm64` / `x64` are the labels the runner application applies on its own
    # (`ARM64` / `X64`); label matching is case-insensitive, and the lowercase
    # spelling is the one this repo has always used. They are the only thing in
    # `runs-on` that can distinguish the two machines.
    #
    # fail-fast: false — a leg is a cache warm-up, not a check. One host being
    # unreachable or short of disk must not cancel the other's build, and no
    # job `needs:` either of them, so neither can gate anything.
    #
    # The wheel key already carries the architecture (abi_tag comes from
    # EXT_SUFFIX), so the two legs cannot collide even if they somehow shared a
    # cache root: they write different slots.
    needs: [changes, toolchain, pre-commit]
    if: needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: [self-hosted, linux, "${{ matrix.arch }}", cpu]
    env:
      PTOAS_ROOT: ${{ github.workspace }}/prebuild-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      # Higher than the 16 every other job uses: this one is meant to be the
      # only pypto build on the box at the time, so it is not sharing cores with
      # seven siblings the way a build inside a test job is. The same number
      # serves both legs without measuring the second machine: each host already
      # runs several runner instances that are each allowed a 16-way build, so
      # one 48-way build is inside what it is provisioned to absorb.
      CMAKE_BUILD_PARALLEL_LEVEL: 48
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      # The whole job. setup-ci-job builds both wheels and publishes them to
      # $CI_CACHE_ROOT/wheels as a side effect of installing them, so there is
      # nothing to run afterwards — and a failure here is a real compile error,
      # surfaced once and ~5 minutes earlier than the eight jobs would.
      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: prebuild-checkout
          needs-device: 'false'
          toolchain: bundle
          pip-cache-name: pip-prebuild
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}

  prebuild-wheels-github:
    # prebuild-wheels for the GitHub-hosted jobs. Same idea, different
    # plumbing, because GitHub-hosted runners share no disk: there is nothing
    # for a flock to coordinate and nothing that survives the job, so the wheels
    # travel through actions/cache and the consumers take a real `needs:` edge.
    #
    # Named for whose runners it serves, not for an architecture. Both
    # consumers here are x86_64 and so is every GitHub-hosted runner, but the
    # self-hosted fleet has an x86_64 machine too, which `prebuild-wheels`
    # covers with a matrix leg. What separates this job from that one is the
    # disk: a host that keeps its cache between runs versus one that does not.
    #
    # Both x86_64 jobs compiled the extension from scratch on every run — 8m51
    # and 6m32 on run 32476058579 — and `unit-tests` was the last job in the
    # workflow to finish, i.e. the critical path was a build the machine next
    # door had already done. Building once here and installing twice takes that
    # off the path entirely.
    #
    # In the container, not on the runner image, and that direction is not
    # arbitrary. A wheel built here needs at most GLIBC_2.33 and
    # GLIBCXX_3.4.29 (measured on the built extension), which ubuntu-24.04's
    # 2.39 / 3.4.33 satisfy; built the other way round it could pick up symbols
    # the 22.04 container does not have. The consumers assert the result rather
    # than trusting it: each imports pypto right after installing, so a wheel
    # that does not load says so at second five with a message about ABI,
    # instead of surfacing as a puzzling test error later.
    #
    # `toolchain` is deliberately absent from `needs`: nothing here reads a
    # pinned version. simpler resolves its own pto-isa from
    # runtime/pto_isa.pin at build time, and no ptoas is installed.
    needs: [changes, pre-commit]
    if: needs.changes.outputs.docs_only != 'true'
    # `packages: read` is not decoration. Declaring a `permissions:` block at
    # all narrows GITHUB_TOKEN to exactly what it lists, and pulling the job
    # container is an authenticated ghcr.io read — so `contents: read` alone
    # fails the job before its first step with `Error response from daemon:
    # denied`. system-tests-a5sim uses the same image and needs no such line
    # only because it declares no permissions block and keeps the defaults.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hw-native-sys/pypto/github-ci:latest
    # Named rather than left to the default, which resolved to `sh -e {0}` in
    # this container on run 32502998994. Every step below is POSIX either way;
    # saying which shell runs them keeps it that way by choice.
    defaults:
      run:
        shell: bash
    outputs:
      cache_key: ${{ steps.key.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The workspace belongs to the runner user and these steps are root, so
      # git 2.34 stops at "detected dubious ownership" before it reads anything.
      # actions/checkout works around this for itself, in a temporary HOME that
      # no later step inherits, so say it again here -- once, before anything
      # that might shell out to git.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-x86_64-prebuild-${{ github.sha }}
          restore-keys: ccache-x86_64-prebuild-

      - name: Enable ccache
        run: |
          # In the image as of the Dockerfile change that landed with this, but
          # the image is only rebuilt on pushes to main that touch it, so a PR
          # can still run against an older one and has to install it.
          if ! command -v ccache >/dev/null || ! command -v zstd >/dev/null; then
            apt-get update -qq &&
              apt-get install -y -qq --no-install-recommends ccache zstd || true
          fi
          # zstd is not an optimisation here, it is correctness. actions/cache
          # folds the compression method into the cache *version*, so this
          # container -- which had no zstd -- saved a `cache.tgz` that the
          # zstd-capable runner image could never see: `unit-tests` asked for
          # the exact key this job had just written and was told "Cache not
          # found", every run, while `system-tests-a5sim` (same image, so same
          # compression) hit it every time. Installing zstd puts both consumers
          # on the same version.
          command -v zstd >/dev/null ||
            echo "::warning::zstd unavailable — the runner-image consumer will miss this cache"
          # The launcher is exported only once ccache is known to exist: naming
          # it unconditionally would hand CMake a compiler launcher that is not
          # on PATH, turning a missing optimisation into a failed build. A
          # missing ccache is meant to cost time and nothing else.
          if command -v ccache >/dev/null; then
            echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            ccache --version | head -1
          else
            echo "::warning::ccache unavailable — building without it"
          fi

      - name: Build the wheels
        env:
          # Deliberately small: the dir is tarred into the repo-wide 10 GB cache
          # quota on every main run, so it holds this build's objects and no more.
          CCACHE_MAXSIZE: 1G
        run: |
          python -m pip install --upgrade pip
          # Build inputs come from THIS checkout, not from the image. The image
          # does pin them against build-constraints.txt, but the copy that
          # existed when it was built -- and it is rebuilt only on a push to
          # main that touches it. With --no-build-isolation, [build-system]
          # requires is never consulted either, so without these two lines a PR
          # that edits build-constraints.txt silently built with the old tools,
          # while the self-hosted path (which has exported these since #2525)
          # honoured the edit. Same inputs on both paths or neither is
          # trustworthy.
          constraints="$PWD/build-constraints.txt"
          test -f "$constraints" || {
            echo "::error::build-constraints.txt missing at $constraints"
            exit 1
          }
          # Scoped to this one install rather than exported for the step. pip
          # rejects --build-constraint (PIP_BUILD_CONSTRAINT) outright when
          # --no-build-isolation is in play -- "ERROR: --build-constraint
          # cannot be used with --no-build-isolation" -- and it would be
          # meaningless there anyway: --no-build-isolation means pip installs
          # no build dependencies at all, so the only constraint that can bite
          # is the one applied right here, to the environment those builds go
          # on to use.
          PIP_CONSTRAINT="$constraints" PIP_BUILD_CONSTRAINT="$constraints" \
            pip install scikit-build-core nanobind cmake ninja
          command -v ccache >/dev/null && ccache -z || true
          # PYPTO_DEBUG_INFO_LEVEL for pypto only; simpler's CMake has no such
          # option and would warn about being handed one.
          SKBUILD_CMAKE_DEFINE=PYPTO_DEBUG_INFO_LEVEL=1 \
            pip wheel --no-build-isolation --no-deps -w wheelhouse .
          pip wheel --no-build-isolation --no-deps -w wheelhouse ./runtime
          command -v ccache >/dev/null && ccache -s || true
          ls -l wheelhouse

      # Content-addressed by the checkout's tree, exactly like the self-hosted
      # slots: a different tree is a different key, and a rebase or a re-run of
      # the same tree reuses one. Derived after the build rather than before it
      # so the suffix can name the versions that were actually resolved, not
      # the ones a file asked for: the image is a moving `:latest` whose rebuild
      # is not reproducible (an apt package, a base image, or a `cmake>=3.15`
      # can all float), so keying on the literal string "github-ci" let a wheel
      # built by different tools stay valid under an unchanged tree.
      - name: Derive the wheel cache key
        id: key
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          build_inputs="$(python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version
          names = ("cmake", "nanobind", "ninja", "scikit-build-core")
          def resolve(n):
              try:
                  return f"{n}=={version(n)}"
              except PackageNotFoundError:
                  return f"{n}=<absent>"
          print(" ".join(resolve(n) for n in names))
          PY
          )"
          echo "[build inputs] $build_inputs"
          test -n "$build_inputs" || {
            echo "::error::could not resolve the build inputs for the cache key"
            exit 1
          }
          b="$(printf '%s' "$build_inputs" | sha256sum | cut -c1-12)"
          key="wheels-x86_64-${tree}-github-ci-b${b}-g1"
          echo "cache_key=$key" >> "$GITHUB_OUTPUT"
          echo "wheel cache key: $key"

      - name: Publish the wheels
        uses: actions/cache/save@v4
        with:
          path: wheelhouse
          key: ${{ steps.key.outputs.cache_key }}

      # Main only, for the quota reason on the wheel cache above: a ccache saved
      # on a PR branch is visible to that branch alone.
      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-x86_64-prebuild-${{ github.sha }}

  unit-tests:
    # Build inputs come from build-constraints.txt rather than from whatever
    # PyPI offers today. Both variables on purpose: PIP_BUILD_CONSTRAINT is the
    # one pip applies to build dependencies, and PIP_CONSTRAINT is what older
    # pip honours for them -- this job upgrades pip to the latest release, so it
    # has to satisfy whichever is in force. Declared per job because this one
    # checks out at the workspace root; the jobs that check out into a
    # subdirectory get the path from setup-ci-job instead.
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
    # Lint gate (see the pre-commit job) — don't spend a runner on a tree that
    # doesn't lint.
    #
    # Docs-only gate (see the `changes` job) — THE ONE JOB THAT IS NOT SKIPPED
    # WHOLESALE. `jobs.<job_id>.if` is evaluated *before* `strategy.matrix` is
    # expanded, so a skipped matrix job produces a single check run named
    # `unit-tests` instead of the `unit-tests (<os>, 3.10)` context the ruleset
    # requires. Verified on run 30525415124, where the lint gate failed and
    # `commits/<sha>/check-runs` reports exactly one `unit-tests` / `skipped` —
    # no per-matrix contexts. Skipping this job on a docs-only PR would leave
    # the required context uncreated, i.e. permanently "expected", and the PR
    # unmergeable — the opposite of the intent.
    #
    # So the matrix always expands and the two expensive steps carry the
    # condition instead: on a docs-only PR the leg checks out, reports its
    # required context green, and finishes in seconds without building the C++
    # extension or running pytest. The runner is GitHub-hosted, so this costs
    # none of the scarce in-house capacity the gate exists to protect.
    #
    # The `if` must tolerate a *skipped* `clang-tidy` (a skipped dependency
    # otherwise skips its dependents, which would reintroduce the bug above),
    # while still refusing to run when lint actually failed.
    #
    # `prebuild-wheels-github` is in `needs` for ordering only, and the `if`
    # says nothing about its result on purpose. A failed prebuild must not skip
    # this job: a skipped required context counts as satisfied by the ruleset,
    # so gating on it would let a tree merge with its unit tests never run. The
    # install step falls back to building in place instead, which is what this
    # job did before the prebuild existed.
    needs: [changes, pre-commit, clang-tidy, prebuild-wheels-github]
    if: >-
      !cancelled()
      && needs.pre-commit.result == 'success'
      && (needs.clang-tidy.result == 'success' || needs.clang-tidy.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Single-leg matrix, deliberately kept as a matrix: the required status
      # check is named `unit-tests (ubuntu-latest, 3.10)`, and collapsing this
      # into a plain job would rename the context to `unit-tests` and leave the
      # required one permanently "expected". Linux is the only supported CI
      # platform — the target (Ascend NPU) has no macOS support, so a macOS leg
      # validated nothing the Linux leg does not.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # torch's CPU wheel is the heaviest thing this job downloads, so keep
        # pip's own cache between runs too. cache-dependency-path is explicit
        # because setup-python's default for pip is **/requirements.txt, and
        # this repo has none — leaving it out fails the step outright rather
        # than falling back to something.
        cache: pip
        cache-dependency-path: pyproject.toml

    # The wheel prebuild-wheels-github already built, rather than a second
    # build of the same tree. Restore-only: this job publishes nothing.
    - name: Restore the prebuilt wheels
      if: >-
        needs.changes.outputs.docs_only != 'true'
        && needs.prebuild-wheels-github.outputs.cache_key != ''
      uses: actions/cache/restore@v4
      with:
        path: wheelhouse
        key: ${{ needs.prebuild-wheels-github.outputs.cache_key }}

    # The two steps the docs-only gate actually elides — installing the
    # extension and running the suite. The job itself still runs, so both
    # required matrix contexts are created and reported green.
    - name: Install project and dependencies
      if: needs.changes.outputs.docs_only != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        whl="$(ls wheelhouse/pypto-*.whl 2>/dev/null | head -1)"
        if [ -n "$whl" ]; then
          echo "installing the prebuilt wheel: $whl"
          pip install "pypto[dev] @ file://$PWD/$whl"
        else
          # Reachable when the prebuild was skipped or its cache entry was
          # evicted. Slow but correct, and loud about which path it took.
          echo "::warning::no prebuilt wheel — building in place"
          pip install -v .[dev]
        fi
        # The wheel is built in ubuntu 22.04 and installed here on 24.04, so
        # assert the ABI holds instead of discovering it through a test error.
        python -c "import pypto; print('env OK:', pypto.__file__)"

    - name: Test unit tests
      if: needs.changes.outputs.docs_only != 'true'
      run: pytest tests/ut -n auto --maxprocesses 8 -v

    - name: Skipped (documentation-only change)
      if: needs.changes.outputs.docs_only == 'true'
      run: echo "Every changed path is documentation — no build, no tests."

  docs-examples:
    # The user manual's runnable code blocks, on the path examples-tests cannot
    # cover. That job is skipped for a documentation-only change -- which is
    # exactly when the blocks themselves are being edited -- so without this the
    # gate would never fire on the PRs that can break it.
    #
    # Gated on docs_changed rather than !docs_only: a code-only PR gets the same
    # blocks run inside examples-tests, against the code it changed.
    needs: [changes, toolchain, pre-commit]
    if: needs.changes.outputs.docs_changed == 'true'
    permissions:
      contents: read
    runs-on: [self-hosted, linux, cpu]
    defaults:
      run:
        working-directory: docs-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/docs-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/docs-checkout/pto-isa
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: docs-checkout
          needs-device: 'false'
          pip-cache-name: pip-docs
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}

      - name: Run the user manual's runnable code blocks
        run: |
          source activate.sh
          set -e
          python tests/docs/run_doc_examples.py --pages docs/en/user --check-parity -p a2a3sim

  examples-tests:
    # The distributed examples ladder — every example must compile
    # AND run with a passing golden on the simulator (a2a3sim), so the teaching
    # material cannot silently rot.
    #
    # No container: runs host-native on the shared CPU pool through the same
    # setup-ci-job as codegen-tests / pypto-lib-model, so the ptoas / pto-isa /
    # simpler builds reuse the persistent host caches (ccache, pip, ptoas)
    # instead of rebuilding in an ephemeral container on every PR.
    needs: [changes, toolchain, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # Pinned to aarch64, which is a workaround and not a fix.
    #
    # On the x86_64 host this job's last step fails at
    # docs/en/user/performance/01-task-granularity.md:161, where the a2a3sim
    # result of a fused add+exp is compared against torch. The input is fixed
    # (manual_seed(0)), yet two runs of the same tree on that host disagree
    # with each other: 22 mismatched elements on one, 12 on the next, while
    # the worst element is bit-identical both times. Identical input and
    # identical binary must not produce different device output.
    #
    # It is the job shape, not the host alone. `docs-examples` runs the very
    # same `run_doc_examples.py` invocation on the very same hosts and has
    # passed every time, and the difference is that there the doc blocks are
    # the first simulator work in the job, whereas here they run after the
    # distributed ladder (-d 0,1,2,3) and the teaching examples. Prior
    # simulator activity in the same job is contaminating the later run, which
    # also explains why the count of wrong elements moves while the extremes
    # do not.
    #
    # aarch64 does not show it: 12/12 green in CI, and the kernel run 8 times
    # in one process locally gives one bit-identical output that matches torch
    # exactly. So the pin buys a stable signal rather than hiding a failure
    # this job would otherwise catch.
    #
    # Cost: this job no longer draws from the x86_64 half of the cpu pool, so
    # it can queue behind the aarch64 box. Remove the arch label once the
    # contamination is fixed -- #2525 removed every other one deliberately,
    # and this should not become permanent.
    runs-on: [self-hosted, linux, arm64, cpu]
    defaults:
      run:
        working-directory: examples-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/examples-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # The cache *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are
      # derived by setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./examples-checkout —
        # sparse-fetch just the action defs at the workspace root first
        # (clean: false leaves sibling subdir checkouts on this persistent
        # runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: examples-checkout
          needs-device: 'false'
          toolchain: bundle
          pip-cache-name: pip-examples
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}

      - name: Run distributed examples on the simulator
        run: |
          source activate.sh
          set -e
          for ex in examples/distributed/*.py; do
            case "$ex" in */__init__.py) continue ;; esac
            echo "=== $ex ==="
            python "$ex" -p a2a3sim -d 0,1
          done
          # Alternate modes documented in the walkthroughs — every documented
          # invocation must be CI-validated too, or the teaching material rots.
          echo "=== examples/distributed/04_barrier.py --use-builtin ==="
          python examples/distributed/04_barrier.py -p a2a3sim -d 0,1 --use-builtin
          echo "=== examples/distributed/05_remote_load_store.py --mode store ==="
          python examples/distributed/05_remote_load_store.py -p a2a3sim -d 0,1 --mode store
          echo "=== examples/distributed/06_put_get.py --mode get ==="
          python examples/distributed/06_put_get.py -p a2a3sim -d 0,1 --mode get
          # Step 07 is rank-count-agnostic: the P=3 and P=4 legs are the
          # committed >=3-rank coverage for the general ring pattern (P=2 ran
          # in the default-mode loop above).
          echo "=== examples/distributed/07_dynamic_rank_count.py -d 0,1,2 ==="
          python examples/distributed/07_dynamic_rank_count.py -p a2a3sim -d 0,1,2
          echo "=== examples/distributed/07_dynamic_rank_count.py -d 0,1,2,3 ==="
          python examples/distributed/07_dynamic_rank_count.py -p a2a3sim -d 0,1,2,3
          # Steps 08-11: the all-reduce comparisons are only observable
          # at P=4 (P=2 collapses mesh/two-phase/ring into the same exchange); the
          # reveal runs both modes.
          echo "=== examples/distributed/08_allreduce_mesh.py -d 0,1,2,3 ==="
          python examples/distributed/08_allreduce_mesh.py -p a2a3sim -d 0,1,2,3
          echo "=== examples/distributed/09_allreduce_two_phase.py -d 0,1,2,3 ==="
          python examples/distributed/09_allreduce_two_phase.py -p a2a3sim -d 0,1,2,3
          echo "=== examples/distributed/10_allreduce_ring.py -d 0,1,2,3 ==="
          python examples/distributed/10_allreduce_ring.py -p a2a3sim -d 0,1,2,3
          echo "=== examples/distributed/11_allreduce_reveal.py -d 0,1,2,3 ==="
          python examples/distributed/11_allreduce_reveal.py -p a2a3sim -d 0,1,2,3
          echo "=== examples/distributed/11_allreduce_reveal.py --mode ring -d 0,1,2,3 ==="
          python examples/distributed/11_allreduce_reveal.py -p a2a3sim -d 0,1,2,3 --mode ring

      # The teaching ladders. These carry the manual's beginner/intermediate/
      # advanced/utils citations, so leaving them unrun let the pages point at
      # code nothing checked — the gap that let a silent no-write kernel sit in
      # the docs. They default to a2a3sim and need no arguments.
      - name: Run the teaching examples on the simulator
        run: |
          source activate.sh
          set -e
          for ex in examples/beginner/*.py examples/intermediate/*.py \
                    examples/advanced/*.py examples/utils/*.py; do
            case "$ex" in */__init__.py) continue ;; esac
            echo "=== $ex ==="
            python "$ex"
          done

      # The user manual's runnable blocks. Teaching code that is never executed
      # rots silently — a kernel can compile, run, write nothing, and still read
      # correctly on the page — so the manual itself is executed here.
      - name: Run the user manual's runnable code blocks
        run: |
          source activate.sh
          set -e
          python tests/docs/run_doc_examples.py --pages docs/en/user --check-parity -p a2a3sim

  codegen-tests:
    # Codegen-only: verifies IR → kernel/orch C++ generation without going
    # on-board. --codegen-only skips assembly (ptoas), pto-isa, simpler and
    # device execution (see tests/st/harness/core/test_runner.py), so this
    # runs on a CPU runner and never competes for NPU cards.
    #
    # No container: it used to run as root in localhost:5000/ci-py310, which
    # forced the root/ci-runner umask split on the shared ccache. Now it runs
    # host-native as ci-runner through the same setup-ci-job as the device jobs,
    # with needs-device:false (no NPU, no CANN) and install-toolchain:false (no
    # ptoas / pto-isa / simpler — codegen-only needs none). Checkout / install
    # land under ./codegen-checkout so they don't collide with other jobs' trees
    # on the shared self-hosted host.
    #
    # Lint gate (see the pre-commit job) — shares the self-hosted cpu pool with
    # clang-tidy, so it must not start until that pool's lint job is green.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: [self-hosted, linux, cpu]
    defaults:
      run:
        working-directory: codegen-checkout
    env:
      # No PTOAS_ROOT: install-toolchain:false means setup-ci-job never
      # assembles, so codegen-only needs no ptoas. pto-isa is resolved by
      # simpler from runtime/pto_isa.pin, which this job never installs.
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared ci-cache/ccache dir. Every job now runs as ci-runner (no container
      # root), but the dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* are derived by setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: codegen-checkout
          needs-device: 'false'
          install-toolchain: 'false'
          pip-cache-name: pip-codegen
          # The cpu runners carry the bundle too. This job is the cheapest way
          # to cover that runner class: no device, no ptoas, no simpler.
          toolchain: bundle

      - name: Test codegen (codegen-only, no device)
        # test_torch_codegen_paged_attention does a numeric golden compare whose
        # bf16/fp16 accumulation is sensitive to the host torch/BLAS build; it
        # drifts past tolerance on this CPU host, so it runs in the npu
        # system-tests job instead (it needs no device, only that environment).
        # `python -m pytest`, not bare `pytest`: the per-job venv is layered on
        # conda py310 with --system-site-packages, so pip leaves pytest's entry
        # point in the base env (already satisfied) and a bare `pytest` would run
        # under the base interpreter, which cannot see the venv-installed pypto.
        run: |
          source activate.sh
          python -m pytest tests/st/codegen -v --codegen-only \
            --ignore=tests/st/codegen/torch/test_torch_codegen_paged_attention.py

  system-tests:
    # Batched shard A (mechanism A): the HEAVY device_batch directories — all of
    # tests/st EXCEPT runtime/ops + runtime/cross_core. The batched `Test system
    # tests` step used to run ~7-15 min and dominated the whole job, so it is
    # split by directory across two jobs that run in parallel:
    #   - system-tests        (this job): device_batch on the heavy dirs (the
    #                                      model tests in framework_and_models +
    #                                      scheduling + control_flow dominate).
    #   - system-tests-direct (sibling)  : device_batch on ops + cross_core (cheap
    #                                      compiles) + all the direct-device
    #                                      (mechanism B) + DFX steps.
    # Measured on run 29468368196: this heavy batched shard ≈ 404s vs the light
    # ops/cross_core shard ≈ 80s — ops/cross_core have MANY tests but cheap
    # compiles, so the direct + DFX tail (~268s) is paired with them, not here.
    # Coverage is preserved: heavy dirs ∪ ops/cross_core = the original batched
    # scope, with no overlap (this shard --ignore's ops/cross_core). Both jobs do
    # their own (ccache-shared) build; keep them in sync on setup and on the
    # directory partition (re-check the balance if a heavy new dir is added).
    #
    # No container: compile + golden run card-free on this CPU host, and each
    # case's device run borrows an NPU from the host-level `task-submit --device
    # auto` queue (mechanism A; --execute-via-task-submit). The job therefore
    # holds no card and is no longer pinned to a single-device runner. Host setup
    # mirrors dist-system-tests (conda py310 + per-job venv + activate.sh) so the
    # CI job and the task-submit child share one filesystem / absolute path —
    # the compiled .o/.so in the precompile cache_dir are readable by the child
    # with no path translation.
    #
    # Checkout / install happen under ./st-checkout so they don't collide with
    # other jobs' workspaces.
    #
    # Lint gate (see the pre-commit job) — never claim an NPU slot for a tree
    # that doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the device runner so DEVICE_ID/DEVICE_ID exist and pin
    # task-submit to that card (validates the new compile-card-free + task-submit
    # execute flow deterministically). FLIP TO PROD: change this to
    # `[self-hosted, linux, cpu]` and drop --task-submit-device below so
    # cases borrow any free card via `--device auto`.
    runs-on: [self-hosted, linux, npu]
    defaults:
      run:
        working-directory: st-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/st-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./st-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: st-checkout
          needs-device: 'true'
          pip-cache-name: pip-st
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          # Python and GCC come from the pypto-toolchain bundle rather than a
          # per-machine conda env. Per job on purpose: clang-tidy is still on
          # conda, and a job is reverted by deleting this one line.
          toolchain: bundle

      - name: Test system tests (batched shard A — heavy dirs, all but ops/cross_core)
        timeout-minutes: 30
        # Mechanism A: compile + golden run card-free in the precompile pool;
        # each case's device run borrows an NPU via `task-submit --device auto`
        # (--execute-via-task-submit). No --device: the harness no longer owns a
        # card. cache_dir auto-lands under the repo's build_output (host-visible
        # to the task-submit child), cleaned at session end.
        #
        # SHARD A = the HEAVY batched dirs: device_batch on every dir EXCEPT
        # ops + cross_core (which are the cheap-compile shard, run in
        # `system-tests-direct`), plus the standing exclusions — distributed
        # (own multi-card job), codegen (own CPU --codegen-only job), and
        # test_dump_tag (its own --dump-args DFX step in the sibling job). The two
        # shards --ignore each other's dirs so no batched test runs twice.
        run: |
          source activate.sh
          # TEST MODE: --task-submit-device pins EVERY device run (batched + the
          # undiscovered-case tail) to this runner's card (DEVICE_ID) through
          # task-submit's per-card lock. FLIP TO PROD: cpu runner, drop
          # --task-submit-device, use --device auto (borrow any free card).
          # DEVICE_ID must be non-empty, else task-submit would auto-borrow a
          # host card this runner does not own (halMemCtl EACCES).
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          # `-m device_batch` (auto-applied to tests using test_runner.run):
          # compile + golden card-free, device run BATCHED via task-submit. The
          # `not device_batch` (direct @pl.jit / config=test_config) tests for
          # ALL dirs run in the `system-tests-direct` job.
          python -m pytest tests/st -v -m device_batch \
            --ignore=tests/st/distributed \
            --ignore=tests/st/codegen \
            --ignore=tests/st/runtime/ops \
            --ignore=tests/st/runtime/cross_core \
            --ignore=tests/st/runtime/framework_and_models/test_dump_tag.py \
            --precompile-workers=32 --execute-via-task-submit --execute-batch-size=64 \
            --task-queue-timeout=1800 --task-max-time=600 --task-submit-device="$DEVICE_ID"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: st-checkout

  system-tests-direct:
    # The complement of `system-tests`, sized to balance it:
    #   1. Batched shard B (mechanism A): device_batch on the LIGHT dirs — only
    #      runtime/ops + runtime/cross_core. These have many tests but cheap
    #      compiles (~80s measured vs ~404s for the heavy dirs in `system-tests`),
    #      so they are paired here with the direct + DFX tail.
    #   2. Direct-device (mechanism B): `-m 'not device_batch'` over ALL of
    #      tests/st (the in-process @pl.jit / config=test_config tests, including
    #      the direct tests under the heavy dirs that `system-tests` skips).
    #   3. DFX steps: paged-attention / multi-orch L2 / swimlane / dump-args.
    # Balance (run 29468368196): heavy batched ≈ 404s alone in `system-tests`;
    # here ≈ 80s batched + ~168s direct + ~100s DFX ≈ 348s, so the two jobs finish
    # within ~1 min of each other. Setup is identical to `system-tests` (same
    # composite action, same env) — keep the two in sync, including the shard
    # partition (ops/cross_core here must be exactly the dirs `system-tests`
    # --ignore's). This job checks out under ./st-direct-checkout so it never
    # collides with system-tests' ./st-checkout on the shared self-hosted host,
    # and cleans up its own orphaned task-submit tasks.
    #
    # Lint gate (see the pre-commit job) — never claim an NPU slot for a tree
    # that doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the device runner so DEVICE_ID exists and pin task-submit
    # to that card. FLIP TO PROD: change this to
    # `[self-hosted, linux, cpu]` and drop --task-submit-device / the
    # explicit --device below so cases borrow any free card via `--device auto`.
    runs-on: [self-hosted, linux, npu]
    defaults:
      run:
        working-directory: st-direct-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/st-direct-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./st-direct-checkout — sparse-fetch
        # just the action defs at the workspace root first (clean: false leaves
        # sibling subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: st-direct-checkout
          needs-device: 'true'
          toolchain: bundle
          pip-cache-name: pip-st-direct
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}

      - name: Test system tests (batched shard B — ops + cross_core, cheap compiles)
        timeout-minutes: 30
        # Mechanism A, complement of system-tests' heavy shard: device_batch on
        # ONLY runtime/ops + runtime/cross_core (the cheap-compile dirs, ~80s
        # measured). The heavy dirs run in `system-tests`. Selecting by directory
        # (not by --ignore of everything else) keeps this list short and explicit;
        # `system-tests` --ignore's these two dirs so nothing double-runs. Neither
        # dir contains distributed/codegen/dump_tag, so no --ignore is needed here.
        # Same precompile/task-submit flags as the heavy shard.
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          python -m pytest tests/st/runtime/ops tests/st/runtime/cross_core \
            -v -m device_batch \
            --precompile-workers=32 --execute-via-task-submit --execute-batch-size=64 \
            --task-queue-timeout=1800 --task-max-time=600 --task-submit-device="$DEVICE_ID"

      - name: Test direct-device (mechanism B — one card, in-process)
        timeout-minutes: 30
        # ALL `-m 'not device_batch'` tests across tests/st (both shards' dirs):
        # direct @pl.jit kernel calls / config=test_config (and no-fixture device
        # tests), which execute the device synchronously in-process and cannot be
        # batched. Wrap them whole in ONE task-submit card session and run
        # in-process on the borrowed card (--device=$TASK_DEVICE, no
        # --execute-via-task-submit): one device init for the step, pytest's native
        # full capture on failure. Selection is by marker, so mixed files split
        # per-test and new tests need no edit. swimlane is --ignore'd here — it runs
        # in its own flagged step. (paged_attention has its own step below — passing
        # it as an explicit path here collapses pytest's dir collection.)
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest \
              tests/st -v -m 'not device_batch' \
              --ignore=tests/st/distributed \
              --ignore=tests/st/codegen \
              --ignore=tests/st/runtime/framework_and_models/test_perf_swimlane.py \
              --device=\$TASK_DEVICE --platform=a2a3"

      - name: Test paged-attention codegen (numeric compare, in device env)
        # tests/st/codegen runs device-free in the CPU codegen-tests job, but this
        # one file's numeric golden compare is unstable on a CPU torch/BLAS build,
        # so it runs here in the device job's environment. Own step (in-process
        # via task-submit) because it lives under the --ignore'd tests/st/codegen.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest \
              tests/st/codegen/torch/test_torch_codegen_paged_attention.py \
              -v --device=\$TASK_DEVICE --platform=a2a3"

      - name: Test multi-orch L2 (isolated pytest invocation)
        # Mechanism B: a single forked pytest wrapped whole in task-submit (no
        # precompile pipeline here). A ``Worker(level=2)`` session leaves runtime
        # state that poisons the next ``Worker(level=3)`` init in the same
        # process, so this file runs in its own pytest invocation.
        timeout-minutes: 5
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/distributed/test_l2_multi_orch.py -v --device=\$TASK_DEVICE"

      - name: Test swimlane output
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/runtime/framework_and_models/test_perf_swimlane.py -v --device=\$TASK_DEVICE --platform=a2a3 --enable-chip-swimlane --forked"

      - name: Test dump-args output
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/runtime/framework_and_models/test_dump_tag.py -v --device=\$TASK_DEVICE --platform=a2a3 --dump-args --forked"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: st-direct-checkout

  dist-system-tests:
    # No container: HCCL needs host-only env (HCCL_LOGIC_SUPERPOD_ID, plugin
    # paths from set_env.sh). In docker the chip child silent-crashes in
    # comm_init.
    #
    # Checkout / install happen under ./dist-checkout so they don't collide
    # with system-tests' workspace (which is owned by container root and
    # would EACCES our ci-runner cleanup).
    #
    # Lint gate (see the pre-commit job) — never claim NPU slots for a tree that
    # doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the 2-device runner and pin task-submit to DEVICE_ID
    # (see system-tests). FLIP TO PROD: cpu runner + `--device auto --device-num 2`.
    #
    # Pinned to aarch64, which is a workaround and not a fix. Since #2525 gave
    # the `npu` pool a second host, the label spans an aarch64 box (runners
    # `npu-N`) and an x86_64 one (`infra024-npu-a2a3-N`), and this job's
    # communication cases do not survive the x86_64 half. Over the 19 most
    # recent completed runs: 11/11 green on aarch64, 3 green / 5 red on x86_64.
    #
    # The reason to pin is not the red check, it is that the failure WEDGES THE
    # CARD. A red run starts with one collective hanging --
    #   chip run lane is poisoned: finalize_native_run failed
    #   aclrtSynchronizeStreamWithTimeout (AICPU) failed: 507018
    # -- and from there the device cannot be re-entered at all: 207 subsequent
    # cases die in `simpler_init failed with code 507033`, and the recovery path
    # fails the same way (`force_reset_device: aclrtSetDevice(2) failed: 507033`,
    # `attach_current_thread: rtSetDevice(12) failed: 507033`). Both borrowed
    # cards end up unusable and CI cannot reset them itself.
    #
    # `infra024-npu-a2a3-1..10` are ten runner instances on ONE machine sharing
    # ONE set of cards, so cards left in that state are not contained to the job
    # that hit it. pypto-lib-model is pinned alongside this job as a precaution
    # for the same reason; see its comment for why that evidence is weaker.
    #
    # Two things this evidence does NOT establish, so do not repeat them as
    # fact. (1) That this job is the origin of the host's bad cards: over one
    # morning the x86_64 host showed a failure wave across ALL its npu jobs,
    # single-card `system-tests` / `system-tests-direct` included, and a
    # two-card run of this job passed in the middle of it -- which it could not
    # have done if the cards were globally wedged. A likelier reading is that
    # some cards are bad at any given time and this job, needing two, draws one
    # more often. (2) That the split is architectural: the 3 green x86_64 runs
    # interleave with the red ones in time, so this is that host's health, not
    # its ISA. Pinning buys a trustworthy signal; it does not diagnose the host.
    #
    # Cost: the job no longer draws from the x86_64 half of the npu pool, so it
    # can queue behind the aarch64 box for a two-card slot. #2525 dropped the
    # arch label from every self-hosted job deliberately; remove this one again
    # once multi-card comm stops wedging cards there -- it is not permanent.
    runs-on: [self-hosted, linux, arm64, npu]
    defaults:
      run:
        working-directory: dist-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/dist-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./dist-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: dist-checkout
          needs-device: 'true'
          toolchain: bundle
          pip-cache-name: pip-dist
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          unset-ring: 'true'

      - name: Test distributed system tests
        # The step clock includes both task-submit queueing and the device run.
        # Keep enough headroom for a typical ~10-minute suite after waiting for
        # a two-card slot; --max-time below still caps device execution at 30m,
        # so leave the step budget above that or the runner kills the task
        # before task-submit can report the cap cleanly.
        timeout-minutes: 45
        # Mechanism B (multi-card): borrow 2 NPUs via `task-submit --device auto
        # --device-num 2` for the whole pytest run; $TASK_DEVICE is the lent set
        # (comma-separated), passed to --device. The job no longer pins an
        # npu-2-device runner. activate.sh already unset PTO2_RING_* (they break
        # HCCL); task-submit preserves that env into the child.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 2 --timeout 3600 --max-time 1800 \
            --run "cd $GITHUB_WORKSPACE/dist-checkout && source activate.sh && python -m pytest tests/st/distributed -v --device=\$TASK_DEVICE --ignore=tests/st/distributed/test_l2_multi_orch.py"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: dist-checkout

  pypto-lib-model:
    # No container: each model run borrows an NPU from the host-level
    # `task-submit --device auto` queue (mechanism B — the whole `python
    # models/...` invocation, which compiles + runs in one process, is wrapped).
    # Host setup mirrors dist-system-tests (conda py310 + venv + activate.sh);
