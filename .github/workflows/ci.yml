name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # DOCS-ONLY GATE — classifies a pull request's changed paths and, when every
  # one of them is documentation, elides the whole build/test pipeline below:
  # `clang-tidy`, `unit-tests`, `codegen-tests`, the four device jobs and
  # `system-tests-a5sim`. A prose-only change cannot break a build or a test, so
  # spending four in-house arm64 CPU / NPU slots (a scarce shared pool) on it
  # only delays every other PR in the queue.
  #
  # Two mechanisms, because one of them does not work for a matrix job:
  #  - every job except `unit-tests` is skipped outright via `if:`;
  #  - `unit-tests` runs with its expensive *steps* gated instead, since
  #    `jobs.<job_id>.if` is evaluated before `strategy.matrix` expands and a
  #    skipped matrix job never creates the per-matrix required contexts. The
  #    full reasoning, with the run that demonstrates it, is on that job.
  #
  # What still runs on a docs-only PR — the checks that actually validate docs:
  #  - `pre-commit`: markdownlint, `check-docs-en-zh-parity`, `check-docs-nav`,
  #    `check-english-only`, trailing whitespace / EOF. Free ubuntu runner.
  #  - the separate `Docs` workflow (docs.yml): `mkdocs build --strict`, which
  #    fails on a dead intra-docs link, a bad anchor, or a page missing from nav.
  #  - `toolchain`: seconds-long metadata read on a free GitHub-hosted runner,
  #    deliberately ungated here for the same reason it is ungated behind the
  #    lint gate — gating it would protect no scarce capacity.
  #
  # This cannot weaken the merge rule. The skipped jobs are required status
  # checks (repo ruleset "default"); each is a non-matrix job, so skipping it
  # still creates a check run under its exact required context name with a
  # `skipped` conclusion, which required status checks count as satisfied. (This
  # is why the gate uses a job-level `if:` and not a workflow-level `paths`
  # filter: the filter creates no check run at all, leaving every required
  # context "expected" and the PR unmergeable.) `unit-tests` is the exception the
  # note above covers. Nothing becomes un-runnable either: pushing a single
  # non-documentation file to the PR flips the classification and the full
  # pipeline runs on the next event.
  #
  # Deliberately conservative — `docs_only` is true only for a `pull_request`
  # whose every changed path (both sides of a rename) matches the allowlist in the
  # step below, and only when the file list is provably complete. A `push` to
  # main, a `workflow_dispatch`, an API failure, an empty list and a truncated
  # list all fall through to the full pipeline, so a mis-detection costs CI time
  # rather than coverage.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      # `pull-requests: read` is what the PR files API below needs; nothing is
      # checked out or written.
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only a pull request has a well-defined "files this change touches"
          # list; everything else runs the full pipeline.
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "event '$EVENT_NAME' is not a pull request -> full pipeline"
            exit 0
          fi

          # Every failure below writes docs_only=false and exits 0 rather than
          # letting the step die. A *failed* `changes` job would skip every job
          # that needs it (the promised conservative path is the FULL pipeline,
          # not a skip), and for the matrix `unit-tests` a skip is worse still --
          # see the note on that job.
          fail_open() {
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "$1 -> full pipeline"
            exit 0
          }

          # `changed_files` is the PR's own count, used below to detect a
          # truncated file list. Read before the list so a failure here fails
          # open too.
          if ! expected="$(gh api "repos/$REPO/pulls/$PR_NUMBER" \
                             --jq '.changed_files')"; then
            fail_open 'PR metadata request failed'
          fi

          # The PR files API instead of a `git diff`: it needs no checkout at all
          # (let alone the fetch-depth: 0 clone a base..head diff would need) and
          # already reports the merge-base diff GitHub shows in the PR.
          #
          # One TSV row per file, carrying BOTH names: a rename reports its
          # destination in `filename` and its source in `previous_filename`, and
          # classifying only the destination would read `src/foo.cpp` renamed to
          # `docs/foo.md` as documentation while the build-relevant source path
          # disappeared.
          if ! files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
                          --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')"; then
            fail_open 'PR files request failed'
          fi

          # Empty list -> nothing to classify.
          if [ -z "$files" ]; then
            fail_open 'no changed files reported'
          fi

          # The endpoint caps out at 3000 files, and a truncated list is still
          # non-empty: every entry returned could be documentation while the code
          # change sits past the cap. Trust the list only when it accounts for
          # every file the PR reports.
          retrieved="$(printf '%s\n' "$files" | wc -l)"
          if [ "$retrieved" -ne "$expected" ]; then
            fail_open "file list truncated ($retrieved of $expected files)"
          fi

          # Allowlist. Every entry must be incapable of affecting a build or a
          # test result:
          #   docs/**    the documentation tree, including docs/requirements.txt
          #              (only the docs.yml toolchain reads it)
          #   **/*.md    prose anywhere -- README, .claude/ rules, docs pages. No
          #              test reads a markdown file; the lint scripts that do
          #              (check_docs_nav / check_docs_en_zh_parity) run in
          #              `pre-commit`, which stays ungated.
          #   mkdocs.yml site config, consumed only by docs.yml
          # `case` globs are not path-aware, so `*.md` matches at any depth.
          docs_only=true
          while IFS="$(printf '\t')" read -r new_path old_path; do
            for f in "$new_path" "$old_path"; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/*|*.md|mkdocs.yml) ;;
                *)
                  echo "non-documentation change: $f -> full pipeline"
                  docs_only=false
                  break 2
                  ;;
              esac
            done
          done <<< "$files"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = 'true' ]; then
            echo "all $expected changed paths are documentation:"
            printf '%s\n' "$files" | cut -f1 | sed 's/^/  /'
          fi

  toolchain:
    # Single source of truth for the toolchain versions every device job uses.
    # ptoas is declared in toolchain/versions.env (pypto-owned); pto-isa is
    # DERIVED from the pinned runtime submodule's runtime/pto_isa.pin (the
    # runtime owns it and enforces build == run). Both are re-exported as outputs
    # consumed via `needs.toolchain.outputs.*`. Bumping the runtime submodule
    # moves pypto's pto-isa in lockstep.
    #
    # Only greps/reads pinned files (no build, no pip), so it runs on a
    # GitHub-hosted runner — the same as daily_ci.yml's toolchain job — instead of
    # occupying an in-house self-hosted slot behind a container.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pto_isa_commit: ${{ steps.read.outputs.PTO_ISA_COMMIT }}
      ptoas_version: ${{ steps.read.outputs.PTOAS_VERSION }}
      ptoas_sha256_aarch64: ${{ steps.read.outputs.PTOAS_SHA256_AARCH64 }}
      ptoas_sha256_x86_64: ${{ steps.read.outputs.PTOAS_SHA256_X86_64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Read pinned toolchain versions
        id: read
        run: |
          # ptoas: pypto-owned, from versions.env
          grep -E '^[A-Z0-9_]+=' toolchain/versions.env >> "$GITHUB_OUTPUT"
          # pto-isa: derived from the pinned runtime submodule (runtime owns it)
          commit="$(tr -d '[:space:]' < runtime/pto_isa.pin)"
          if ! printf '%s' "$commit" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error file=runtime/pto_isa.pin::expected a 40-char hex commit, got '$commit'"
            exit 1
          fi
          echo "PTO_ISA_COMMIT=$commit" >> "$GITHUB_OUTPUT"
          echo "pinned pto-isa (from runtime submodule): $commit"
      - name: Guard against un-centralized toolchain literals
        run: |
          status=0
          if grep -rn -- '--pto-isa''-commit' python/ tests/ .github/workflows/; then
            echo "::error::The PyPTO pto-isa commit override has been removed. Bump runtime/pto_isa.pin instead."
            status=1
          fi
          if grep -rnE 'git checkout [0-9a-f]{40}' .github/workflows/; then
            echo "::error::Hardcoded pto-isa commit found in a workflow. Use \${{ needs.toolchain.outputs.pto_isa_commit }}; pto-isa is bumped via the runtime submodule (runtime/pto_isa.pin)."
            status=1
          fi
          if grep -rnE 'PTOAS_SHA256(_[A-Z0-9]+)?: *[0-9a-f]{64}' .github/workflows/; then
            echo "::error::Hardcoded PTOAS_SHA256 found in a workflow. Reference needs.toolchain.outputs.ptoas_sha256_* and bump toolchain/versions.env instead."
            status=1
          fi
          exit $status

  # ---------------------------------------------------------------------------
  # LINT GATE — `pre-commit` + `clang-tidy` run first, on their own. Every other
  # test job lists both of them in its `needs` (the five jobs that also consume
  # `needs.toolchain.outputs.*` list `toolchain` alongside), so a formatting or
  # static-analysis failure short-circuits the run before any downstream job
  # claims a GitHub-hosted ubuntu slot or one of the in-house arm64 CPU / NPU
  # slots (a scarce shared pool).
  #
  # This cannot weaken the merge rule: `pre-commit` and `clang-tidy` are
  # themselves required status checks (repo ruleset "default" → Require status
  # checks), so when lint is red the merge is blocked by those two contexts
  # regardless of how the skipped downstream jobs report — a job skipped via a
  # failed `needs` reports `skipped`, which rulesets count as satisfied. Keep
  # both in that required list; the whole gate rests on it.
  #
  # Accepted trade-offs:
  #  - `clang-tidy` runs on the in-house arm64 *cpu* pool, so that pool is now a
  #    serialization point for the whole workflow: if it is saturated or offline,
  #    no test job starts. Its setup is not cheap either (per-job venv, pip
  #    install of cmake/ninja/nanobind + pinned clang-tidy, a full CMake
  #    configure), and that wall time is prepended to every test job on the green
  #    path. Accepted to keep a non-linting tree off the scarce device runners.
  #  - `codegen-tests` used to run concurrently with `clang-tidy` on that same
  #    arm64 cpu pool (hence their separate checkout trees, so neither one's
  #    `git clean` wipes the other). They are serialized within a run now, which
  #    frees a slot for other PRs at the cost of arm64-cpu wall time.
  #
  # `toolchain` is deliberately NOT gated: it is a seconds-long metadata read on
  # a free GitHub-hosted runner, so gating it would protect no scarce capacity
  # while pushing every device job's start back by its runtime. It runs
  # concurrently with the gate instead.
  # ---------------------------------------------------------------------------
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: pre-commit
      uses: pre-commit/action@v3.0.0
      with:
        extra_args: --all-files

  clang-tidy:
    # De-containered: runs host-native on the in-house arm64 CPU runner (same
    # infra as before, minus the localhost:5000/ci-py310 image). clang_tidy.py
    # generates compile_commands.json via a CMake configure (needs cmake / ninja /
    # nanobind and a C++ compiler) and pip-installs the pinned clang-tidy, so it
    # borrows the runner's conda py310 env for the toolchain. It never builds the
    # full extension or goes on-board, so it does NOT use setup-ci-job (no ptoas /
    # pto-isa / simpler / device) — just the conda env + a per-job venv.
    #
    # Checks out under ./clang-tidy-checkout so its `git clean` never wipes the
    # sibling codegen-checkout tree (both jobs share the arm64 cpu runner pool).
    #
    # Docs-only gate (see the `changes` job) — a prose-only PR touches no C++, and
    # skipping the gate here keeps the scarce arm64 cpu pool free.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: [self-hosted, linux, arm64, cpu]
    defaults:
      run:
        working-directory: clang-tidy-checkout
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        path: clang-tidy-checkout
        # Host-native on a persistent self-hosted runner now: don't leave the
        # token in the reused .git/config between runs (zizmor artipacked), same
        # as every setup-ci-job / action-defs checkout in these workflows.
        persist-credentials: false

    - name: Fetch base branch for diff
      if: github.event_name == 'pull_request'
      run: git fetch origin ${{ github.base_ref }} --depth=1

    - name: Derive pip cache dir from runner config
      # Read the host layout from the runner's .env (no absolute path in git); the
      # pip cache lives under CI_CACHE_ROOT like every other job's.
      shell: bash
      run: |
        set -uo pipefail
        for key in CONDA_ROOT CI_CACHE_ROOT; do
          if [ -z "${!key:-}" ]; then
            echo "::error::$key is not set — add it to this runner's .env"
            exit 1
          fi
        done
        mkdir -p "$CI_CACHE_ROOT"
        echo "PIP_CACHE_DIR=$CI_CACHE_ROOT/pip-clang-tidy" >> "$GITHUB_ENV"

    # The system image used to ship Ubuntu's clang-tidy 14, which predates checks
    # the project enables (misc-include-cleaner needs LLVM 17+) and skips them
    # silently. Install the version clang_tidy.py requires (single source of truth)
    # into a per-job venv layered on the conda env.
    - name: Bootstrap venv + install pinned clang-tidy
      shell: bash
      env:
        CONDA_ENV: py310
      run: |
        source "$CONDA_ROOT/etc/profile.d/conda.sh"
        if ! conda activate "$CONDA_ENV"; then
          echo "::error::conda env '$CONDA_ENV' not found under $CONDA_ROOT"
          exit 1
        fi
        rm -rf venv
        python -m venv venv --system-site-packages
        source venv/bin/activate
        python -m pip install --upgrade pip
        # cmake / ninja / nanobind: clang_tidy.py configures CMake with
        # -DCMAKE_EXPORT_COMPILE_COMMANDS=ON and reads nanobind's cmake dir.
        pip install cmake ninja nanobind
        VERSION=$(python -c "import sys; sys.path.insert(0, 'tests/lint'); from clang_tidy import REQUIRED_VERSION; print(REQUIRED_VERSION)")
        pip install --retries 5 --timeout 60 "clang-tidy==${VERSION}"
        clang-tidy --version

    - name: Run clang-tidy
      shell: bash
      env:
        CONDA_ENV: py310
      run: |
        source "$CONDA_ROOT/etc/profile.d/conda.sh"
        conda activate "$CONDA_ENV"
        source venv/bin/activate
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          python tests/lint/clang_tidy.py --strict-version --jobs=$(nproc) --diff-base=origin/${{ github.base_ref }}
        else
          python tests/lint/clang_tidy.py --strict-version --jobs=$(nproc)
        fi

  unit-tests:
    # Lint gate (see the pre-commit job) — don't spend a runner on a tree that
    # doesn't lint.
    #
    # Docs-only gate (see the `changes` job) — THE ONE JOB THAT IS NOT SKIPPED
    # WHOLESALE. `jobs.<job_id>.if` is evaluated *before* `strategy.matrix` is
    # expanded, so a skipped matrix job produces a single check run named
    # `unit-tests` instead of the `unit-tests (<os>, 3.10)` context the ruleset
    # requires. Verified on run 30525415124, where the lint gate failed and
    # `commits/<sha>/check-runs` reports exactly one `unit-tests` / `skipped` —
    # no per-matrix contexts. Skipping this job on a docs-only PR would leave
    # the required context uncreated, i.e. permanently "expected", and the PR
    # unmergeable — the opposite of the intent.
    #
    # So the matrix always expands and the two expensive steps carry the
    # condition instead: on a docs-only PR the leg checks out, reports its
    # required context green, and finishes in seconds without building the C++
    # extension or running pytest. The runner is GitHub-hosted, so this costs
    # none of the scarce in-house capacity the gate exists to protect.
    #
    # The `if` must tolerate a *skipped* `clang-tidy` (a skipped dependency
    # otherwise skips its dependents, which would reintroduce the bug above),
    # while still refusing to run when lint actually failed.
    needs: [changes, pre-commit, clang-tidy]
    if: >-
      !cancelled()
      && needs.pre-commit.result == 'success'
      && (needs.clang-tidy.result == 'success' || needs.clang-tidy.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Single-leg matrix, deliberately kept as a matrix: the required status
      # check is named `unit-tests (ubuntu-latest, 3.10)`, and collapsing this
      # into a plain job would rename the context to `unit-tests` and leave the
      # required one permanently "expected". Linux is the only supported CI
      # platform — the target (Ascend NPU) has no macOS support, so a macOS leg
      # validated nothing the Linux leg does not.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # The two steps the docs-only gate actually elides — building the extension
    # and running the suite. The job itself still runs, so both required matrix
    # contexts are created and reported green.
    - name: Install project and dependencies
      if: needs.changes.outputs.docs_only != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -v .[dev]

    - name: Test unit tests
      if: needs.changes.outputs.docs_only != 'true'
      run: pytest tests/ut -n auto --maxprocesses 8 -v

    - name: Skipped (documentation-only change)
      if: needs.changes.outputs.docs_only == 'true'
      run: echo "Every changed path is documentation — no build, no tests."

  dsa-integration-tests:
    # The normal wheel intentionally keeps the optional adapter disabled. This
    # job builds the public solver package first, enables the adapter, and runs
    # the exporter/solver/validator/writeback tests with bounded parallelism.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - name: Checkout PyPTO
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Checkout dsa-solver
      uses: actions/checkout@v4
      with:
        repository: tonibohnlein/dsa-solver
        ref: f908eddbd63e37c8edbe1d3be37c213d429cbed7
        path: dsa-solver
        submodules: recursive
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Build and install dsa-solver
      run: |
        cmake -S dsa-solver -B dsa-solver/build -DCMAKE_BUILD_TYPE=Release -DDSA_ENABLE_MINIMALLOC_BASELINE=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/dsa-install"
        cmake --build dsa-solver/build --parallel 2
        cmake --install dsa-solver/build
    - name: Install DSA-enabled PyPTO
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        CMAKE_ARGS="-DPYPTO_ENABLE_DSA_SOLVER=ON -DCMAKE_PREFIX_PATH=$RUNNER_TEMP/dsa-install" pip install -v .[dev]
    - name: Test DSA adapter integration
      run: >-
        pytest tests/ut/codegen/test_memory_planner_switch.py
        tests/ut/ir/transforms/test_allocate_memory_addr_pass.py
         tests/ut/runtime/test_run_config.py::TestRunConfigCompileForwarding
         tests/ut/jit/test_decorator.py::TestCompileKwargForwarding
         -n 2 -v

  codegen-tests:
    # Codegen-only: verifies IR → kernel/orch C++ generation without going
    # on-board. --codegen-only skips assembly (ptoas), pto-isa, simpler and
    # device execution (see tests/st/harness/core/test_runner.py), so this
    # runs on a CPU runner and never competes for NPU cards.
    #
    # No container: it used to run as root in localhost:5000/ci-py310, which
    # forced the root/ci-runner umask split on the shared ccache. Now it runs
    # host-native as ci-runner through the same setup-ci-job as the device jobs,
    # with needs-device:false (no NPU, no CANN) and install-toolchain:false (no
    # ptoas / pto-isa / simpler — codegen-only needs none). Checkout / install
    # land under ./codegen-checkout so they don't collide with other jobs' trees
    # on the shared self-hosted host.
    #
    # Lint gate (see the pre-commit job) — shares the arm64 cpu pool with
    # clang-tidy, so it must not start until that pool's lint job is green.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: [self-hosted, linux, arm64, cpu]
    defaults:
      run:
        working-directory: codegen-checkout
    env:
      # No PTOAS_ROOT / PTO_ISA_ROOT: install-toolchain:false means setup-ci-job
      # never assembles or clones pto-isa, so codegen-only needs neither.
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared ci-cache/ccache dir. Every job now runs as ci-runner (no container
      # root), but the dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* are derived by setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: codegen-checkout
          needs-device: 'false'
          install-toolchain: 'false'
          pip-cache-name: pip-codegen

      - name: Test codegen (codegen-only, no device)
        # test_torch_codegen_paged_attention does a numeric golden compare whose
        # bf16/fp16 accumulation is sensitive to the host torch/BLAS build; it
        # drifts past tolerance on this CPU host, so it runs in the npu
        # system-tests job instead (it needs no device, only that environment).
        # `python -m pytest`, not bare `pytest`: the per-job venv is layered on
        # conda py310 with --system-site-packages, so pip leaves pytest's entry
        # point in the base env (already satisfied) and a bare `pytest` would run
        # under the base interpreter, which cannot see the venv-installed pypto.
        run: |
          source activate.sh
          python -m pytest tests/st/codegen -v --codegen-only \
            --ignore=tests/st/codegen/torch/test_torch_codegen_paged_attention.py

  system-tests:
    # Batched shard A (mechanism A): the HEAVY device_batch directories — all of
    # tests/st EXCEPT runtime/ops + runtime/cross_core. The batched `Test system
    # tests` step used to run ~7-15 min and dominated the whole job, so it is
    # split by directory across two jobs that run in parallel:
    #   - system-tests        (this job): device_batch on the heavy dirs (the
    #                                      model tests in framework_and_models +
    #                                      scheduling + control_flow dominate).
    #   - system-tests-direct (sibling)  : device_batch on ops + cross_core (cheap
    #                                      compiles) + all the direct-device
    #                                      (mechanism B) + DFX steps.
    # Measured on run 29468368196: this heavy batched shard ≈ 404s vs the light
    # ops/cross_core shard ≈ 80s — ops/cross_core have MANY tests but cheap
    # compiles, so the direct + DFX tail (~268s) is paired with them, not here.
    # Coverage is preserved: heavy dirs ∪ ops/cross_core = the original batched
    # scope, with no overlap (this shard --ignore's ops/cross_core). Both jobs do
    # their own (ccache-shared) build; keep them in sync on setup and on the
    # directory partition (re-check the balance if a heavy new dir is added).
    #
    # No container: compile + golden run card-free on this CPU host, and each
    # case's device run borrows an NPU from the host-level `task-submit --device
    # auto` queue (mechanism A; --execute-via-task-submit). The job therefore
    # holds no card and is no longer pinned to a single-device runner. Host setup
    # mirrors dist-system-tests (conda py310 + per-job venv + activate.sh) so the
    # CI job and the task-submit child share one filesystem / absolute path —
    # the compiled .o/.so in the precompile cache_dir are readable by the child
    # with no path translation.
    #
    # Checkout / install happen under ./st-checkout so they don't collide with
    # other jobs' workspaces.
    #
    # Lint gate (see the pre-commit job) — never claim an NPU slot for a tree
    # that doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the device runner so DEVICE_ID/DEVICE_ID exist and pin
    # task-submit to that card (validates the new compile-card-free + task-submit
    # execute flow deterministically). FLIP TO PROD: change this to
    # `[self-hosted, linux, arm64, cpu]` and drop --task-submit-device below so
    # cases borrow any free card via `--device auto`.
    runs-on: [self-hosted, linux, arm64, npu]
    defaults:
      run:
        working-directory: st-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/st-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/st-checkout/pto-isa
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./st-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: st-checkout
          needs-device: 'true'
          pip-cache-name: pip-st
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}

      - name: Test system tests (batched shard A — heavy dirs, all but ops/cross_core)
        timeout-minutes: 30
        # Mechanism A: compile + golden run card-free in the precompile pool;
        # each case's device run borrows an NPU via `task-submit --device auto`
        # (--execute-via-task-submit). No --device: the harness no longer owns a
        # card. cache_dir auto-lands under the repo's build_output (host-visible
        # to the task-submit child), cleaned at session end.
        #
        # SHARD A = the HEAVY batched dirs: device_batch on every dir EXCEPT
        # ops + cross_core (which are the cheap-compile shard, run in
        # `system-tests-direct`), plus the standing exclusions — distributed
        # (own multi-card job), codegen (own CPU --codegen-only job), and
        # test_dump_tag (its own --dump-args DFX step in the sibling job). The two
        # shards --ignore each other's dirs so no batched test runs twice.
        run: |
          source activate.sh
          # TEST MODE: --task-submit-device pins EVERY device run (batched + the
          # undiscovered-case tail) to this runner's card (DEVICE_ID) through
          # task-submit's per-card lock. FLIP TO PROD: cpu runner, drop
          # --task-submit-device, use --device auto (borrow any free card).
          # DEVICE_ID must be non-empty, else task-submit would auto-borrow a
          # host card this runner does not own (halMemCtl EACCES).
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          # `-m device_batch` (auto-applied to tests using test_runner.run):
          # compile + golden card-free, device run BATCHED via task-submit. The
          # `not device_batch` (direct @pl.jit / config=test_config) tests for
          # ALL dirs run in the `system-tests-direct` job.
          python -m pytest tests/st -v -m device_batch \
            --ignore=tests/st/distributed \
            --ignore=tests/st/codegen \
            --ignore=tests/st/runtime/ops \
            --ignore=tests/st/runtime/cross_core \
            --ignore=tests/st/runtime/framework_and_models/test_dump_tag.py \
            --precompile-workers=32 --execute-via-task-submit --execute-batch-size=64 \
            --task-queue-timeout=1800 --task-max-time=600 --task-submit-device="$DEVICE_ID"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: st-checkout

  system-tests-direct:
    # The complement of `system-tests`, sized to balance it:
    #   1. Batched shard B (mechanism A): device_batch on the LIGHT dirs — only
    #      runtime/ops + runtime/cross_core. These have many tests but cheap
    #      compiles (~80s measured vs ~404s for the heavy dirs in `system-tests`),
    #      so they are paired here with the direct + DFX tail.
    #   2. Direct-device (mechanism B): `-m 'not device_batch'` over ALL of
    #      tests/st (the in-process @pl.jit / config=test_config tests, including
    #      the direct tests under the heavy dirs that `system-tests` skips).
    #   3. DFX steps: paged-attention / multi-orch L2 / swimlane / dump-args.
    # Balance (run 29468368196): heavy batched ≈ 404s alone in `system-tests`;
    # here ≈ 80s batched + ~168s direct + ~100s DFX ≈ 348s, so the two jobs finish
    # within ~1 min of each other. Setup is identical to `system-tests` (same
    # composite action, same env) — keep the two in sync, including the shard
    # partition (ops/cross_core here must be exactly the dirs `system-tests`
    # --ignore's). This job checks out under ./st-direct-checkout so it never
    # collides with system-tests' ./st-checkout on the shared self-hosted host,
    # and cleans up its own orphaned task-submit tasks.
    #
    # Lint gate (see the pre-commit job) — never claim an NPU slot for a tree
    # that doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, pre-commit, clang-tidy]
    if: needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the device runner so DEVICE_ID exists and pin task-submit
    # to that card. FLIP TO PROD: change this to
    # `[self-hosted, linux, arm64, cpu]` and drop --task-submit-device / the
    # explicit --device below so cases borrow any free card via `--device auto`.
    runs-on: [self-hosted, linux, arm64, npu]
    defaults:
      run:
        working-directory: st-direct-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/st-direct-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/st-direct-checkout/pto-isa
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./st-direct-checkout — sparse-fetch
        # just the action defs at the workspace root first (clean: false leaves
        # sibling subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: st-direct-checkout
          needs-device: 'true'
          pip-cache-name: pip-st-direct
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}

      - name: Test system tests (batched shard B — ops + cross_core, cheap compiles)
        timeout-minutes: 30
        # Mechanism A, complement of system-tests' heavy shard: device_batch on
        # ONLY runtime/ops + runtime/cross_core (the cheap-compile dirs, ~80s
        # measured). The heavy dirs run in `system-tests`. Selecting by directory
        # (not by --ignore of everything else) keeps this list short and explicit;
        # `system-tests` --ignore's these two dirs so nothing double-runs. Neither
        # dir contains distributed/codegen/dump_tag, so no --ignore is needed here.
        # Same precompile/task-submit flags as the heavy shard.
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          python -m pytest tests/st/runtime/ops tests/st/runtime/cross_core \
            -v -m device_batch \
            --precompile-workers=32 --execute-via-task-submit --execute-batch-size=64 \
            --task-queue-timeout=1800 --task-max-time=600 --task-submit-device="$DEVICE_ID"

      - name: Test direct-device (mechanism B — one card, in-process)
        timeout-minutes: 30
        # ALL `-m 'not device_batch'` tests across tests/st (both shards' dirs):
        # direct @pl.jit kernel calls / config=test_config (and no-fixture device
        # tests), which execute the device synchronously in-process and cannot be
        # batched. Wrap them whole in ONE task-submit card session and run
        # in-process on the borrowed card (--device=$TASK_DEVICE, no
        # --execute-via-task-submit): one device init for the step, pytest's native
        # full capture on failure. Selection is by marker, so mixed files split
        # per-test and new tests need no edit. swimlane is --ignore'd here — it runs
        # in its own flagged step. (paged_attention has its own step below — passing
        # it as an explicit path here collapses pytest's dir collection.)
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest \
              tests/st -v -m 'not device_batch' \
              --ignore=tests/st/distributed \
              --ignore=tests/st/codegen \
              --ignore=tests/st/runtime/framework_and_models/test_perf_swimlane.py \
              --device=\$TASK_DEVICE --platform=a2a3"

      - name: Test paged-attention codegen (numeric compare, in device env)
        # tests/st/codegen runs device-free in the CPU codegen-tests job, but this
        # one file's numeric golden compare is unstable on a CPU torch/BLAS build,
        # so it runs here in the device job's environment. Own step (in-process
        # via task-submit) because it lives under the --ignore'd tests/st/codegen.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest \
              tests/st/codegen/torch/test_torch_codegen_paged_attention.py \
              -v --device=\$TASK_DEVICE --platform=a2a3"

      - name: Test multi-orch L2 (isolated pytest invocation)
        # Mechanism B: a single forked pytest wrapped whole in task-submit (no
        # precompile pipeline here). A ``Worker(level=2)`` session leaves runtime
        # state that poisons the next ``Worker(level=3)`` init in the same
        # process, so this file runs in its own pytest invocation.
        timeout-minutes: 5
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/distributed/test_l2_multi_orch.py -v --device=\$TASK_DEVICE"

      - name: Test swimlane output
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/runtime/framework_and_models/test_perf_swimlane.py -v --device=\$TASK_DEVICE --platform=a2a3 --enable-l2-swimlane --forked"

      - name: Test dump-args output
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/runtime/framework_and_models/test_dump_tag.py -v --device=\$TASK_DEVICE --platform=a2a3 --dump-args --forked"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: st-direct-checkout

