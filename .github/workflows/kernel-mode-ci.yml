name: Kernel Mode CI

on:
  pull_request:
    branches: [ "feat/kernel-mode-integration-test" ]

permissions:
  contents: read

concurrency:
  group: kernel-mode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for lint hooks
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: pre-commit
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files
