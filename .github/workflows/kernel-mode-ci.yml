name: Kernel Mode CI

on:
  pull_request:
    branches: [ "feat/kernel-mode-integration-test" ]

permissions:
  contents: read

concurrency:
  group: kernel-mode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for lint hooks
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: pre-commit
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      BASE_REF: ${{ github.base_ref }}
      CC: gcc
      CXX: g++
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Python for clang-tidy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch base branch for diff
        run: git fetch origin "$BASE_REF" --depth=1
      - name: Install pinned clang-tidy and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake ninja nanobind
          VERSION=$(python -c "import sys; sys.path.insert(0, 'tests/lint'); from clang_tidy import REQUIRED_VERSION; print(REQUIRED_VERSION)")
          python -m pip install --retries 5 --timeout 60 "clang-tidy==${VERSION}"
          clang-tidy --version
      - name: Run clang-tidy
        run: |
          source .claude/skills/testing/load-env.sh
          python tests/lint/clang_tidy.py --strict-version \
            --jobs="$PYPTO_BUILD_JOBS" --diff-base="origin/$BASE_REF"
