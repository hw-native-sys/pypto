name: Kernel Mode CI

on:
  pull_request:
    branches: [ "feat/kernel-mode-integration-test" ]

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: kernel-mode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for lint hooks
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: pre-commit
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      PYPTO_BUILD_JOBS: '2'
      PYPTO_TEST_JOBS: '2'
      TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build without optional runtimes
        run: |
          source .claude/skills/testing/load-env.sh
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          CMAKE_ARGS='-DPYPTO_BUILD_TORCH_NPU=OFF' python -m pip install -v '.[dev]'
          python -c "import importlib.util; assert importlib.util.find_spec('pypto._torch_npu') is None"
      - name: Kernel regression tests including optional import isolation
        run: |
          source .claude/skills/testing/load-env.sh
          mkdir -p test-results/kernel-mode
          source .github/scripts/kernel-mode-cases.sh unit
          python -m pytest "${cases[@]}" -n "$PYPTO_TEST_JOBS" -q --junitxml=test-results/kernel-mode/unit.xml
      - name: Unit test report
        if: always()
        run: python .github/scripts/kernel_ci_results.py --allow-skips test-results/kernel-mode/unit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-unit-results
          path: test-results/kernel-mode/
          if-no-files-found: error

  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pto_isa_commit: ${{ steps.read.outputs.PTO_ISA_COMMIT }}
      ptoas_version: ${{ steps.read.outputs.PTOAS_VERSION }}
      ptoas_sha256_aarch64: ${{ steps.read.outputs.PTOAS_SHA256_AARCH64 }}
      ptoas_sha256_x86_64: ${{ steps.read.outputs.PTOAS_SHA256_X86_64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Read pinned versions
        id: read
        run: |
          grep -E '^[A-Z0-9_]+=' toolchain/versions.env >> "$GITHUB_OUTPUT"
          commit="$(tr -d '[:space:]' < runtime/pto_isa.pin)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "PTO_ISA_COMMIT=$commit" >> "$GITHUB_OUTPUT"

  device-tests:
    name: device-tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: eager
            max-time: 1800
          - suite: capture
            max-time: 2400
    needs: toolchain
    # Each job needs one NPU; use the verified ARM64 pool for device execution.
    runs-on: [self-hosted, linux, ARM64, npu]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: kernel-mode-${{ matrix.suite }}
    env:
      PTOAS_ROOT: ${{ github.workspace }}/kernel-mode-${{ matrix.suite }}/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      PYPTO_BUILD_JOBS: '8'
      PYPTO_TEST_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '8'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
      TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
      KERNEL_SUITE: ${{ matrix.suite }}
      KERNEL_MAX_TIME: ${{ matrix.max-time }}
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false
      - name: Setup pinned SDK and toolchain
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: kernel-mode-${{ matrix.suite }}
          needs-device: 'true'
          toolchain: bundle
          pip-cache-name: pip-kernel-mode
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
      - name: Build the optional native adapter and test gate
        id: adapter
        run: |
          source activate.sh
          source .claude/skills/testing/load-env.sh
          # The shared setup uses the program CI's Torch version. Replace it
          # only in this job's isolated venv; leave shared wheels unchanged.
          torch_npu_release=https://gitee.com/ascend/pytorch/releases/download/v7.1.0.2-pytorch2.6.0
          wheel_dir=$(mktemp -d)
          trap 'rm -rf "$wheel_dir"' EXIT
          case "$(uname -m)" in
            aarch64)
              torch_index=https://download.pytorch.org/whl/cpu
              torch_npu_asset=torch_npu-2.6.0.post2-cp310-cp310-manylinux_2_28_aarch64.whl
              ;;
            x86_64)
              # Both packages must use the adapter's C++11 ABI on x86.
              torch_index=https://download.pytorch.org/whl/cpu-cxx11-abi
              torch_npu_asset=torch_npu-2.6.0.post2_cxx11.abi_x86_64.zip
              ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          uv pip install 'torch==2.6.0' --index-url "$torch_index"
          # post2 is an Ascend release asset, not a PyPI release. Fetch before
          # installing because Gitee rejects uv's download request.
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "${torch_npu_release}/${torch_npu_asset}" -o "$wheel_dir/$torch_npu_asset"
          if [[ "$torch_npu_asset" == *.zip ]]; then
            python - "$wheel_dir/$torch_npu_asset" <<'PYTHON'
          import pathlib
          import shutil
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(archive) as bundle:
              wheels = [name for name in bundle.namelist()
                        if pathlib.PurePosixPath(name).name.startswith("torch_npu-")
                        and "-cp310-cp310-" in name and name.endswith("x86_64.whl")]
              if len(wheels) != 1:
                  raise RuntimeError(f"Expected one CPython 3.10 x86 wheel, found {wheels}")
              target = archive.parent / pathlib.PurePosixPath(wheels[0]).name
              with bundle.open(wheels[0]) as source, target.open("wb") as output:
                  shutil.copyfileobj(source, output)
          PYTHON
          else
            torch_npu_sha=8302dfc710a6cdd717f6f7e29c879858dde328bf4a788c4e455147264e329aec
            printf '%s  %s\n' "$torch_npu_sha" "$wheel_dir/$torch_npu_asset" | sha256sum --check --strict
          fi
          uv pip install "$wheel_dir"/*.whl -r .github/requirements/kernel-mode.txt
          python -c 'import torch; assert torch._C._GLIBCXX_USE_CXX11_ABI, "Kernel adapter requires C++11 ABI"'
          python -c 'import torch_npu; import tbe'
          # setup-ci-job uses build/ for scikit-build's wheel cache. Its cached
          # SKBUILD_PROJECT_NAME would keep extensions out of the source tree.
          cmake -S . -B build/kernel-native -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPython_EXECUTABLE="$(command -v python)" \
            -Dnanobind_DIR="$(python -m nanobind --cmake_dir)" \
            -DPYPTO_DEBUG_INFO_LEVEL=1 \
            -DPYPTO_BUILD_TORCH_NPU=ON -DPYPTO_BUILD_TORCH_NPU_TESTS=ON
          cmake --build build/kernel-native --parallel "$PYPTO_BUILD_JOBS"
          PYTHONPATH="$PWD/python:$PWD/build/torch_npu_tests${PYTHONPATH:+:$PYTHONPATH}" \
            python -c 'from pypto.pypto_core import DataType; from pypto.torch.launch import _load_native; _load_native(); import _torch_npu_test'
      - name: Run ${{ matrix.suite }} device cases
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        run: |
          source activate.sh
          test -n "$DEVICE_ID"
          printf -v command 'cd %q && source activate.sh && bash .github/scripts/kernel-mode-device.sh %q' "$PWD" "$KERNEL_SUITE"
          mkdir -p test-results/kernel-mode
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time "$KERNEL_MAX_TIME" --run "$command" 2>&1 | \
            tee "test-results/kernel-mode/$KERNEL_SUITE-task.log"
      - name: Require complete device results
        if: ${{ always() && steps.adapter.outcome == 'success' }}
        run: |
          source activate.sh
          python .github/scripts/kernel_ci_results.py "test-results/kernel-mode/$KERNEL_SUITE.xml" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload device evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-device-${{ matrix.suite }}-results
          path: kernel-mode-${{ matrix.suite }}/test-results/kernel-mode/
          if-no-files-found: error
      - name: Kill orphaned device tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: kernel-mode-${{ matrix.suite }}

  summary:
    name: Kernel Mode required results
    if: always()
    # The matrix result succeeds only when both eager and capture jobs succeed.
    needs: [pre-commit, unit-tests, toolchain, device-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every required job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          results = json.loads(os.environ["RESULTS"])
          required = {"pre-commit", "unit-tests", "toolchain", "device-tests"}
          lines = ["## Kernel mode integration checks", "", "| Job | Result |", "| --- | --- |"]
          for name in sorted(required):
              outcome = results.get(name, {}).get("result", "missing")
              lines.append(f"| {name} | {outcome} |")
          lines += ["", "Device scope: A2/A3-family TRB on the chip recorded in the artifacts.",
                    "Capture requires warmup. A2 and A3 are not interchangeable coverage records.",
                    "HBG, A5, and full platform acceptance remain pending (09C)."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          raise SystemExit(0 if all(results.get(name, {}).get("result") == "success" for name in required) else 1)
          PYTHON
