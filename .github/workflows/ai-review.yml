name: AI Review

# This file must already exist on the default branch of the base repository.
# pull_request_target uses the trusted workflow from the base branch while the
# isolated container checks out and reviews untrusted code from the PR.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  # Retargets call this workflow after the previous approval has been revoked.
  workflow_call:

permissions: {}

env:
  CODEX_REVIEW_IMAGE: localhost:5000/pypto-codex-review@sha256:4a9bb9234cd214fdaacd82a7ba07145843d7c9eae843abe4f3f7ed3bf7a053ac
  CODEX_PROXY_IMAGE: localhost:5000/pypto-codex-proxy@sha256:632f77b3544d5c663cb08ac48b2150a7bfa6cb9bac0852fbcf620b1d4e284a6b
  CODEX_EGRESS_NETWORK: pypto-codex-egress
  CODEX_RELAY_CONTAINER: pypto-codex-proxy-relay
  CODEX_RELAY_PORT: "17895"

jobs:
  prepare:
    # Only these trusted entry points own review runs and their runner resources.
    if: >-
      (github.workflow_ref == format('{0}/.github/workflows/ai-review.yml@{1}', github.repository, github.ref) ||
       github.workflow_ref == format('{0}/.github/workflows/ai-review-retarget.yml@{1}', github.repository, github.ref)) &&
      (vars.AI_REVIEW_ENABLED || vars.CODEX_REVIEW_ENABLED) == 'true' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.draft == false &&
        (github.event.sender.type != 'Bot' || github.event.action == 'edited')) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.sender.type != 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: codex-prepare-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      issues: read
    outputs:
      ready: ${{ steps.context.outputs.ready }}
      number: ${{ steps.context.outputs.number }}
      head: ${{ steps.context.outputs.head }}
      base: ${{ steps.context.outputs.base }}
      base_ref: ${{ steps.context.outputs.base_ref }}
    steps:
      - name: Checkout trusted context collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Authorize trigger and collect current discussion
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          AI_REVIEW_RERUN_TOKEN: >-
            ${{ github.event_name == 'issue_comment' &&
            (secrets.AI_REVIEW_RERUN_TOKEN || secrets.CODEX_REVIEW_RERUN_TOKEN) || '' }}
        run: python .github/scripts/prepare_ai_review.py "$RUNNER_TEMP/discussion.json"
      - name: Upload review routing identity
        if: steps.context.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-target.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload discussion snapshot
        if: steps.context.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/discussion.json
          if-no-files-found: error
          retention-days: 1

  review:
    name: codex-review
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.ready == 'true' }}
    runs-on: [self-hosted, Linux, ARM64, cpu-codex]
    timeout-minutes: 20
    concurrency:
      group: codex-review-${{ needs.prepare.outputs.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    env:
      REVIEW_ARTIFACT_PREFIX: codex-review
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}

    outputs:
      number: ${{ needs.prepare.outputs.number }}
      head: ${{ needs.prepare.outputs.head }}
      base: ${{ needs.prepare.outputs.base }}
      completed: ${{ steps.model.outputs.completed }}
    steps:
      - &review_discussion
        name: Download discussion snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-review-context
      - name: Create a fresh review checkout directory
        id: workspace
        run: |
          set -Eeuo pipefail
          review_checkout=$(mktemp -d "$GITHUB_WORKSPACE/codex-review.XXXXXX")
          chmod 755 "$review_checkout"
          printf 'path=%s\n' "${review_checkout#"$GITHUB_WORKSPACE/"}" >>"$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: ${{ steps.workspace.outputs.path }}
          fetch-depth: 0
          filter: ""
          persist-credentials: false
          # Fork contents are reviewed only inside the credential-isolated container.
          allow-unsafe-pr-checkout: true

      - name: Fetch and verify complete review objects
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -Eeuo pipefail
          # Fetch complete ancestry and file contents before entering the sandbox.
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" "$TRUSTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          if git config --get-regexp \
            '^(extensions\.partialclone|remote\..*\.(promisor|partialclonefilter))$'
          then
            echo "Review checkout must not be a partial clone" >&2
            exit 1
          fi
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git rev-list --objects --missing=error \
            "$BASE_SHA" "$HEAD_SHA" "$merge_base" "$TRUSTED_WORKFLOW_SHA" >/dev/null
          # Render patches, including binary contents, without repository diff helpers.
          git --no-pager diff --no-ext-diff --no-textconv --binary \
            --ignore-submodules=none "$merge_base" "$HEAD_SHA" >/dev/null
          echo "Complete review diff verified: $merge_base..$HEAD_SHA"

      - name: Prepare review resource identities
        run: |
          set -Eeuo pipefail
          umask 077
          # Publish identities before starting Docker or writing credential material.
          echo "CODEX_RESOURCE_SUFFIX=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_ENV"
          auth_snapshot=$(mktemp "$RUNNER_TEMP/codex-auth.XXXXXX")
          echo "CODEX_AUTH_SNAPSHOT=$auth_snapshot" >>"$GITHUB_ENV"
          secret_patterns=$(mktemp "$RUNNER_TEMP/codex-secret-patterns.XXXXXX")
          echo "CODEX_SECRET_PATTERNS=$secret_patterns" >>"$GITHUB_ENV"

      - name: Review in an isolated container
        id: model
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.prepare.outputs.number }}
          REPOSITORY_ID: ${{ github.repository_id }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
        run: |
          set -Eeuo pipefail
          umask 077

          auth_file=/home/ci-runner/.codex-ci/auth.json
          auth_lock=/home/ci-runner/.codex-ci/auth.lock
          output="$RUNNER_TEMP/codex-review.json"
          schema="$RUNNER_TEMP/codex-review-schema.json"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git show "$TRUSTED_WORKFLOW_SHA:.github/ai-review-schema.json" >"$schema"
          review_policy=$(git show "$TRUSTED_WORKFLOW_SHA:.github/ai-review-prompt.txt")
          chmod 644 "$schema"
          discussion="$RUNNER_TEMP/ai-review-context/discussion.json"
          chmod 644 "$discussion"
          log="$RUNNER_TEMP/codex-review.log"
          events="$RUNNER_TEMP/codex-review-events.jsonl"
          session_tools="$RUNNER_TEMP/codex-session-tools"
          mkdir -p "$session_tools"
          session_reader="$session_tools/publish_ai_review.py"
          git show "$TRUSTED_WORKFLOW_SHA:.github/scripts/publish_ai_review.py" >"$session_reader"
          git show "$TRUSTED_WORKFLOW_SHA:.github/scripts/manage_ai_review_session.py" \
            >"$session_tools/manage_ai_review_session.py"
          # Only conversation rollouts and their index persist, never auth/config.
          session_volume="pypto-codex-sessions-${REPOSITORY_ID}-${PR_NUMBER}"
          index_volume="${session_volume}-index"
          auth_snapshot="$CODEX_AUTH_SNAPSHOT"
          secret_patterns="$CODEX_SECRET_PATTERNS"
          suffix="$CODEX_RESOURCE_SUFFIX"
          review_network="codex-review-${suffix}"
          proxy_container="codex-proxy-${suffix}"
          review_container="codex-agent-${suffix}"

          resource_labels=(
            --label "org.pypto.codex-review.repository=$REPOSITORY_ID"
            --label "org.pypto.codex-review.run=$GITHUB_RUN_ID"
            --label "org.pypto.codex-review.attempt=$GITHUB_RUN_ATTEMPT"
          )

          cleanup() {
            docker rm -f "$review_container" "$proxy_container" \
              "codex-session-init-$suffix" "codex-session-read-$suffix" "codex-session-write-$suffix" \
              >/dev/null 2>&1 || true
            docker network rm "$review_network" >/dev/null 2>&1 || true
            rm -f "$auth_snapshot" "$secret_patterns"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if [ ! -f "$auth_file" ] || [ -L "$auth_file" ]; then
            echo "Codex auth file is missing or is not a regular file" >&2
            exit 1
          fi
          if [ -L "$auth_lock" ]; then
            echo "Codex auth lock must not be a symbolic link" >&2
            exit 1
          fi

          # Serialize every consumer of this managed session. Take an
          # ephemeral snapshot so the untrusted review container never mounts
          # or writes the persistent host credential.
          exec 9>"$auth_lock"
          flock --exclusive 9
          command -v gh >/dev/null || { echo "GitHub CLI is required on the review runner" >&2; exit 1; }
          # Load only trusted host code; the PR checkout must never control cleanup.
          resource_cleaner="$session_tools/cleanup_ai_review_resources.py"
          git show "$TRUSTED_WORKFLOW_SHA:.github/scripts/cleanup_ai_review_resources.py" >"$resource_cleaner"
          python "$resource_cleaner"
          # Recheck under the same lock used by close cleanup, before creating volumes.
          session_status=$(python "$session_tools/manage_ai_review_session.py" review)
          if [ "$session_status" = skipped ]; then
            echo "Skipping a closed, draft, or obsolete PR review"
            exit 0
          fi
          test "$session_status" = ready
          jq --exit-status \
            '.auth_mode == "chatgpt" and
             (.tokens.refresh_token // "") != ""' \
            "$auth_file" >/dev/null
          cat "$auth_file" >"$auth_snapshot"
          jq --raw-output \
            '[.. | strings | select(length >= 16)] | unique[]' \
            "$auth_snapshot" >"$secret_patterns"

          contains_auth_material() {
            [ -s "$secret_patterns" ] && \
              grep --fixed-strings --quiet --file="$secret_patterns" "$@"
          }

          docker pull "$CODEX_REVIEW_IMAGE"
          docker pull "$CODEX_PROXY_IMAGE"
          docker network create \
            --internal \
            --opt com.docker.network.bridge.inhibit_ipv4=true \
            "${resource_labels[@]}" \
            "$review_network" >/dev/null

          # The dedicated runner provides this internal network and the
          # fixed-function relay as persistent, host-managed infrastructure.
          if ! egress_gateway=$(docker network inspect "$CODEX_EGRESS_NETWORK" \
            --format '{{(index .IPAM.Config 0).Gateway}}'); then
            echo "Codex egress network is unavailable" >&2
            exit 1
          fi
          if ! relay_state=$(docker container inspect "$CODEX_RELAY_CONTAINER" \
            --format '{{.State.Status}}/{{.State.Health.Status}}'); then
            echo "Codex proxy relay is unavailable" >&2
            exit 1
          fi
          if [ "$relay_state" != "running/healthy" ]; then
            echo "Codex proxy relay is not healthy: ${relay_state}" >&2
            exit 1
          fi

          # Only this fixed-function sidecar can reach the host relay. The
          # review network has no host gateway and no route to other networks.
          docker run --detach \
            --name "$proxy_container" \
            "${resource_labels[@]}" \
            --network "$CODEX_EGRESS_NETWORK" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 128m \
            --cpus 0.5 \
            --user 1002:1003 \
            --env "RELAY_TARGET_HOST=$egress_gateway" \
            --env "RELAY_TARGET_PORT=$CODEX_RELAY_PORT" \
            --entrypoint node \
            "$CODEX_PROXY_IMAGE" \
            /usr/local/libexec/pypto-codex-sidecar.mjs >/dev/null
          docker network connect --alias proxy \
            "$review_network" "$proxy_container"

          # Volumes are scoped to the immutable base repository ID and PR number.
          # Initialize ownership with trusted image code, no network or PR mount.
          docker run --rm --network none --read-only --cap-drop ALL --cap-add CHOWN --cap-add FOWNER \
            --name "codex-session-init-$suffix" "${resource_labels[@]}" \
            --security-opt no-new-privileges --user 0:0 \
            --mount "type=volume,src=$session_volume,dst=/sessions" \
            --mount "type=volume,src=$index_volume,dst=/state" \
            --entrypoint /bin/sh "$CODEX_REVIEW_IMAGE" \
            -ec 'chown 1002:1003 /sessions /state; chmod 700 /sessions /state'
          resume_args=()
          previous_session=$(docker run --rm --network none --read-only --cap-drop ALL \
            --name "codex-session-read-$suffix" "${resource_labels[@]}" \
            --security-opt no-new-privileges --user 1002:1003 \
            --mount "type=volume,src=$index_volume,dst=/state,readonly" \
            --entrypoint /bin/sh "$CODEX_REVIEW_IMAGE" \
            -ec 'if [ -f /state/review-session-id ]; then cat /state/review-session-id; fi')
          if [ -n "$previous_session" ]; then
            if [[ ! "$previous_session" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]; then
              echo "Invalid saved Codex session ID" >&2
              exit 1
            fi
            resume_args=(resume "$previous_session")
          fi
          attempt=1
          max_attempts=3
          # Codex uses bubblewrap for its inner read-only, no-network sandbox.
          # Docker's default seccomp profile blocks the required user namespace.
          while ! docker run --rm \
            --interactive \
            --name "$review_container" \
            "${resource_labels[@]}" \
            --hostname codex-review \
            --network "$review_network" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --security-opt seccomp=unconfined \
            --pids-limit 256 \
            --memory 2g \
            --cpus 4 \
            --user 1002:1003 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --mount "type=bind,src=$schema,dst=/review-schema.json,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --tmpfs /codex-home:rw,nosuid,nodev,size=64m,uid=1002,gid=1003,mode=0700 \
            --tmpfs /home/codex-review:rw,nosuid,nodev,size=64m,uid=1002,gid=1003,mode=0700 \
            --mount "type=volume,src=$session_volume,dst=/codex-home/sessions" \
            --mount "type=volume,src=$index_volume,dst=/codex-state" \
            --mount "type=bind,src=$discussion,dst=/review-discussion.json,readonly" \
            --env CODEX_HOME=/codex-home \
            --env HOME=/home/codex-review \
            --env HTTP_PROXY=http://proxy:7895 \
            --env HTTPS_PROXY=http://proxy:7895 \
            --env ALL_PROXY=http://proxy:7895 \
            --env NO_PROXY=localhost,127.0.0.1,::1,proxy \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            "$CODEX_REVIEW_IMAGE" \
            --model gpt-6.1-sol \
            --config 'model_reasoning_effort="high"' \
            --config 'sqlite_home="/codex-state"' \
            --sandbox read-only \
            --ask-for-approval never \
            exec "${resume_args[@]}" --json --output-schema /review-schema.json \
            "You are the Codex reviewer (<!-- pypto-codex-review -->). Base $BASE_SHA, head $HEAD_SHA.
            $review_policy" \
            <"$auth_snapshot" >"$events" 2>"$log"
          do
            echo "Codex review attempt ${attempt} failed" >&2
            if [ "$attempt" -ge "$max_attempts" ]; then
              if contains_auth_material "$log"; then
                echo "Codex failure log contained credential material; log withheld" >&2
              else
                command_stop="codex-review-$(tr -d '-' </proc/sys/kernel/random/uuid)"
                echo "::stop-commands::${command_stop}"
                tail -20 "$log" >&2
                echo "::${command_stop}::"
              fi
              echo "Codex review failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 10
          done

          if contains_auth_material "$events" "$log"; then
            : >"$events"
            : >"$log"
            echo "Codex output contained credential material; refusing to publish" >&2
            exit 1
          fi

          session_id=$(python "$session_reader" --extract-session "$events" "$output")
          if contains_auth_material "$output"; then
            : >"$output"
            echo "Codex result contained credential material; refusing to publish" >&2
            exit 1
          fi
          if [ -n "$previous_session" ] && [ "$session_id" != "$previous_session" ]; then
            echo "Codex did not resume the requested session" >&2
            exit 1
          fi
          # Publish the checkpoint only after a completed, schema-valid review.
          docker run --rm --network none --read-only --cap-drop ALL \
            --name "codex-session-write-$suffix" "${resource_labels[@]}" \
            --security-opt no-new-privileges --user 1002:1003 \
            --mount "type=volume,src=$index_volume,dst=/state" \
            --entrypoint /bin/sh "$CODEX_REVIEW_IMAGE" \
            -ec 'printf "%s\n" "$1" > /state/review-session-id.tmp; mv /state/review-session-id.tmp /state/review-session-id' \
            sh "$session_id"
          rm -f "$events"
          printf 'artifact=%s\ncompleted=true\n' "$output" >>"$GITHUB_OUTPUT"

      - name: Remove review containers and network
        if: ${{ always() }}
        timeout-minutes: 2
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -Eeuo pipefail
          # This separate runner step survives cancellation of the review shell.
          # Delete credential snapshots even when Docker cleanup fails.
          trap 'rm -f -- "${CODEX_AUTH_SNAPSHOT:-}" "${CODEX_SECRET_PATTERNS:-}"' EXIT
          filters=(
            --filter "label=org.pypto.codex-review.repository=$REPOSITORY_ID"
            --filter "label=org.pypto.codex-review.run=$GITHUB_RUN_ID"
            --filter "label=org.pypto.codex-review.attempt=$GITHUB_RUN_ATTEMPT"
          )
          containers=$(docker container ls --all --quiet --no-trunc "${filters[@]}")
          if [ -n "$containers" ]; then
            mapfile -t container_ids <<<"$containers"
            docker container rm --force "${container_ids[@]}"
          fi
          networks=$(docker network ls --quiet --no-trunc "${filters[@]}")
          if [ -n "$networks" ]; then
            mapfile -t network_ids <<<"$networks"
            docker network rm "${network_ids[@]}"
          fi

      - &upload_first
        name: Upload review result
        id: upload_review
        if: steps.model.outputs.completed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.REVIEW_ARTIFACT_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.model.outputs.artifact }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false
          overwrite: true

      - &upload_wait
        name: Wait before retrying review result upload
        if: ${{ !cancelled() && steps.upload_review.outcome == 'failure' }}
        run: sleep 10

      - &upload_retry
        name: Retry review result upload
        id: upload_review_retry
        if: ${{ !cancelled() && steps.upload_review.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.REVIEW_ARTIFACT_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.model.outputs.artifact }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false
          overwrite: true

      - &upload_final_wait
        name: Wait before final review result upload attempt
        if: ${{ !cancelled() && steps.upload_review_retry.outcome == 'failure' }}
        run: sleep 30

      - &upload_final
        name: Final review result upload attempt
        id: upload_review_final
        if: ${{ !cancelled() && steps.upload_review_retry.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.REVIEW_ARTIFACT_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.model.outputs.artifact }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false
          overwrite: true

      - name: Remove review checkout
        if: ${{ always() && steps.workspace.outputs.path != '' }}
        env:
          REVIEW_CHECKOUT: ${{ steps.workspace.outputs.path }}
        run: rm -rf -- "$GITHUB_WORKSPACE/$REVIEW_CHECKOUT"

  gemini:
    name: gemini-review
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.ready == 'true' }}
    runs-on: [self-hosted, Linux, ARM64, cpu-codex]
    timeout-minutes: 20
    concurrency:
      group: gemini-review-${{ needs.prepare.outputs.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    outputs:
      completed: ${{ steps.model.outputs.completed }}
    env:
      REVIEW_ARTIFACT_PREFIX: gemini-review
      GEMINI_REVIEW_IMAGE: localhost:5000/pypto-gemini-review@sha256:886e02ba2f1612d52f7c4ec76ff8b6d25e1b8c586be90ee3c006fcf52af0b99e
    steps:
      - name: Checkout trusted Gemini driver and review policy
        id: trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github

      - *review_discussion

      - name: Prepare read-only Gemini review inputs
        id: workspace
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -euo pipefail
          workdir=$(mktemp -d "$RUNNER_TEMP/gemini-review.XXXXXXXX")
          printf 'path=%s\n' "$workdir" >>"$GITHUB_OUTPUT"
          # Only these explicitly mounted files need to be readable by the container UID.
          umask 022
          mkdir "$workdir/input"
          cd "$workdir/input"
          git init --quiet --template= workspace
          git -C workspace -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            fetch --no-tags --no-recurse-submodules "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BASE_SHA" "$HEAD_SHA"
          git -C workspace config core.hooksPath /dev/null
          git -C workspace config core.symlinks false
          git -C workspace checkout --quiet --detach --no-recurse-submodules "$HEAD_SHA"
          test "$(git -C workspace rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C workspace rev-parse --is-shallow-repository)" = false
          git -C workspace rev-list --objects --missing=error "$BASE_SHA" "$HEAD_SHA" >/dev/null
          git -C workspace diff --no-color --no-ext-diff --no-textconv --binary --ignore-submodules=none \
            "$BASE_SHA...$HEAD_SHA" >pr.diff

      - name: Review in an isolated Gemini session
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ needs.prepare.outputs.number }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          REVIEW_DIR: ${{ steps.workspace.outputs.path }}
        run: python .github/scripts/run_gemini_review.py review --model gemini-4-neon-high --effort high "$REVIEW_DIR"

      - *upload_first
      - *upload_wait
      - *upload_retry
      - *upload_final_wait
      - *upload_final

      - name: Remove this attempt's Gemini review containers and private networks
        if: ${{ always() && steps.trusted.outcome == 'success' && steps.model.outcome != 'skipped' }}
        timeout-minutes: 2
        run: python .github/scripts/cleanup_ai_review_resources.py --current-gemini

      - name: Remove temporary Gemini review files
        if: ${{ always() && steps.workspace.outputs.path != '' }}
        env:
          REVIEW_DIR: ${{ steps.workspace.outputs.path }}
        run: rm -rf -- "$REVIEW_DIR"

  publish:
    needs: [prepare, review, gemini]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: codex-publish-${{ needs.prepare.outputs.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.prepare.outputs.number }}
      REVIEW_HEAD_SHA: ${{ needs.prepare.outputs.head }}
      REVIEW_BASE_SHA: ${{ needs.prepare.outputs.base }}
      REVIEW_BASE_REF: ${{ needs.prepare.outputs.base_ref }}

    steps:
      # Execute publisher code from the trusted workflow commit, never the PR head.
      - name: Checkout trusted publisher
        id: trusted
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download Gemini feedback
        id: gemini_result
        if: ${{ !cancelled() && steps.trusted.outcome == 'success' && needs.gemini.result == 'success' && needs.gemini.outputs.completed == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gemini-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gemini-review-artifact

      - name: Publish Gemini feedback on the reviewed commit
        id: gemini_feedback
        if: ${{ !cancelled() && steps.gemini_result.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_ai_review.py --gemini "$RUNNER_TEMP/gemini-review-artifact/response.txt"

      - name: Download Codex result
        id: codex_result
        if: >-
          !cancelled() && steps.trusted.outcome == 'success' &&
          needs.review.result == 'success' && needs.review.outputs.completed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-review-artifact

      - name: Publish Codex feedback and decide joint approval
        id: decision
        if: ${{ !cancelled() && steps.codex_result.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_APPROVE: ${{ vars.AI_REVIEW_AUTO_APPROVE || vars.CODEX_REVIEW_AUTO_APPROVE }}
          GEMINI_VERDICT: ${{ steps.gemini_feedback.outcome == 'success' && steps.gemini_feedback.outputs.verdict || '' }}
        run: python .github/scripts/publish_ai_review.py "$RUNNER_TEMP/codex-review-artifact/codex-review.json"

      - name: Withdraw prior approval when the decision could not complete
        if: ${{ always() && steps.trusted.outcome == 'success' && (cancelled() || steps.decision.outcome != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_ai_review.py --withdraw-current
