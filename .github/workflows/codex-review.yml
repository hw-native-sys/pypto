name: Codex Review

# This file must already exist on the default branch of the base repository.
# pull_request_target uses the trusted workflow from the default branch while
# checking out and reviewing untrusted code from the PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, ARM64, cpu-codex]
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure base commit is available
        run: |
          git fetch --no-tags --depth=1 \
            origin "${{ github.event.pull_request.base.sha }}"

      - name: Codex review
        env:
          CODEX_HOME: /home/ci-runner/.codex-ci

          # Only Codex uses the local mixed-port proxy.
          HTTP_PROXY: http://127.0.0.1:7895
          HTTPS_PROXY: http://127.0.0.1:7895
          ALL_PROXY: http://127.0.0.1:7895
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"

          output="$RUNNER_TEMP/codex-review.txt"
          log="$RUNNER_TEMP/codex-review.log"

          attempt=1
          max_attempts=3

          while ! codex review \
            --base "${{ github.event.pull_request.base.sha }}" \
            >"$output" 2>"$log"
          do
            echo "codex review attempt ${attempt} failed" >&2
            tail -20 "$log" >&2

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "codex review failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          output="$RUNNER_TEMP/codex-review.txt"

          if [ -s "$output" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body-file "$output"
          else
            echo "Review produced no output; skipping comment" >&2
          fi
