name: Docs

# Builds the documentation site from `docs/` and publishes it to GitHub Pages at
# https://www.pypto.ai/pypto/.
#
# Pull requests build only -- `mkdocs build --strict` turns broken links, pages
# missing from the nav, and every other warning into a failure, so a PR that
# breaks a cross-reference is caught before it reaches main.
#
# Publishing goes through actions/deploy-pages rather than a `gh-pages` branch,
# matching the runtime's docs job (hw-native-sys/simpler) and, more importantly,
# the repository's existing Pages configuration: its build type is already
# "GitHub Actions", under which nothing served from a `gh-pages` branch would be
# published at all. The `github-pages` environment restricts deployments to
# `main`, which is why the deploy job below is gated on that ref.
#
# The site is a build artifact and is never committed; the markdown under `docs/`
# stays the single source of truth.
#
# The central pilot can observe successful runs without changing publication.
# Set DOCS_SITE_PUBLISHER=central only after the website's artifact and route
# handoff are verified; notify-docs-site.yml controls the independent CI trigger.

on:
  push:
    branches: [ "main" ]
  pull_request:
  # Republish without a code change, and exercise the deploy path on demand.
  workflow_dispatch:

# Allow one deploy at a time; skip superseded runs rather than queueing them.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read shared theme revision
        id: theme
        shell: bash
        run: |
          theme_revision=$(cat docs/theme-revision.txt)
          if [[ ! "$theme_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docs/theme-revision.txt must contain a full Git commit SHA"
            exit 1
          fi
          printf 'revision=%s\n' "$theme_revision" >> "$GITHUB_OUTPUT"

      - name: Checkout shared documentation theme
        uses: actions/checkout@v4
        with:
          repository: hw-native-sys/hw-native-sys.github.io
          ref: ${{ steps.theme.outputs.revision }}
          path: .site-theme
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            .site-theme/docs-theme/constraints.txt

      # Deliberately not `pip install -e ".[docs]"`: that runs scikit-build-core
      # and builds the C++ extension. mkdocstrings reads `python/pypto` through
      # griffe, which parses statically, so the docs need neither a CANN toolkit
      # nor the built nanobind extension. The requirements file applies the
      # shared theme's constraints, matching local builds.
      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      # Fast, MkDocs-independent check: no page missing from the nav, no nav entry
      # pointing at a deleted file. Runs first so those failures are reported
      # without waiting for a full build. (docs/en <-> docs/zh parity is
      # enforced separately by the pre-commit job in ci.yml.)
      - name: Check nav coverage
        run: python tests/lint/check_docs_nav.py

      - name: Build site
        env:
          # Ref that scripts/mkdocs_hooks.py points repo links at. On a pull
          # request the new files do not exist on main yet, so link at the commit.
          DOCS_REF: ${{ github.event_name == 'push' && 'main' || github.sha }}
        # --strict fails on a dead intra-docs link, a page missing from nav, or a
        # bad anchor.
        run: mkdocs build --strict

      - name: Upload artifact
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          vars.DOCS_SITE_PUBLISHER != 'central'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only main publishes; a pull request builds to prove the docs still compile.
    # Switch only after the central artifact and Pages route have been verified.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.DOCS_SITE_PUBLISHER != 'central'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
