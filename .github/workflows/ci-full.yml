name: CI Full
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
      && format('CI full PR #{0} @{1} base:{2}', inputs.pr_number, inputs.head_sha, inputs.base_sha)
      || (github.event_name == 'pull_request'
          && format('CI full PR #{0} @{1} base:{2}', github.event.pull_request.number,
                    github.event.pull_request.head.sha, github.event.pull_request.base.sha))
      || format('CI {0} {1}', github.event_name, github.ref_name) }}

on:
  pull_request:
    branches: [ "integration/urma-ccu-test" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (normally supplied by /ci full; empty tests the selected branch)
        type: string
        default: ''
      head_sha:
        description: Authorized PR head SHA
        type: string
        default: ''
      base_sha:
        description: Authorized PR base SHA
        type: string
        default: ''
      merge_sha:
        description: Immutable test merge SHA with base/head parents
        type: string
        default: ''

# PR test code never receives Actions/status write credentials. Publishing the
# merge gate happens in ci-full-status.yml on a fresh GitHub-hosted runner.
permissions:
  contents: read

# Enforced by the cache service, including cache API calls made by PR code.
# Wheel transfer uses run artifacts; cache key naming is not a security boundary.
cache-mode: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.pr_number && format('full-run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  # ci.yml handles automatic main PR lint; integration PRs run this full workflow.
  # /ci full dispatches trusted main with immutable PR head/base/merge inputs.
  # Full PR runs deliberately disable the docs-only exemption for
  # core tests. docs-examples and serving-guard retain their applicability gates.
  changes:
    runs-on: ubuntu-latest
    permissions:
      # The classifier needs pull-requests: read. On dispatched full runs the
      # controller comes from trusted main and never executes the PR checkout.
      contents: read
      pull-requests: read
      actions: read
    outputs:
      full: ${{ steps.target.outputs.full }}
      reuse_lint: ${{ steps.target.outputs.reuse_lint }}
      checkout_sha: ${{ steps.target.outputs.checkout_sha }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      ptoas_version_changed: ${{ steps.classify.outputs.ptoas_version_changed }}
    steps:
      - name: Checkout CI controller
        uses: actions/checkout@v4
        with:
          # PR edits to ci_control.py cannot select the tier. The helper must
          # already exist on main; repository variables may be absent on forks.
          # PR workflow edits themselves still require runner-policy controls.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Validate and pin the test revision
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # Older base revisions still use the rollout flag in prepare. Pin
          # it on until those helpers are retired; never read it from vars.
          CI_COMMENT_TIERS_ENABLED: 'true'
        run: python .github/scripts/ci_control.py prepare
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ steps.target.outputs.full }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          PR_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only a pull request has a well-defined "files this change touches"
          # list; everything else runs the full pipeline.
          if [ -z "$PR_NUMBER" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            # `ptoas_version_changed` gates the serving guard, which is opt-in
            # on cost rather than conservative on correctness: the pin only
            # ever moves through a pull request, so a push to main re-running
            # it would buy no signal. workflow_dispatch stays true so the guard
            # can be forced by hand.
            if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
              echo "ptoas_version_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "ptoas_version_changed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "event '$EVENT_NAME' is not a pull request -> full pipeline"
            exit 0
          fi

          # Every failure below writes docs_only=false and exits 0 rather than
          # letting the step die. A *failed* `changes` job would skip every job
          # that needs it (the promised conservative path is the FULL pipeline,
          # not a skip), and for the matrix `unit-tests` a skip is worse still --
          # see the note on that job.
          fail_open() {
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            # Also open for the serving guard: an unreadable file list cannot
            # prove the pin did not move, and a toolchain bump reaching serving
            # unguarded is worth more than the cards a spurious run costs.
            echo "ptoas_version_changed=true" >> "$GITHUB_OUTPUT"
            echo "$1 -> full pipeline"
            exit 0
          }

          # Classify the immutable revisions selected by prepare. The mutable
          # pulls/{number}/files endpoint can describe another head after a push.
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            fail_open 'missing or invalid pinned comparison revisions'
          fi
          if ! comparison="$(gh api "repos/$REPO/compare/$PR_BASE_SHA...$PR_HEAD_SHA?per_page=1")"; then
            fail_open 'pinned comparison request failed'
          fi
          if ! expected="$(jq -er '.files | if type == "array" then length else error("missing files") end' \
                               <<< "$comparison")"; then
            fail_open 'pinned comparison did not return a file list'
          fi

          # Compare returns files only on page one, capped at 300 even when the
          # commits are paginated. At the cap we cannot prove completeness, so
          # enable all checks rather than trusting a possibly truncated list.
          if [ "$expected" -eq 0 ] || [ "$expected" -ge 300 ]; then
            fail_open 'pinned comparison file list is empty or potentially truncated'
          fi

          # Keep BOTH names: renaming src/foo.cpp to docs/foo.md still removes
          # a build-relevant path. TSV escaping keeps unusual filenames on one
          # row without interpreting repository-controlled text as shell code.
          if ! files="$(jq -er '.files[] | [.filename, (.previous_filename // "")] | @tsv' \
                            <<< "$comparison")"; then
            fail_open 'pinned comparison files could not be decoded'
          fi

          # Allowlist. Every entry must be incapable of affecting a build or a
          # test result:
          #   docs/**    the documentation tree, including docs/requirements.txt
          #              (only the docs.yml toolchain reads it)
          #   **/*.md    prose anywhere -- README, .claude/ rules, docs pages.
          #
          # `docs_only` means "no build, no device tests". It does NOT mean the
          # change is inert: the user manual carries runnable code blocks that
          # `tests/docs/run_doc_examples.py` extracts and executes, so a doc edit
          # can break a real check. `docs_changed` below gates the `docs-examples`
          # job, which runs those blocks on the paths this fast path skips.
          # The markdown lint scripts (check_docs_nav / check_docs_en_zh_parity)
          # run in `pre-commit`, which stays ungated.
          #   mkdocs.yml site config, consumed only by docs.yml
          # `case` globs are not path-aware, so `*.md` matches at any depth.
          # One full pass, no early exit: `docs_only` and `docs_changed` are
          # independent questions, and short-circuiting on the first
          # non-documentation path would answer the second by file order alone.
          # `ptoas_version_changed` is a third, independent question: did this
          # PR change the pinned PTOAS_VERSION value? The version-file path is
          # only a cheap first filter: below, the assignment is compared at the
          # PR base and head so comments and wheel-sha updates do not consume
          # cards for `serving-guard`.
          docs_only=true
          docs_changed=false
          ptoas_version_changed=false
          versions_env_changed=false
          while IFS="$(printf '\t')" read -r new_path old_path; do
            for f in "$new_path" "$old_path"; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/*) docs_changed=true ;;
              esac
              case "$f" in
                toolchain/versions.env)
                  versions_env_changed=true
                  ;;
              esac
              case "$f" in
                docs/*|*.md|mkdocs.yml) ;;
                *)
                  if [ "$docs_only" = 'true' ]; then
                    echo "non-documentation change: $f -> full pipeline"
                  fi
                  docs_only=false
                  ;;
              esac
            done
          done <<< "$files"

          if [ "$versions_env_changed" = 'true' ]; then
            read_ptoas_version() {
              gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/$REPO/contents/toolchain/versions.env?ref=$1" |
                sed -nE 's/^PTOAS_VERSION=([^[:space:]]+)$/\1/p'
            }

            is_single_version() {
              [ -n "$1" ] && [ "$(printf '%s\n' "$1" | wc -l)" -eq 1 ]
            }

            if ! base_ptoas_version="$(read_ptoas_version "$PR_BASE_SHA")" ||
              ! head_ptoas_version="$(read_ptoas_version "$PR_HEAD_SHA")" ||
              ! is_single_version "$base_ptoas_version" ||
              ! is_single_version "$head_ptoas_version"; then
              fail_open 'PTOAS_VERSION could not be read exactly once at both PR revisions'
            fi

            if [ "$base_ptoas_version" != "$head_ptoas_version" ]; then
              ptoas_version_changed=true
              echo "PTOAS_VERSION changed: $base_ptoas_version -> $head_ptoas_version; serving guard enabled"
            else
              echo "PTOAS_VERSION unchanged ($head_ptoas_version); serving guard disabled"
            fi
          fi

          # Explicit full means core tests actually execute, even for docs-only
          # PRs. Keep docs_changed/ptoas_version_changed independently computed.
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] || [ "${FULL_CI:-false}" = 'true' ]; then
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "ptoas_version_changed=$ptoas_version_changed" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = 'true' ]; then
            echo "all $expected changed paths are documentation:"
            printf '%s\n' "$files" | cut -f1 | sed 's/^/  /'
          fi

  toolchain:
    needs: changes
    # Single source of truth for the toolchain versions every device job uses.
    # ptoas is declared in toolchain/versions.env (pypto-owned); pto-isa is
    # DERIVED from the pinned runtime submodule's runtime/pto_isa.pin (the
    # runtime owns it and enforces build == run). Both are re-exported as outputs
    # consumed via `needs.toolchain.outputs.*`. Bumping the runtime submodule
    # moves pypto's pto-isa in lockstep.
    #
    # Only greps/reads pinned files (no build, no pip), so it runs on a
    # GitHub-hosted runner — the same as daily_ci.yml's toolchain job — instead of
    # occupying an in-house self-hosted slot behind a container.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pto_isa_commit: ${{ steps.read.outputs.PTO_ISA_COMMIT }}
      ptoas_version: ${{ steps.read.outputs.PTOAS_VERSION }}
      ptoas_sha256_aarch64: ${{ steps.read.outputs.PTOAS_SHA256_AARCH64 }}
      ptoas_sha256_x86_64: ${{ steps.read.outputs.PTOAS_SHA256_X86_64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_sha }}
          persist-credentials: false
          submodules: true
      - name: Read pinned toolchain versions
        id: read
        run: |
          # ptoas: pypto-owned, from versions.env
          grep -E '^[A-Z0-9_]+=' toolchain/versions.env >> "$GITHUB_OUTPUT"
          # pto-isa: derived from the pinned runtime submodule (runtime owns it)
          commit="$(tr -d '[:space:]' < runtime/pto_isa.pin)"
          if ! printf '%s' "$commit" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error file=runtime/pto_isa.pin::expected a 40-char hex commit, got '$commit'"
            exit 1
          fi
          echo "PTO_ISA_COMMIT=$commit" >> "$GITHUB_OUTPUT"
          echo "pinned pto-isa (from runtime submodule): $commit"
      - name: Guard against un-centralized toolchain literals
        run: |
          status=0
          if grep -rn -- '--pto-isa''-commit' python/ tests/ .github/workflows/; then
            echo "::error::The PyPTO pto-isa commit override has been removed. Bump runtime/pto_isa.pin instead."
            status=1
          fi
          if grep -rnE 'git checkout [0-9a-f]{40}' .github/workflows/; then
            echo "::error::Hardcoded pto-isa commit found in a workflow. Use needs.toolchain.outputs.pto_isa_commit; pto-isa is bumped via the runtime submodule (runtime/pto_isa.pin)."
            status=1
          fi
          if grep -rnE 'PTOAS_SHA256(_[A-Z0-9]+)?: *[0-9a-f]{64}' .github/workflows/; then
            echo "::error::Hardcoded PTOAS_SHA256 found in a workflow. Reference needs.toolchain.outputs.ptoas_sha256_* and bump toolchain/versions.env instead."
            status=1
          fi
          exit $status

  # Shared lint definitions are also used to generate the PR-only ci.yml.
  # Main CI runs fresh lint; comment-dispatched full runs reuse a verified PR
  # result and pass through lint-gate without repeating these two jobs.
  pre-commit:
    if: needs.changes.outputs.reuse_lint != 'true'
    needs: changes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.changes.outputs.checkout_sha }}
        persist-credentials: false
    - name: Set up Python for lint hooks
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: pre-commit
      uses: pre-commit/action@v3.0.0
      with:
        extra_args: --all-files

  clang-tidy:
    # Build inputs come from build-constraints.txt rather than from whatever
    # PyPI offers today; pip applies a constraints file to build-dependency
    # installs too, so this reaches the CMake configure below. The path carries
    # this job's checkout directory: unlike unit-tests it checks out into
    # clang-tidy-checkout, and pip fails hard on a constraints file that is not
    # there.
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/clang-tidy-checkout/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/clang-tidy-checkout/build-constraints.txt
    # De-containered: runs host-native on the in-house CPU runner (same
    # infra as before, minus the localhost:5000/ci-py310 image). clang_tidy.py
    # generates compile_commands.json via a CMake configure (needs cmake / ninja /
    # nanobind and a C++ compiler) and pip-installs the pinned clang-tidy, so it
    # borrows the runner's conda py310 env for the toolchain. It never builds the
    # full extension or goes on-board, so it does NOT use setup-ci-job (no ptoas /
    # pto-isa / simpler / device) — just the conda env + a per-job venv.
    #
    # Checks out under ./clang-tidy-checkout so its `git clean` never wipes the
    # sibling codegen-checkout tree (both jobs share the cpu runner pool).
    #
    # Docs-only gate (see the `changes` job) — a prose-only PR touches no C++, and
    # skipping the gate here keeps the scarce cpu pool free.
    needs: changes
    if: needs.changes.outputs.reuse_lint != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: [self-hosted, linux, cpu]
    defaults:
      run:
        working-directory: clang-tidy-checkout
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.changes.outputs.checkout_sha }}
        persist-credentials: false
        submodules: true
        path: clang-tidy-checkout
        # Host-native on a persistent self-hosted runner now: don't leave the
        # token in the reused .git/config between runs (zizmor artipacked), same
        # as every setup-ci-job / action-defs checkout in these workflows.

    - name: Fetch base branch for diff
      if: github.event_name == 'pull_request'
      run: git fetch origin ${{ github.base_ref }} --depth=1

    - name: Derive pip cache dir from runner config
      # Read the host layout from the runner's .env (no absolute path in git); the
      # pip cache lives under CI_CACHE_ROOT like every other job's.
      shell: bash
      run: |
        set -uo pipefail
        for key in CI_CACHE_ROOT; do
          if [ -z "${!key:-}" ]; then
            echo "::error::$key is not set — add it to this runner's .env"
            exit 1
          fi
        done
        mkdir -p "$CI_CACHE_ROOT"
        echo "PIP_CACHE_DIR=$CI_CACHE_ROOT/pip-clang-tidy" >> "$GITHUB_ENV"
        # No bundle path is resolved here. The two steps below enter the bundle
        # through `pypto-toolchain export`, which resolves the same install root
        # and `current` symlink that `pypto-toolchain verify` resolves, so this
        # job cannot verify one bundle and lint with another. See the longer
        # note in .github/actions/setup-ci-job/action.yml.

    # The system image used to ship Ubuntu's clang-tidy 14, which predates checks
    # the project enables (misc-include-cleaner needs LLVM 17+) and skips them
    # silently. Install the version clang_tidy.py requires (single source of truth)
    # into a per-job venv on top of the toolchain bundle.
    - name: Bootstrap venv + install pinned clang-tidy
      shell: bash
      run: |
        # Same toolchain the build jobs use, so the compile_commands.json
        # clang-tidy reads is generated by the compiler the build actually uses.
        pypto-toolchain verify --require python=3.10 --require 'gcc>=15'
        # Enter the bundle verify just checked, via the tool's own resolution
        # rather than a path of ours. No ccache requirement here — this job sets
        # no CCACHE_NAMESPACE, so the #1139 floor is the build jobs' concern.
        bundle_env="$(pypto-toolchain export)" || exit 1
        eval "$bundle_env"
        command -v python3.10 g++-15 >/dev/null
        python3.10 -c 'import sys; assert sys.version_info[:2]==(3,10)'
        rm -rf venv
        python3.10 -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        # cmake / ninja / nanobind: clang_tidy.py configures CMake with
        # -DCMAKE_EXPORT_COMPILE_COMMANDS=ON and reads nanobind's cmake dir.
        # Versions come from build-constraints.txt via PIP_CONSTRAINT, so lint
        # reads the same headers the wheel is built against.
        pip install cmake ninja nanobind
        VERSION=$(python -c "import sys; sys.path.insert(0, 'tests/lint'); from clang_tidy import REQUIRED_VERSION; print(REQUIRED_VERSION)")
        pip install --retries 5 --timeout 60 "clang-tidy==${VERSION}"
        clang-tidy --version

    - name: Run clang-tidy
      shell: bash
      run: |
        bundle_env="$(pypto-toolchain export)" || exit 1
        eval "$bundle_env"
        source venv/bin/activate
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          python tests/lint/clang_tidy.py --strict-version --jobs=$(nproc) --diff-base=origin/${{ github.base_ref }}
        else
          python tests/lint/clang_tidy.py --strict-version --jobs=$(nproc)
        fi

  lint-gate:
    needs: [changes, pre-commit, clang-tidy]
    if: always() && !cancelled() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require fresh or verified reusable lint
        env:
          REUSE_LINT: ${{ needs.changes.outputs.reuse_lint }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PRE_COMMIT: ${{ needs.pre-commit.result }}
          CLANG_TIDY: ${{ needs.clang-tidy.result }}
        run: |
          if [ "$REUSE_LINT" = 'true' ]; then
            # changes verified the exact prior PR/head/base lint run via GitHub.
            test "$PRE_COMMIT" = 'skipped' && test "$CLANG_TIDY" = 'skipped'
          else
            test "$PRE_COMMIT" = 'success' && {
              test "$CLANG_TIDY" = 'success' || {
                test "$DOCS_ONLY" = 'true' && test "$CLANG_TIDY" = 'skipped'
              }
            }
          fi

  prebuild-wheels:
    # Build the pypto and simpler wheels ONCE PER MACHINE, into that host's
    # wheel cache, so the eight jobs below install them instead of each
    # rebuilding the same commit. Nothing depends on this job: setup-ci-job's
    # cache is a flock, so whichever job arrives at a cold key first becomes the
    # builder and the rest wait on it. Making the consumers `needs:` this one
    # would turn a helper into a hard gate — a saturated CPU pool would then
    # stall the whole workflow instead of just leaving the cache cold.
    #
    # The shared lint gate accepts fresh automatic lint or verified lint from
    # the same PR/head/base. Comment-triggered full runs reuse it without
    # spending another CPU slot on clang-tidy.
    #
    # One leg per architecture, because the cache it fills is the host's own
    # disk and the self-hosted fleet is no longer one machine. The `cpu` and
    # `npu` pools each span one aarch64 box and one x86_64 box, and #2525
    # dropped the `arm64` pin from every consumer so a job lands on whichever of
    # the two is free — measured over eight runs, 43% of cpu-pool jobs and half
    # the npu ones go to the x86_64 host. A single-arch prebuild would leave
    # that host cold and those jobs building in place, which is exactly what
    # this removes. Each leg's cpu runner shares a machine, and therefore a
    # CI_CACHE_ROOT, with that machine's npu runners, so warming from the cpu
    # pool reaches both.
    #
    # `arm64` / `x64` are the labels the runner application applies on its own
    # (`ARM64` / `X64`); label matching is case-insensitive, and the lowercase
    # spelling is the one this repo has always used. They are the only thing in
    # `runs-on` that can distinguish the two machines.
    #
    # fail-fast: false — a leg is a cache warm-up, not a check. One host being
    # unreachable or short of disk must not cancel the other's build, and no
    # job `needs:` either of them, so neither can gate anything.
    #
    # The wheel key already carries the architecture (abi_tag comes from
    # EXT_SUFFIX), so the two legs cannot collide even if they somehow shared a
    # cache root: they write different slots.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: [self-hosted, linux, "${{ matrix.arch }}", cpu]
    env:
      PTOAS_ROOT: ${{ github.workspace }}/prebuild-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      # Higher than the 16 every other job uses: this one is meant to be the
      # only pypto build on the box at the time, so it is not sharing cores with
      # seven siblings the way a build inside a test job is. The same number
      # serves both legs without measuring the second machine: each host already
      # runs several runner instances that are each allowed a 16-way build, so
      # one 48-way build is inside what it is provisioned to absorb.
      CMAKE_BUILD_PARALLEL_LEVEL: 48
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false

      # The whole job. setup-ci-job builds both wheels and publishes them to
      # $CI_CACHE_ROOT/wheels as a side effect of installing them, so there is
      # nothing to run afterwards — and a failure here is a real compile error,
      # surfaced once and ~5 minutes earlier than the eight jobs would.
      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: prebuild-checkout
          needs-device: 'false'
          toolchain: bundle
          pip-cache-name: pip-prebuild
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          # CPU prebuilds do not activate CANN on either architecture. Build
          # simulator assets here; SDK-equipped NPU jobs cache their own
          # onboard runtime wheels under the separate target-specific keys.
          runtime-targets: build_package_sim

  prebuild-wheels-github:
    # prebuild-wheels for the GitHub-hosted jobs. Same idea, different
    # plumbing, because GitHub-hosted runners share no disk: there is nothing
    # for a flock to coordinate and nothing that survives the job, so the wheels
    # travel through run artifacts and the consumers take a real `needs:` edge.
    #
    # Named for whose runners it serves, not for an architecture. Both
    # consumers here are x86_64 and so is every GitHub-hosted runner, but the
    # self-hosted fleet has an x86_64 machine too, which `prebuild-wheels`
    # covers with a matrix leg. What separates this job from that one is the
    # disk: a host that keeps its cache between runs versus one that does not.
    #
    # Both x86_64 jobs compiled the extension from scratch on every run — 8m51
    # and 6m32 on run 32476058579 — and `unit-tests` was the last job in the
    # workflow to finish, i.e. the critical path was a build the machine next
    # door had already done. Building once here and installing twice takes that
    # off the path entirely.
    #
    # In the container, not on the runner image, and that direction is not
    # arbitrary. A wheel built here needs at most GLIBC_2.33 and
    # GLIBCXX_3.4.29 (measured on the built extension), which ubuntu-24.04's
    # 2.39 / 3.4.33 satisfy; built the other way round it could pick up symbols
    # the 22.04 container does not have. The consumers assert the result rather
    # than trusting it: each imports pypto right after installing, so a wheel
    # that does not load says so at second five with a message about ABI,
    # instead of surfacing as a puzzling test error later.
    #
    # `toolchain` is deliberately absent from `needs`: nothing here reads a
    # pinned version. simpler resolves its own pto-isa from
    # runtime/pto_isa.pin at build time, and no ptoas is installed.
    needs: [changes, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    # `packages: read` is not decoration. Declaring a `permissions:` block at
    # all narrows GITHUB_TOKEN to exactly what it lists, and pulling the job
    # container is an authenticated ghcr.io read — so `contents: read` alone
    # fails the job before its first step with `Error response from daemon:
    # denied`. system-tests-a5sim uses the same image and needs no such line
    # only because it declares no permissions block and keeps the defaults.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hw-native-sys/pypto/github-ci:latest
    # Named rather than left to the default, which resolved to `sh -e {0}` in
    # this container on run 32502998994. Every step below is POSIX either way;
    # saying which shell runs them keeps it that way by choice.
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.wheels.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_sha }}
          persist-credentials: false
          submodules: true

      # The workspace belongs to the runner user and these steps are root, so
      # git 2.34 stops at "detected dubious ownership" before it reads anything.
      # actions/checkout works around this for itself, in a temporary HOME that
      # no later step inherits, so say it again here -- once, before anything
      # that might shell out to git.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-x86_64-prebuild-${{ needs.changes.outputs.checkout_sha }}
          restore-keys: ccache-x86_64-prebuild-

      - name: Enable ccache
        run: |
          # In the image as of the Dockerfile change that landed with this, but
          # the image is only rebuilt on pushes to main that touch it, so a PR
          # can still run against an older one and has to install it.
          if ! command -v ccache >/dev/null || ! command -v zstd >/dev/null; then
            apt-get update -qq &&
              apt-get install -y -qq --no-install-recommends ccache zstd || true
          fi
          # zstd is not an optimisation here, it is correctness. actions/cache
          # folds the compression method into the cache *version*, so this
          # container -- which had no zstd -- saved a `cache.tgz` that the
          # zstd-capable runner image could never see: `unit-tests` asked for
          # the exact key this job had just written and was told "Cache not
          # found", every run, while `system-tests-a5sim` (same image, so same
          # compression) hit it every time. Installing zstd puts both consumers
          # on the same version.
          command -v zstd >/dev/null ||
            echo "::warning::zstd unavailable — the runner-image consumer will miss this cache"
          # The launcher is exported only once ccache is known to exist: naming
          # it unconditionally would hand CMake a compiler launcher that is not
          # on PATH, turning a missing optimisation into a failed build. A
          # missing ccache is meant to cost time and nothing else.
          if command -v ccache >/dev/null; then
            echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            ccache --version | head -1
          else
            echo "::warning::ccache unavailable — building without it"
          fi

      - name: Build the wheels
        env:
          # Deliberately small: the dir is tarred into the repo-wide 10 GB cache
          # quota on every main run, so it holds this build's objects and no more.
          CCACHE_MAXSIZE: 1G
        run: |
          python -m pip install --upgrade pip
          # Build inputs come from THIS checkout, not from the image. The image
          # does pin them against build-constraints.txt, but the copy that
          # existed when it was built -- and it is rebuilt only on a push to
          # main that touches it. With --no-build-isolation, [build-system]
          # requires is never consulted either, so without these two lines a PR
          # that edits build-constraints.txt silently built with the old tools,
          # while the self-hosted path (which has exported these since #2525)
          # honoured the edit. Same inputs on both paths or neither is
          # trustworthy.
          constraints="$PWD/build-constraints.txt"
          test -f "$constraints" || {
            echo "::error::build-constraints.txt missing at $constraints"
            exit 1
          }
          # Scoped to this one install rather than exported for the step. pip
          # rejects --build-constraint (PIP_BUILD_CONSTRAINT) outright when
          # --no-build-isolation is in play -- "ERROR: --build-constraint
          # cannot be used with --no-build-isolation" -- and it would be
          # meaningless there anyway: --no-build-isolation means pip installs
          # no build dependencies at all, so the only constraint that can bite
          # is the one applied right here, to the environment those builds go
          # on to use.
          PIP_CONSTRAINT="$constraints" PIP_BUILD_CONSTRAINT="$constraints" \
            pip install scikit-build-core nanobind cmake ninja
          command -v ccache >/dev/null && ccache -z || true
          # PYPTO_DEBUG_INFO_LEVEL for pypto only; simpler's CMake has no such
          # option and would warn about being handed one.
          SKBUILD_CMAKE_DEFINE=PYPTO_DEBUG_INFO_LEVEL=1 \
            pip wheel --no-build-isolation --no-deps -w wheelhouse .
          pip wheel --no-build-isolation --no-deps -w wheelhouse ./runtime
          command -v ccache >/dev/null && ccache -s || true
          ls -l wheelhouse

      # Artifacts belong to this run. A native rerun uses a fresh attempt name,
      # while consumers of a successful earlier producer keep its output name.
      - name: Publish the wheels
        id: upload-wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Record the available wheel artifact
        id: wheels
        env:
          ARTIFACT_NAME: wheels-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

  unit-tests:
    # Build inputs come from build-constraints.txt rather than from whatever
    # PyPI offers today. Both variables on purpose: PIP_BUILD_CONSTRAINT is the
    # one pip applies to build dependencies, and PIP_CONSTRAINT is what older
    # pip honours for them -- this job upgrades pip to the latest release, so it
    # has to satisfy whichever is in force. Declared per job because this one
    # checks out at the workspace root; the jobs that check out into a
    # subdirectory get the path from setup-ci-job instead.
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
    # Lint gate (see the lint-gate job) — don't spend a runner on a tree that
    # doesn't lint.
    #
    # Docs-only gate (see the `changes` job) — THE ONE JOB THAT IS NOT SKIPPED
    # WHOLESALE. `jobs.<job_id>.if` is evaluated *before* `strategy.matrix` is
    # expanded, so a skipped matrix job produces a single check run named
    # `unit-tests` instead of the `unit-tests (<os>, 3.10)` context the ruleset
    # requires. Verified on run 30525415124, where the lint gate failed and
    # `commits/<sha>/check-runs` reports exactly one `unit-tests` / `skipped` —
    # no per-matrix contexts. Skipping this job on a docs-only PR would leave
    # the required context uncreated, i.e. permanently "expected", and the PR
    # unmergeable — the opposite of the intent.
    #
    # So the matrix always expands and the two expensive steps carry the
    # condition instead: on a docs-only PR the leg checks out, reports its
    # required context green, and finishes in seconds without building the C++
    # extension or running pytest. The runner is GitHub-hosted, so this costs
    # none of the scarce in-house capacity the gate exists to protect.
    #
    # lint-gate handles docs-only and reused-lint skips explicitly. Require its
    # success even when the advisory wheel build fails or is skipped.
    #
    # `prebuild-wheels-github` is in `needs` for ordering only, and the `if`
    # says nothing about its result on purpose. A failed prebuild must not skip
    # this job: a skipped required context counts as satisfied by the ruleset,
    # so gating on it would let a tree merge with its unit tests never run. The
    # install step falls back to building in place instead, which is what this
    # job did before the prebuild existed.
    needs: [changes, lint-gate, prebuild-wheels-github]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Single-leg matrix, deliberately kept as a matrix: the required status
      # check is named `unit-tests (ubuntu-latest, 3.10)`, and collapsing this
      # into a plain job would rename the context to `unit-tests` and leave the
      # required one permanently "expected". Linux is the only supported CI
      # platform — the target (Ascend NPU) has no macOS support, so a macOS leg
      # validated nothing the Linux leg does not.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.changes.outputs.checkout_sha }}
        persist-credentials: false
        submodules: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # torch's CPU wheel is the heaviest thing this job downloads, so keep
        # pip's own cache between runs too. cache-dependency-path is explicit
        # because setup-python's default for pip is **/requirements.txt, and
        # this repo has none — leaving it out fails the step outright rather
        # than falling back to something.
        # The workflow cache-mode permits restores only, including on main.
        cache: pip
        cache-dependency-path: pyproject.toml

    # The wheel prebuild-wheels-github already built, rather than a second
    # build of the same tree. Restore-only: this job publishes nothing.
    - name: Download the prebuilt wheels
      if: >-
        needs.changes.outputs.docs_only != 'true'
        && needs.prebuild-wheels-github.outputs.artifact_name != ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        path: wheelhouse
        name: ${{ needs.prebuild-wheels-github.outputs.artifact_name }}

    # The two steps the docs-only gate actually elides — installing the
    # extension and running the suite. The job itself still runs, so both
    # required matrix contexts are created and reported green.
    - name: Install project and dependencies
      if: needs.changes.outputs.docs_only != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        whl="$(ls wheelhouse/pypto-*.whl 2>/dev/null | head -1)"
        if [ -n "$whl" ]; then
          echo "installing the prebuilt wheel: $whl"
          pip install "pypto[dev] @ file://$PWD/$whl"
        else
          # Reachable when the prebuild was skipped or its artifact was
          # evicted. Slow but correct, and loud about which path it took.
          echo "::warning::no prebuilt wheel — building in place"
          pip install -v .[dev]
        fi
        # The wheel is built in ubuntu 22.04 and installed here on 24.04, so
        # assert the ABI holds instead of discovering it through a test error.
        python -c "import pypto; print('env OK:', pypto.__file__)"

    - name: Test unit tests
      if: needs.changes.outputs.docs_only != 'true'
      run: pytest tests/ut -n auto --maxprocesses 8 -v

    - name: Skipped (documentation-only change)
      if: needs.changes.outputs.docs_only == 'true'
      run: echo "Every changed path is documentation — no build, no tests."

  docs-examples:
    # The user manual's runnable code blocks, on the path examples-tests cannot
    # cover. That job is skipped for a documentation-only change -- which is
    # exactly when the blocks themselves are being edited -- so without this the
    # gate would never fire on the PRs that can break it.
    #
    # Gated on docs_changed rather than !docs_only: a code-only PR gets the same
    # blocks run inside examples-tests, against the code it changed.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_changed == 'true'
    permissions:
      contents: read
    runs-on: [self-hosted, linux, cpu]
    defaults:
      run:
        working-directory: docs-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/docs-checkout/ptoas-bin
      PTO_ISA_ROOT: ${{ github.workspace }}/docs-checkout/pto-isa
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: docs-checkout
          needs-device: 'false'
          pip-cache-name: pip-docs
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_sim

      - name: Run the user manual's runnable code blocks
        run: |
          source activate.sh
          set -e
          python tests/docs/run_doc_examples.py --pages docs/en/user --check-parity \
            -p a2a3sim --jobs 16

  examples-tests:
    # The distributed examples ladder — every example must compile
    # AND run with a passing golden on the simulator (a2a3sim), so the teaching
    # material cannot silently rot.
    #
    # No container: runs host-native on the shared CPU pool through the same
    # setup-ci-job as codegen-tests / pypto-lib-model, so the ptoas / pto-isa /
    # simpler builds reuse the persistent host caches (ccache, pip, ptoas)
    # instead of rebuilding in an ephemeral container on every PR.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # Pinned to aarch64, which is a workaround and not a fix.
    #
    # On the x86_64 host this job's last step fails at
    # docs/en/user/performance/01-task-granularity.md:161, where the a2a3sim
    # result of a fused add+exp is compared against torch. The input is fixed
    # (manual_seed(0)), yet two runs of the same tree on that host disagree
    # with each other: 22 mismatched elements on one, 12 on the next, while
    # the worst element is bit-identical both times. Identical input and
    # identical binary must not produce different device output.
    #
    # It is the job shape, not the host alone. `docs-examples` runs the very
    # same `run_doc_examples.py` invocation on the very same hosts and has
    # passed every time, and the difference is that there the doc blocks are
    # the first simulator work in the job, whereas here they run after the
    # distributed ladder (-d 0,1,2,3) and the teaching examples. Prior
    # simulator activity in the same job is contaminating the later run, which
    # also explains why the count of wrong elements moves while the extremes
    # do not.
    #
    # aarch64 does not show it: 12/12 green in CI, and the kernel run 8 times
    # in one process locally gives one bit-identical output that matches torch
    # exactly. So the pin buys a stable signal rather than hiding a failure
    # this job would otherwise catch.
    #
    # Cost: this job no longer draws from the x86_64 half of the cpu pool, so
    # it can queue behind the aarch64 box. Remove the arch label once the
    # contamination is fixed -- #2525 removed every other one deliberately,
    # and this should not become permanent.
    runs-on: [self-hosted, linux, arm64, cpu]
    defaults:
      run:
        working-directory: examples-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/examples-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # The cache *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are
      # derived by setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
      # How many examples / doc blocks run at once. One example is one process
      # that spends most of its life on a single core (its own compiles fan out
      # to 1 + len(kernels) threads for a fraction of the run), so this is far
      # cheaper to the shared host than the number suggests.
      EXAMPLE_JOBS: 16
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./examples-checkout —
        # sparse-fetch just the action defs at the workspace root first
        # (clean: false leaves sibling subdir checkouts on this persistent
        # runner untouched).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: examples-checkout
          needs-device: 'false'
          toolchain: bundle
          pip-cache-name: pip-examples
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_sim

      # Every example and every documented alternate invocation, plus the
      # manual's runnable blocks. All three ladders are lists of independent
      # processes -- a fresh mkdtemp under build_output each, reusable binaries
      # guarded by binary_context_lock, and a distributed run's shm segment
      # named after its own driver PID -- so they are run several at a time.
      # The matrix itself moved into tests/docs/run_examples.py, where a
      # developer can reproduce one leg without reading YAML.
      - name: Run every example on the simulator
        run: |
          source activate.sh
          set -e
          python tests/docs/run_examples.py --jobs "$EXAMPLE_JOBS"

      # The user manual's runnable blocks. Teaching code that is never executed
      # rots silently -- a kernel can compile, run, write nothing, and still read
      # correctly on the page -- so the manual itself is executed here.
      - name: Run the user manual's runnable code blocks
        run: |
          source activate.sh
          set -e
          python tests/docs/run_doc_examples.py --pages docs/en/user --check-parity \
            -p a2a3sim --jobs "$EXAMPLE_JOBS"

  codegen-tests:
    # Codegen-only: verifies IR → kernel/orch C++ generation without going
    # on-board. --codegen-only skips assembly (ptoas), pto-isa, simpler and
    # device execution (see tests/st/harness/core/test_runner.py), so this
    # runs on a CPU runner and never competes for NPU cards.
    #
    # No container: it used to run as root in localhost:5000/ci-py310, which
    # forced the root/ci-runner umask split on the shared ccache. Now it runs
    # host-native as ci-runner through the same setup-ci-job as the device jobs,
    # with needs-device:false (no NPU, no CANN) and install-toolchain:false (no
    # pto-isa / simpler). install-ptoas:true exercises the cached ptoas install;
    # --codegen-only still skips assembly. Checkout / install
    # land under ./codegen-checkout so they don't collide with other jobs' trees
    # on the shared self-hosted host.
    #
    # Lint gate (see the lint-gate job) — shares the self-hosted cpu pool with
    # clang-tidy, so it must not start until that pool's lint job is green.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, lint-gate, toolchain]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    runs-on: [self-hosted, linux, cpu]
    defaults:
      run:
        working-directory: codegen-checkout
    env:
      # Exercise the cached PTOAS installation; the raw-codegen test step
      # overrides PTOAS_ROOT to stay independent of available assemblers.
      PTOAS_ROOT: ${{ github.workspace }}/codegen-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared ci-cache/ccache dir. Every job now runs as ci-runner (no container
      # root), but the dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* are derived by setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: codegen-checkout
          needs-device: 'false'
          install-toolchain: 'false'
          install-ptoas: 'true'
          pip-cache-name: pip-codegen
          # The cpu runners carry the bundle too. This job is the cheapest way
          # to cover that runner class: no device, no simpler.
          toolchain: bundle

      - name: Test codegen (codegen-only, no device)
        # test_torch_codegen_paged_attention does a numeric golden compare whose
        # bf16/fp16 accumulation is sensitive to the host torch/BLAS build; it
        # drifts past tolerance on this CPU host, so it runs in the npu
        # system-tests job instead (it needs no device, only that environment).
        # `python -m pytest`, not bare `pytest`: the per-job venv is layered on
        # conda py310 with --system-site-packages, so pip leaves pytest's entry
        # point in the base env (already satisfied) and a bare `pytest` would run
        # under the base interpreter, which cannot see the venv-installed pypto.
        run: |
          source activate.sh
          # Keep raw codegen independent of runner-local assemblers.
          PTOAS_ROOT="$(mktemp -d "$RUNNER_TEMP/pypto-codegen-no-ptoas.XXXXXX")"
          export PTOAS_ROOT
          python -m pytest tests/st/codegen -v --codegen-only \
            --ignore=tests/st/codegen/torch/test_torch_codegen_paged_attention.py

  system-tests:
    # Batched shard A (mechanism A): the HEAVY device_batch directories — all of
    # tests/st EXCEPT runtime/ops + runtime/cross_core. The batched `Test system
    # tests` step used to run ~7-15 min and dominated the whole job, so it is
    # split by directory across two jobs that run in parallel:
    #   - system-tests        (this job): device_batch on the heavy dirs (the
    #                                      model tests in framework_and_models +
    #                                      scheduling + control_flow dominate).
    #   - system-tests-direct (sibling)  : device_batch on ops + cross_core (cheap
    #                                      compiles) + all the direct-device
    #                                      (mechanism B) + DFX steps.
    # Measured on run 29468368196: this heavy batched shard ≈ 404s vs the light
    # ops/cross_core shard ≈ 80s — ops/cross_core have MANY tests but cheap
    # compiles, so the direct + DFX tail (~268s) is paired with them, not here.
    # Coverage is preserved: heavy dirs ∪ ops/cross_core = the original batched
    # scope, with no overlap (this shard --ignore's ops/cross_core). Both jobs do
    # their own (ccache-shared) build; keep them in sync on setup and on the
    # directory partition (re-check the balance if a heavy new dir is added).
    #
    # No container: compile + golden run card-free on this CPU host, and each
    # case's device run borrows an NPU from the host-level `task-submit --device
    # auto` queue (mechanism A; --execute-via-task-submit). The job therefore
    # holds no card and is no longer pinned to a single-device runner. Host setup
    # mirrors dist-system-tests (conda py310 + per-job venv + activate.sh) so the
    # CI job and the task-submit child share one filesystem / absolute path —
    # the compiled .o/.so in the precompile cache_dir are readable by the child
    # with no path translation.
    #
    # Checkout / install happen under ./st-checkout so they don't collide with
    # other jobs' workspaces.
    #
    # Lint gate (see the lint-gate job) — never claim an NPU slot for a tree
    # that doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the device runner so DEVICE_ID/DEVICE_ID exist and pin
    # task-submit to that card (validates the new compile-card-free + task-submit
    # execute flow deterministically). FLIP TO PROD: change this to
    # `[self-hosted, linux, cpu]` and drop --task-submit-device below so
    # cases borrow any free card via `--device auto`.
    #
    # Unpinned: takes whichever half of the `npu` pool is free. This job used to
    # carry an `x64` pin, and its only purpose was to keep the aarch64 npu box
    # free for `dist-system-tests` / `pypto-lib-model`, which were pinned to it.
    # Those pins are gone (the x86_64 npu host has been repaired), so the
    # reservation has nothing left to reserve.
    #
    # Lifting it costs no signal, because it was a scheduling pin and not a
    # health one: over the 120 ci.yml runs before it was lifted both jobs went
    # red on BOTH halves at indistinguishable rates (aarch64 4 red / 55, x86_64
    # 9 red / 87), failing the same batched step.
    runs-on: [self-hosted, linux, npu]
    defaults:
      run:
        working-directory: st-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/st-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./st-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: st-checkout
          needs-device: 'true'
          pip-cache-name: pip-st
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_a2a3;build_package_sim
          # Python and GCC come from the pypto-toolchain bundle rather than a
          # per-machine conda env. Per job on purpose: clang-tidy is still on
          # conda, and a job is reverted by deleting this one line.
          toolchain: bundle

      - name: Test system tests (batched shard A — heavy dirs, all but ops/cross_core)
        timeout-minutes: 30
        # Mechanism A: compile + golden run card-free in the precompile pool;
        # each case's device run borrows an NPU via `task-submit --device auto`
        # (--execute-via-task-submit). No --device: the harness no longer owns a
        # card. cache_dir auto-lands under the repo's build_output (host-visible
        # to the task-submit child), cleaned at session end.
        #
        # SHARD A = the HEAVY batched dirs: device_batch on every dir EXCEPT
        # ops + cross_core (which are the cheap-compile shard, run in
        # `system-tests-direct`), plus the standing exclusions — distributed
        # (own multi-card job), codegen (own CPU --codegen-only job), and
        # test_dump_tag (its own --dump-args DFX step in the sibling job). The two
        # shards --ignore each other's dirs so no batched test runs twice.
        run: |
          source activate.sh
          # TEST MODE: --task-submit-device pins EVERY device run (batched + the
          # undiscovered-case tail) to this runner's card (DEVICE_ID) through
          # task-submit's per-card lock. FLIP TO PROD: cpu runner, drop
          # --task-submit-device, use --device auto (borrow any free card).
          # DEVICE_ID must be non-empty, else task-submit would auto-borrow a
          # host card this runner does not own (halMemCtl EACCES).
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          # `-m device_batch` (auto-applied to tests using test_runner.run):
          # compile + golden card-free, device run BATCHED via task-submit. The
          # `not device_batch` (direct @pl.jit / config=test_config) tests for
          # ALL dirs run in the `system-tests-direct` job.
          #
          # `not swimlane` because those assert on a chip-swimlane record and
          # skip without `--enable-chip-swimlane`, which this step does not pass.
          # They ran here only to skip, and 35 silent skips buried the real ones;
          # the flagged steps in `system-tests-direct` run them for real.
          python -m pytest tests/st -v -m "device_batch and not swimlane and not multi_card" \
            --ignore=tests/st/distributed \
            --ignore=tests/st/codegen \
            --ignore=tests/st/runtime/ops \
            --ignore=tests/st/runtime/cross_core \
            --ignore=tests/st/runtime/framework_and_models/test_dump_tag.py \
            --precompile-workers=32 --strict-case-discovery \
            --execute-via-task-submit --execute-batch-size=64 \
            --task-queue-timeout=1800 --task-max-time=600 --task-submit-device="$DEVICE_ID"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: st-checkout

  system-tests-direct:
    # The complement of `system-tests`, sized to balance it:
    #   1. Batched shard B (mechanism A): device_batch on the LIGHT dirs — only
    #      runtime/ops + runtime/cross_core. These have many tests but cheap
    #      compiles (~80s measured vs ~404s for the heavy dirs in `system-tests`),
    #      so they are paired here with the direct + DFX tail.
    #   2. Direct-device (mechanism B): `-m 'not device_batch and not multi_card'` over ALL of
    #      tests/st (the in-process @pl.jit / config=test_config tests, including
    #      the direct tests under the heavy dirs that `system-tests` skips).
    #   3. DFX steps: paged-attention / multi-orch L2 / swimlane / dump-args.
    # Balance (run 29468368196): heavy batched ≈ 404s alone in `system-tests`;
    # here ≈ 80s batched + ~168s direct + ~100s DFX ≈ 348s, so the two jobs finish
    # within ~1 min of each other. Setup is identical to `system-tests` (same
    # composite action, same env) — keep the two in sync, including the shard
    # partition (ops/cross_core here must be exactly the dirs `system-tests`
    # --ignore's). This job checks out under ./st-direct-checkout so it never
    # collides with system-tests' ./st-checkout on the shared self-hosted host,
    # and cleans up its own orphaned task-submit tasks.
    #
    # Lint gate (see the lint-gate job) — never claim an NPU slot for a tree
    # that doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the device runner so DEVICE_ID exists and pin task-submit
    # to that card. FLIP TO PROD: change this to
    # `[self-hosted, linux, cpu]` and drop --task-submit-device / the
    # explicit --device below so cases borrow any free card via `--device auto`.
    #
    # Unpinned: takes whichever half of the `npu` pool is free. This job used to
    # carry an `x64` pin, and its only purpose was to keep the aarch64 npu box
    # free for `dist-system-tests` / `pypto-lib-model`, which were pinned to it.
    # Those pins are gone (the x86_64 npu host has been repaired), so the
    # reservation has nothing left to reserve.
    #
    # Lifting it costs no signal, because it was a scheduling pin and not a
    # health one: over the 120 ci.yml runs before it was lifted both jobs went
    # red on BOTH halves at indistinguishable rates (aarch64 4 red / 55, x86_64
    # 9 red / 87), failing the same batched step.
    runs-on: [self-hosted, linux, npu]
    defaults:
      run:
        working-directory: st-direct-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/st-direct-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./st-direct-checkout — sparse-fetch
        # just the action defs at the workspace root first (clean: false leaves
        # sibling subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: st-direct-checkout
          needs-device: 'true'
          toolchain: bundle
          pip-cache-name: pip-st-direct
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_a2a3;build_package_sim

      - name: Test system tests (batched shard B — ops + cross_core, cheap compiles)
        timeout-minutes: 30
        # Mechanism A, complement of system-tests' heavy shard: device_batch on
        # ONLY runtime/ops + runtime/cross_core (the cheap-compile dirs, ~80s
        # measured). The heavy dirs run in `system-tests`. Selecting by directory
        # (not by --ignore of everything else) keeps this list short and explicit;
        # `system-tests` --ignore's these two dirs so nothing double-runs. Neither
        # dir contains distributed/codegen/dump_tag, so no --ignore is needed here.
        # Same precompile/task-submit flags as the heavy shard.
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          python -m pytest tests/st/runtime/ops tests/st/runtime/cross_core \
            -v -m device_batch \
            --precompile-workers=32 --strict-case-discovery \
            --execute-via-task-submit --execute-batch-size=64 \
            --task-queue-timeout=1800 --task-max-time=600 --task-submit-device="$DEVICE_ID"

      - name: Test direct-device (mechanism B — one card, in-process)
        timeout-minutes: 30
        # ALL `-m 'not device_batch and not multi_card'` tests across tests/st (both shards' dirs):
        # direct @pl.jit kernel calls / config=test_config (and no-fixture device
        # tests), which execute the device synchronously in-process and cannot be
        # batched. Wrap them whole in ONE task-submit card session and run
        # in-process on the borrowed card (--device=$TASK_DEVICE, no
        # --execute-via-task-submit): one device init for the step, pytest's native
        # full capture on failure. Selection is by marker, so mixed files split
        # per-test and new tests need no edit. swimlane is --ignore'd here — it runs
        # in its own flagged step. (paged_attention has its own step below — passing
        # it as an explicit path here collapses pytest's dir collection.)
        # test_graph_execution is --ignore'd for a different reason: a ChipWorker
        # binds one (platform, device_id, runtime), and that file mixes
        # host_build_graph cases with a default-runtime A/B twin. Two runtimes in
        # one process poison the shared lane — the first Graph test failed 507018
        # and took the rest of the step's tests with it — so it runs --forked
        # below, one process per test.
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest \
              tests/st -v -m 'not device_batch and not multi_card' \
              --ignore=tests/st/distributed \
              --ignore=tests/st/codegen \
              --ignore=tests/st/runtime/framework_and_models/test_perf_swimlane.py \
              --ignore=tests/st/runtime/framework_and_models/test_graph_execution.py \
              --deselect=tests/st/runtime/framework_and_models/test_jit.py::TestJITExecution::test_persistent_cache_across_processes \
              --device=\$TASK_DEVICE --platform=a2a3"

      - name: Test persistent cache across processes (isolated pytest invocation)
        # The parent must never have initialized the card: earlier direct tests
        # retain process-level device state even after Worker.close(), so spawned
        # consumers cannot map registers (halMemCtl EACCES). A per-test fork does
        # not release that parent's state. Cover both READY reuse and startup-hook
        # bypass with the test's explicit, isolated PTOAS interpreter setup.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest \
              tests/st/runtime/framework_and_models/test_jit.py::TestJITExecution::test_persistent_cache_across_processes \
              -v --device=\$TASK_DEVICE --platform=a2a3"

      - name: Test paged-attention codegen (numeric compare, in device env)
        # tests/st/codegen runs device-free in the CPU codegen-tests job, but this
        # one file's numeric golden compare is unstable on a CPU torch/BLAS build,
        # so it runs here in the device job's environment. Own step (in-process
        # via task-submit) because it lives under the --ignore'd tests/st/codegen.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest \
              tests/st/codegen/torch/test_torch_codegen_paged_attention.py \
              -v --device=\$TASK_DEVICE --platform=a2a3"

      - name: Test multi-orch L2 (isolated pytest invocation)
        # Mechanism B: a single forked pytest wrapped whole in task-submit (no
        # precompile pipeline here). A ``Worker(level=2)`` session leaves runtime
        # state that poisons the next ``Worker(level=3)`` init in the same
        # process, so this file runs in its own pytest invocation.
        timeout-minutes: 5
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/distributed/test_l2_multi_orch.py -v --device=\$TASK_DEVICE"

      - name: Test swimlane output
        # --precompile-workers is what gives these tests an artifact directory at
        # all: they read the record through `case_run.dfx(...)`, which resolves
        # inside the case's own work_dir, and conftest returns early -- no pool,
        # no work_dir -- when the flag is absent.
        #
        # No --forked, which it used to pass: a forked child cannot resolve the
        # parent's compile futures, and the step hung until the 900s task cap
        # when the two were combined. Unforked it is 4 passed in 11s.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/runtime/framework_and_models/test_perf_swimlane.py -v --device=\$TASK_DEVICE --platform=a2a3 --enable-chip-swimlane --precompile-workers=8"

      - name: Test scheduling swimlane assertions
        # The 35 swimlane assertions under runtime/scheduling had never run: they
        # gate on `--enable-chip-swimlane`, which CI passed only to
        # test_perf_swimlane.py, so every one of them skipped in the batched
        # shard. Selected by the `swimlane` marker rather than by path, so the
        # correctness cases sharing these files are not re-run here.
        #
        # --precompile-workers, and no --forked, for the reasons on the two steps
        # above: each test reads its record through `case_run.dfx(...)`, which
        # needs the pool to have published a work_dir, and several tests sharing
        # one declared case then share its single device run.
        #
        # --device-num 2 because the device-pool path runs one case per card in
        # --device. Measured on a2a3 over these 19 cases: 122s on one card, 66s
        # on two, 35s on four. Two is the setting, not four: the extra 31s does
        # not justify holding four of a shared pool's cards for the length of
        # this step. Concurrency here was unreachable until the pre-submitter,
        # and unsafe until the device-init lock in pypto.runtime.worker.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 2 --timeout 3600 --max-time 1200 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest \
              tests/st/runtime/scheduling -v -m swimlane \
              --device=\$TASK_DEVICE --platform=a2a3 --enable-chip-swimlane \
              --precompile-workers=8 --strict-case-discovery"

      - name: Test Graph record-and-replay (one process per test)
        # --forked because a ChipWorker binds one (platform, device_id, runtime):
        # the host_build_graph cases and the default-runtime A/B twin in this file
        # cannot share a process.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/runtime/framework_and_models/test_graph_execution.py -v --device=\$TASK_DEVICE --platform=a2a3 --forked"

      - name: Test dump-args output
        # No pool and --forked, unlike the swimlane steps: this file's cases stay
        # fixture-driven (see TestSubmitDumpsManifest's inline_case marker), and
        # --forked is what keeps TestDumpTagManifest's module fixture in a
        # process of its own.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 600 \
            --run "cd $GITHUB_WORKSPACE/st-direct-checkout && source activate.sh && python -m pytest tests/st/runtime/framework_and_models/test_dump_tag.py -v --device=\$TASK_DEVICE --platform=a2a3 --dump-args --forked"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: st-direct-checkout

  dist-system-tests:
    # No container: HCCL needs host-only env (HCCL_LOGIC_SUPERPOD_ID, plugin
    # paths from set_env.sh). In docker the chip child silent-crashes in
    # comm_init.
    #
    # Checkout / install happen under ./dist-checkout so they don't collide
    # with system-tests' workspace (which is owned by container root and
    # would EACCES our ci-runner cleanup).
    #
    # Lint gate (see the lint-gate job) — never claim NPU slots for a tree that
    # doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the 2-device runner and pin task-submit to DEVICE_ID
    # (see system-tests). FLIP TO PROD: cpu runner + `--device auto --device-num 2`.
    #
    # Runs on the whole `npu` pool, x86_64 half included. It was pinned to
    # aarch64 for a while and the evidence behind that pin is worth keeping:
    # over the 19 completed runs before it, this job was 11/11 green on aarch64
    # and 3 green / 5 red on the x86_64 half, and a red run there did not merely
    # fail, it WEDGED THE CARD. One collective hangs --
    #   chip run lane is poisoned: finalize_native_run failed
    #   aclrtSynchronizeStreamWithTimeout (AICPU) failed: 507018
    # -- and from there the device cannot be re-entered at all: 207 subsequent
    # cases die in `simpler_init failed with code 507033`, and the recovery path
    # fails the same way (`force_reset_device: aclrtSetDevice(2) failed: 507033`,
    # `attach_current_thread: rtSetDevice(12) failed: 507033`). Both borrowed
    # cards end up unusable and CI cannot reset them itself, and that host's
    # ten npu runner instances share ONE set of cards, so the damage is not
    # contained to the job that hit it.
    #
    # The pin is lifted because THE HOST WAS REPAIRED. Corroborating signal from
    # the 43 most recent ci.yml runs (2026-08-31 11:28 -> 2026-09-01 06:40,
    # sampled 2026-09-01): that host's single-card npu jobs are 62 green / 5 red
    # (`system-tests` 32/2, `system-tests-direct` 30/3), and the reds are
    # scattered rather than clustered -- none of the host-wide failure waves that
    # went with the wedging. What that window does NOT contain is a MULTI-CARD
    # run there: this job and `pypto-lib-model` were pinned to aarch64 for all 43
    # of them, so the first two-card runs on x86_64 are the ones that follow this
    # change. Watch them.
    #
    # The earlier analysis also recorded two things its evidence did NOT
    # establish, and both cut against ever restoring the pin. (1) That this job
    # is the origin of the host's bad cards: over one morning the x86_64 host
    # showed a failure wave across ALL its npu jobs, single-card `system-tests` /
    # `system-tests-direct` included, and a two-card run of this job passed in
    # the middle of it -- which it could not have done if the cards were globally
    # wedged. A likelier reading is that some cards are bad at any given time and
    # this job, needing two, draws one more often. (2) That the split is
    # architectural: the 3 green x86_64 runs interleaved with the red ones in
    # time, so this was that host's health, not its ISA.
    #
    # So if the wedging returns, the thing to fix is the host again, not an arch
    # label -- the aarch64 box is being decommissioned and will not be there to
    # move to.
    runs-on: [self-hosted, linux, npu]
    defaults:
      run:
        working-directory: dist-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/dist-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./dist-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: dist-checkout
          needs-device: 'true'
          toolchain: bundle
          pip-cache-name: pip-dist
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          unset-ring: 'true'
          runtime-targets: build_package_a2a3;build_package_sim

      - name: Test distributed system tests
        # task-submit --timeout is the total wait for queueing plus execution;
        # allow 90 minutes while --max-time still caps device execution at 30m.
        # Give the Actions step another five minutes so the client can report
        # its timeout and clean up before the runner cancels the step.
        timeout-minutes: 95
        # Mechanism B (multi-card): borrow 4 NPUs via `task-submit --device auto
        # --device-num 4` for the whole pytest run; $TASK_DEVICE is the lent set
        # (comma-separated), passed to --device. The job no longer pins an
        # npu-2-device runner. activate.sh already unset PTO2_RING_* (they break
        # HCCL); task-submit preserves that env into the child.
        #
        # Most of a distributed test is card-free compilation, so the dist
        # conftest installs a lock that serializes only the device phase: while
        # one worker drives the cards the others compile. Measured on an a2a3
        # pair, identical results at every width -- 669s serial, 377s at -n 3,
        # where a worker is on the cards for ~95% of the wall clock and a fourth
        # would have nothing left to overlap.
        #
        # `--device-group-size 2` then splits the four cards into two such lanes
        # and deals the six workers between them, three each. The lock is named
        # after the cards it protects, so the lanes never wait on each other.
        # Two lanes measured 247s and three 165s against 377s for one -- 76%
        # efficiency at both widths, so the loss is the lane count, not something
        # that compounds. Card *time* barely moves (753 -> 833 card-seconds at
        # two lanes): a lane returns its cards as it finishes, so this is the
        # same work in half the wall clock, not more work.
        #
        # xdist's default `--dist load` is left alone: no fixture here is scoped
        # wider than a test, it measured 377s against `--dist loadfile`'s 388s,
        # and dealing tests to whichever worker is free is what keeps the lanes
        # balanced -- splitting the suite by hand cost 25% to imbalance at both
        # two and three ways.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 4 --timeout 5400 --max-time 1800 \
            --run "cd $GITHUB_WORKSPACE/dist-checkout && source activate.sh && python -m pytest tests/st/distributed -v -n 6 --device-group-size 2 --device=\$TASK_DEVICE --ignore=tests/st/distributed/test_l2_multi_orch.py"

      - name: Test multi-card cases outside tests/st/distributed
        # Multi-card used to be selected by directory, so a test needing two
        # cards anywhere else was collected by a single-card step and skipped
        # itself from the body. `@pytest.mark.multi_card(n)` makes the
        # requirement selectable, and this step is where those tests get the
        # cards: test_benchmark_l3_surfaces_per_rank_timing had never once run.
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 2 --timeout 3600 --max-time 900 \
            --run "cd $GITHUB_WORKSPACE/dist-checkout && source activate.sh && python -m pytest \
              tests/st -v -m multi_card --ignore=tests/st/distributed \
              --device=\$TASK_DEVICE --platform=a2a3"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: dist-checkout

  pypto-lib-compile:
    # Compile selected DeepSeek and Qwen operator cases without device execution.
    # A2/A3 extern wrappers need CANN headers from the npu runner.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    runs-on: [self-hosted, linux, "${{ matrix.runner }}"]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: a2a3
            runner: npu
            needs-cann: 'true'
            runtime-targets: build_package_a2a3;build_package_sim
          - platform: a5
            runner: cpu
            needs-cann: 'false'
            # Compile-only: no device and no A5 runtime assets required. Building
            # the A5 onboard runtime needs a CANN with HcclChannelAcquireWithConfig,
            # which this CPU runner's SDK does not provide; the sim wheel supplies
            # the Python SDK and source tree the kernel compiler reads.
            runtime-targets: build_package_sim
    defaults:
      run:
        working-directory: lib-compile-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/lib-compile-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
      PYPTO_GOLDEN_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYPTO_CODEGEN_MAX_WORKERS: 2
      # Large software FP32 kernels need headroom for PTOAS sync analysis.
      PYPTO_PTOAS_TIMEOUT_SECONDS: '180'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: lib-compile-checkout
          # This setup input activates CANN; compilation never acquires a device.
          needs-device: ${{ matrix.needs-cann }}
          toolchain: bundle
          pip-cache-name: pip-lib
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: ${{ matrix['runtime-targets'] || format('build_package_{0};build_package_sim', matrix.platform) }}

      - name: Clone current pypto-lib
        run: |
          git clone --depth 1 https://github.com/hw-native-sys/pypto-lib.git build/pypto-lib

      - name: Compile configured library cases
        id: compile
        env:
          LIB_PLATFORM: ${{ matrix.platform }}
        run: |
          source activate.sh
          python tests/ci/compile_pypto_lib.py --lib build/pypto-lib \
            --cases tests/ci/pypto_lib_compile.json \
            --platform "$LIB_PLATFORM" --jobs 4 --timeout 1200 \
            --output build/lib-compile-results

      - name: Upload compilation logs and manifest
        # Keep diagnostics for compile failures without uploading after successful runs.
        if: failure() && steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pypto-lib-compile-${{ matrix.platform }}
          path: |
            lib-compile-checkout/build/lib-compile-results/manifest.json
            lib-compile-checkout/build/lib-compile-results/results.json
            lib-compile-checkout/build/lib-compile-results/**/compile.log
            lib-compile-checkout/build/lib-compile-results/**/compilations.json
          retention-days: 7

  pypto-lib-model:
    # No container: each model run borrows an NPU from the host-level
    # `task-submit --device auto` queue (mechanism B — the whole `python
    # models/...` invocation, which compiles + runs in one process, is wrapped).
    # Host setup mirrors dist-system-tests (conda py310 + venv + activate.sh);
    # the job holds no card and runs on a CPU runner. task-submit preserves the
    # caller's environment (per daily_ci.yml `a5-system-tests`), so sourcing
    # activate.sh before the wrap is enough — the child inherits the venv + env.
    #
    # Lint gate (see the lint-gate job) — never claim an NPU slot for a tree
    # that doesn't lint. `toolchain` is ungated and runs alongside the gate.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    # Checkout + clone pypto-lib + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    # TEST MODE: keep the device runner and pin task-submit to its card (see
    # system-tests). FLIP TO PROD: cpu runner + `--device auto`.
    #
    # Runs on the whole `npu` pool, x86_64 half included. It was pinned to
    # aarch64 as a PRECAUTION alongside dist-system-tests, on weaker evidence
    # than that job's: one step here is multi-card -- the DeepSeek moe example
    # at `--ep 2` -- and a failing multi-card run is known to leave the cards it
    # borrowed unusable (see dist-system-tests for the 507018 -> 507033 cascade
    # and the failing force_reset), on a host whose ten runner instances share
    # ONE set of cards.
    #
    # It was always the first of the two to unpin, and it goes with
    # dist-system-tests now that the x86_64 npu host has been repaired (see that
    # job for the health data). Nothing here was ever shown to wedge anything:
    # the moe step has never itself failed (1 pass on x86_64; otherwise skipped
    # behind an earlier step), and the two red runs were both single-card Qwen3
    # steps during a host-wide x86_64 npu failure wave that also took down
    # single-card jobs. If multi-card runs start wedging cards again, split the
    # moe step into its own job rather than reaching for an arch label -- nine
    # single-card steps should not pay for one multi-card one.
    runs-on: [self-hosted, linux, npu]
    defaults:
      run:
        working-directory: lib-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/lib-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Every job now runs as ci-runner (no container root), but the shared
      # ci-cache/ccache dir still holds root-owned entries from the container era,
      # so keep the umask that keeps new entries mutually writable. The cache
      # *paths* (CCACHE_DIR / PIP_CACHE_DIR) and CCACHE_NAMESPACE are derived by
      # setup-ci-job from the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./lib-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: lib-checkout
          needs-device: 'true'
          toolchain: bundle
          pip-cache-name: pip-lib
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_a2a3;build_package_sim

      - name: Clone pypto-lib (Qwen3-14B + DeepSeek-V4-Flash models)
        # $GITHUB_WORKSPACE/pypto-lib is a sibling of lib-checkout, so
        # actions/checkout won't clean it on a persistent self-hosted runner — a
        # leftover dir from a previous run makes `git clone` fail with
        # "destination path already exists". Remove it first (mirrors daily_ci).
        run: |
          rm -rf "$GITHUB_WORKSPACE/pypto-lib"
          git clone --depth 1 https://github.com/hw-native-sys/pypto-lib.git "$GITHUB_WORKSPACE/pypto-lib"

      # Each model run borrows a card via task-submit for the whole `python ...`
      # invocation (compile + run). task-submit propagates the inner exit code,
      # so a model crash fails the step. $TASK_DEVICE is the lent card.
      #
      # HOW MANY CARDS. pypto-lib states each model's requirement in the model
      # file itself, as a `# ci: devices=N` marker on its own line, and the
      # --device-num below must match it. On main today that is one card for the
      # two Qwen3 examples and for decode_swa / decode_hca / decode_csa, and two
      # for the three context-parallel prefill examples plus decode_moe. Borrowing too
      # few does not degrade gracefully -- the model aborts before it computes
      # anything, e.g. `CP2 requires 2 devices, got [1]` -- so when a step here
      # starts failing that way, re-read the marker rather than the model code:
      # this job clones pypto-lib main, so its requirements move without any
      # change on this side.
      - name: Run pypto-lib Qwen3-14B decode example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/qwen3_14b/decode_fwd.py -p a2a3 -d \$TASK_DEVICE"

      # Prefill exercises the dynamic-shape host path that decode does not: its
      # token axis is a `pl.dynamic()` symbol, the per-layer temp is sized from
      # `pl.tensor.dim(...)`, and the layer result is reassigned to the same
      # loop-carried var. Regressions in cross-function dynamic-shape typing
      # surface here (and only here) before they reach pypto-serving.
      - name: Run pypto-lib Qwen3-14B prefill example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/qwen3_14b/prefill_fwd.py -p a2a3 -d \$TASK_DEVICE"

      # NOTE: Qwen3-14B decode performance monitoring (L2-swimlane makespan +
      # perf_guard) lives in the daily_ci.yml `qwen3-perf` job, not here. Per-PR
      # CI only checks functional correctness; perf is noisy (~8.5% jitter) and
      # is sampled daily with multiple runs averaged to keep the signal stable.

      - name: Run pypto-lib DeepSeek-V4-Flash decode_swa example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/decode_swa.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash decode_hca example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/decode_hca.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash decode_csa example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/decode_csa.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash prefill_csa example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 2 --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/prefill_csa.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash prefill_hca example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 2 --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/prefill_hca.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash prefill_swa example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 2 --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/prefill_swa.py -p a2a3 -d \$TASK_DEVICE"

      - name: Run pypto-lib DeepSeek-V4-Flash decode_moe example
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-lib
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --device-num 2 --timeout 3600 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/lib-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-lib && python models/deepseek_v4_flash_mtp/decode_moe.py -p a2a3 -d \$TASK_DEVICE --ep 2"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: lib-checkout

  serving-guard:
    # Does a toolchain bump break generation in pypto-serving?
    #
    # `pypto-lib-model` proves the models still compile and run; it does not
    # prove the tokens come out right end to end. An assembler change can leave
    # every kernel compiling and still corrupt what the model emits, and the
    # first place that shows is serving's accuracy guards.
    #
    # WHY THIS LIVES HERE AND NOT IN pypto-serving. serving's own `unit-tests`
    # job clones pypto from `origin HEAD` -- it always tests against pypto main,
    # so it cannot see an unmerged pin. Running it from this side instead builds
    # THIS pull request's pypto and points serving at it, which is the same
    # inversion `pypto-lib-model` already does for pypto-lib.
    #
    # SKIPPED BY DEFAULT. Gated on a changed `PTOAS_VERSION` assignment in
    # toolchain/versions.env, the pin that selects the assembler release. It
    # borrows cards to run a downstream repo's model tests, which is far too
    # expensive for every pull request, and the risk it covers only exists when
    # the pin moves. `workflow_dispatch` forces it (see the `changes` job).
    #
    # Lint gate + docs-only gate, as every other device job here.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.ptoas_version_changed == 'true'
    # Checkout + clone pypto-serving + test only.
    permissions:
      contents: read
    # `npu-xp` selects the runners provisioned for this guard: they carry the
    # Qwen3 weights the steps below read from the runner config, which the rest
    # of the npu pool does not stage.
    runs-on: [self-hosted, linux, npu-xp]
    # Matches pypto-serving's own job, which carries these guards over a
    # from-source pypto build. Its comment records that 90 left no headroom once
    # the DeepSeek steps (3600s client wait under a 4800s task cap) and a cold
    # pip cache landed in one run. Kept at 120 with DSpark dropped: the margin
    # covers a cold build plus the 8-card matrix, and shrinking it would only
    # trade headroom for nothing.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: serving-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/serving-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # See pypto-lib-model: the shared ci-cache still holds root-owned entries.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Same bootstrap as pypto-lib-model: local `uses: ./...` resolves against
        # $GITHUB_WORKSPACE, but the repo is checked out into ./serving-checkout.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false

      - name: Resolve runner card and model dir
        # Checked before the setup on purpose, mirroring serving's own job: this
        # reads nothing but the runner's own env, while behind it lie a
        # checkout, a toolchain install and a from-source pypto build. A host
        # missing either must say so now, not forty minutes later as an opaque
        # missing-path error inside pytest.
        #
        # Runs at the workspace root, overriding this job's `defaults`: that
        # directory is what the setup step below creates, so a step ordered
        # ahead of it cannot start there.
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          # DEVICE_ID is how the steps below claim a card, passed straight to
          # `task-submit --device`. The runner config decides what it means: a
          # card id on a runner that pins one, or `auto` to borrow per step (the
          # `xp` runners). Only emptiness is wrong -- `task-submit --device ""`
          # auto-borrows silently, so an unset value would look like it worked
          # (see system-tests, which guards the same way).
          echo "[device] DEVICE_ID=${DEVICE_ID:-}"
          if [ -z "${DEVICE_ID:-}" ]; then
            echo "::error::DEVICE_ID is empty in the runner env — set it to a card id or 'auto'"
            echo "The runner declares its host layout in <runner-root>/.env, one bare"
            echo "KEY=VALUE per line; restart the runner service after editing it."
            exit 1
          fi
          bad=0
          for key in \
            PYPTO_QWEN3_MODEL_DIR \
            PYPTO_DSV4_MODEL_DIR; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "::error::$key is not set — add it to this runner's .env"
              bad=1
            elif [ ! -d "$value" ]; then
              echo "::error::$key points at a missing directory: $value"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "The runner declares its host layout in <runner-root>/.env, one bare"
            echo "KEY=VALUE per line (no quotes, no trailing comments); restart the"
            echo "runner service after editing it. pypto-serving's own unit-tests job"
            echo "reads the same variables."
            exit 1
          fi
          echo "model dirs resolved from the runner config"

      - name: Setup CI job
        # pypto's own setup, not serving's: this builds the pull request under
        # test. `pip-cache-name` is distinct so this job never shares a pip dir
        # with `pypto-lib-model` or the system-test jobs.
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: serving-checkout
          needs-device: 'true'
          toolchain: bundle
          pip-cache-name: pip-serving-guard
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_a2a3;build_package_sim

      - name: Clone pypto-serving
        # A sibling of serving-checkout, so actions/checkout leaves it alone on
        # this persistent runner — and a leftover dir would make `git clone`
        # fail, so remove it first (mirrors pypto-lib-model).
        #
        # WITH SUBMODULES. pypto-lib is a submodule of pypto-serving, and the
        # Qwen3-14B kernels the executor loads come from it. A non-recursive
        # clone leaves it empty, and the model then resolves from whatever
        # pypto-lib happens to be lying in this runner's workspace — which is
        # a different revision from the one serving pins, and the ring sizing
        # baked into serving's tests is tuned against the pinned one. That
        # mismatch reaches the card as HEAP_RING_DEADLOCK.
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/pypto-serving"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/hw-native-sys/pypto-serving.git \
            "$GITHUB_WORKSPACE/pypto-serving"
          echo "pypto-serving under test: $(git -C "$GITHUB_WORKSPACE/pypto-serving" rev-parse HEAD)"
          git -C "$GITHUB_WORKSPACE/pypto-serving" submodule status --recursive
          # An empty submodule dir is the failure mode above, and it is silent:
          # the model still loads, from the wrong revision.
          test -f "$GITHUB_WORKSPACE/pypto-serving/pypto-lib/models/qwen3_14b/prefill_fwd.py" || {
            echo "::error::pypto-serving's pypto-lib submodule is empty — the Qwen3 kernels would resolve elsewhere"
            exit 1
          }

      - name: Install pypto-serving and its dependencies
        # pypto's `setup-ci-job` installs what pypto needs; serving carries its
        # own runtime stack (msgspec for the engine<->worker IPC, transformers
        # for the tokenizer, fastapi/uvicorn for the HTTP surface, and
        # prometheus-client for metrics). Mirrors the
        # equivalent step in pypto-serving's own setup action -- keep the two in
        # step, since a dependency added there fails here as a bare
        # ModuleNotFoundError.
        #
        # `--no-deps -e .`: serving's pyproject declares no dependencies, and
        # the stack around it (CPU torch, from-source pypto) is assembled by
        # hand above, so resolution must not be allowed to replace it.
        #
        # NOT `pip`. This job runs on `toolchain: bundle`, whose venv is built
        # by `uv venv` and contains no pip at all -- a bare `pip install` there
        # resolves to the one outside the venv, reports success, and installs
        # where the venv cannot see it. That is exactly how msgspec went missing
        # at import time while this step stayed green. `setup-ci-job` states the
        # split in PYPTO_USE_UV; its own `py_install` is action-local, so mirror
        # it here.
        run: |
          set -euo pipefail
          source activate.sh
          py_install() {
            if [ "${PYPTO_USE_UV:-false}" = "true" ]; then
              uv pip install "$@"
            else
              pip install "$@"
            fi
          }
          py_install 'nanobind<3' transformers safetensors numpy fastapi uvicorn pytest msgspec prometheus-client
          py_install --no-deps -e "$GITHUB_WORKSPACE/pypto-serving"
          # Prove the venv can see them, so a silent install into the wrong
          # interpreter fails here rather than as a ModuleNotFoundError inside
          # a task-submit child forty lines of traceback later.
          python -c 'import msgspec, prometheus_client, transformers, pypto_serving' \
            || { echo "::error::serving dependencies are not importable from $(command -v python)"; exit 1; }
          # Which pypto and which pypto-serving the tests will actually load.
          # This runner's workspace can hold a sibling pypto-lib left by another
          # job, so print the resolved paths rather than assuming.
          python - <<'PY'
          import pypto, pypto_serving
          print(f"[resolved] pypto         {pypto.__file__}")
          print(f"[resolved] pypto_serving {pypto_serving.__file__}")
          PY

      # The generation guards from serving's `unit-tests`. Each answers "does it
      # still produce correct text", which is what an assembler change threatens
      # without necessarily breaking a compile:
      #
      #   qwen3_accuracy    generated tokens vs a reference          1 card
      #   qwen3_serving     prefix cache / chunked prefill / batch   1 card
      #   deepseek_v4       MTP HTTP matrix                          8 cards
      #
      # DeepSeek earns its cards here: it is the model the cache-policy work
      # this pin exists for targets, and it exercises MoE / MTP / cross-rank
      # collectives that Qwen3-14B never touches, so a Qwen-only guard would
      # miss a whole class of regression. The gate fires only when the pin
      # moves, so the cost is paid rarely -- which is what buys the multi-card
      # step its room.
      #
      # serving's fourth guard, the 16-card DSpark target
      # (`test_deepseek_dspark_accuracy.py`), is deliberately NOT here. It fails
      # on this runner independently of the pin -- red on plain main at v0.60 as
      # well as at v0.61 -- and it is red on pypto-serving's own `unit-tests` job
      # on its main branch too. Carrying it would make this job permanently red
      # and so unable to report on the thing it exists to watch. Add it back once
      # it passes upstream.
      #
      - name: Run pypto-serving Qwen3 accuracy guard
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-serving
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 1200 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/serving-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-serving && DEVICE_ID=\$TASK_DEVICE PYTHONPATH=$PYTHONPATH PYPTO_QWEN3_MODEL_DIR=$PYPTO_QWEN3_MODEL_DIR python -m pytest tests/test_qwen3_accuracy.py -q -s"

      - name: Run pypto-serving Qwen3 serving guard
        env:
          PYTHONPATH: ${{ github.workspace }}/pypto-serving
        run: |
          source activate.sh
          task-submit --device "$DEVICE_ID" --timeout 1200 --max-time 1800 \
            --run "source $GITHUB_WORKSPACE/serving-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-serving && DEVICE_ID=\$TASK_DEVICE PYTHONPATH=$PYTHONPATH PYPTO_QWEN3_MODEL_DIR=$PYPTO_QWEN3_MODEL_DIR python -m pytest tests/test_qwen3_serving.py -q -s"

      - name: Run pypto-serving DeepSeek V4 MTP HTTP matrix
        # Multi-card, so it borrows its own eight rather than using this
        # runner's single card, and --ignore-whitelist because the pool the
        # whitelist exposes is smaller than that. A second server startup can
        # exceed the old 2400s client wait; allow 3600s under a 4800s task cap.
        env:
          PYPTO_RUNTIME_LOG: error
        run: |
          source activate.sh
          task-submit --device auto --device-num 8 --ignore-whitelist \
            --timeout 3600 --max-time 4800 \
            --run "source $GITHUB_WORKSPACE/serving-checkout/activate.sh && cd $GITHUB_WORKSPACE/pypto-serving && TASK_DEVICE=\$TASK_DEVICE PYTHONPATH=$GITHUB_WORKSPACE/pypto-serving PYPTO_DSV4_MODEL_DIR=$PYPTO_DSV4_MODEL_DIR PYPTO_RUNTIME_LOG=$PYPTO_RUNTIME_LOG python -m pytest tests/test_deepseek_v4_accuracy.py -q -s"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: serving-checkout

  onboard-tests-a5:
    # A5 (Ascend950) on-board coverage. Formerly `tests-a5`; renamed
    # because the job now also runs MX ST (matmul_mx / quant_mx) on the same
    # npu-a5 card. Three steps share one checkout / install:
    #   1. mixed-kernel-tests-a5 — cross_core V<->C path on silicon
    #   2. mx-tests-a5           — host-prequant matmul_mx + on-board quant/quant-to-matmul
    #   3. vf-tests-a5           — EmitC adapters + VPTO helpers through persistent Workers
    #
    # Everything else in this workflow exercises the mixed / cross-core path on
    # a2a3 (910B) only: `system-tests*` run --platform=a2a3, and
    # `system-tests-a5sim` runs the a5 profile in the SIMULATOR. This job is the
    # first per-PR run of those paths on real A5 silicon.
    #
    # --- mixed-kernel-tests-a5 ---
    # Scope — cross_core/test_cross_core.py, already validated on the a5 profile
    # elsewhere (it runs on a5sim in the job below), so a red result here means a
    # regression and not an unvalidated combination: V<->C tpush/tpop over all
    # three split modes (UP_DOWN / LEFT_RIGHT / none), multi-pipe, explicit
    # slot_num (arch-aware sizing), bidirectional-in-spmd.
    #
    # test_qwen3_decode_scope3_mixed.py is deliberately NOT here. It stalls on
    # board under --platform=a5 — PTO2 scheduler timeout, sub_class=S1
    # running-stalled, always inside the oproj_block mixed kernel, at a different
    # task index and core on every run. It is not a regression this job can gate
    # on: an on-board bisect over 71020585..e5aa8131 came back red at every point
    # INCLUDING 71020585 itself, the commit that passed here on 2026-08-13 on this
    # same runner and card, so no source change explains it. Restore this case
    # once the stall is understood.
    # Two cross_core cases are handled specially under --platform=a5; the first
    # on-board run of this job is what found them:
    #   - test_explicit_slot_num       DESELECTED via @pytest.mark.platforms.
    #                                  `local_slot_num` on
    #                                  pto.{aic,aiv}_initialize_pipe is an
    #                                  a2/a3-only operand — ptoas rejects it for
    #                                  the 950 frontend pipe lowering whatever
    #                                  its value — so the manual
    #                                  pl.{aic,aiv}_initialize_pipe route the case
    #                                  exercises does not exist on this arch. A
    #                                  platform limitation, not a defect awaiting
    #                                  a fix, so it is not xfail.
    #   - test_multiple_pipes_nosplit  XFAIL (strict) — every output element is
    #                                  wrong on 950 silicon; passes on a5sim and
    #                                  a2a3. 950 expects a fractal layout at the
    #                                  cross-core boundary, and the V->C adapter
    #                                  is inserted only by ExpandMixedKernel (the
    #                                  sole consumer of RequiresVtoCFractalAdapt),
    #                                  so a hand-written pl.tpush_to_aic pushes a
    #                                  bare ND tile the cube then reads as
    #                                  fractal. Strict because a layout mismatch
    #                                  is deterministic: an XPASS means the
    #                                  adapter now reaches manual pipes.
    # The xfail is attached as a marker rather than raised via pytest.xfail(),
    # which aborts before the body and could never report XPASS — the case runs
    # on every job, so a backend fix surfaces here instead of the verdict being
    # frozen at whatever the first on-board run produced.
    # Deliberately NOT here: the mixed suites carrying `@pytest.mark.platforms("a2a3")`
    # (syncall, sync_set_wait, split parity incl. split_aiv, tpush/grouped-tfree
    # valid-shape, split-reduce parity) — pytest deselects them under --platform=a5,
    # so listing them would only add collection noise; and test_fused_matmul_scatter.py,
    # whose test cases hardcode `get_backend_type() -> Ascend910`, so under
    # --platform=a5 it would compile for 910B and run on A5 silicon. Widen this
    # list once those are made arch-agnostic.
    #
    # --- mx-tests-a5 ---
    # Scope — tests/st/runtime/ops/test_matmul_mx.py (host-prequant MXFP8/FP4×FP8
    # matmul_mx / matmul_mx_acc), test_quant_mx.py (on-board quant_mx for
    # MX_A_ZZ / MX_B_NN), and test_quantized_matmul_mx.py (GM-staged
    # quant-to-matmul). All are `@pytest.mark.platforms("a5")`.
    #
    # Setup is the standard device-job shape (same composite action / env as
    # `system-tests`), on the npu-a5 runner pool. That runner must satisfy the
    # setup-ci-job contract for a bundle job: CI_CACHE_ROOT / CANN_ROOT +
    # DEVICE_ID in its .env, the pypto-toolchain bundle installed, and
    # task-submit / ccache / git / curl on PATH. No conda: CONDA_ROOT is read
    # only on the conda path.
    # Checkout / install land under ./a5-checkout so they never collide with the
    # other jobs' trees on a shared self-hosted host.
    #
    # Lint gate (see the lint-gate job) — never claim an NPU slot for a tree that
    # doesn't lint. Docs-only gate (see the `changes` job) — prose cannot break a build.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    # Checkout + test only — no write scopes needed on GITHUB_TOKEN.
    permissions:
      contents: read
    runs-on: [self-hosted, linux, npu-a5]
    defaults:
      run:
        working-directory: a5-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/a5-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared ci-cache/ccache dir still holds root-owned entries from the
      # container era; keep the umask that leaves new entries mutually writable.
      # The cache *paths* and CCACHE_NAMESPACE are derived by setup-ci-job from
      # the runner config's CI_CACHE_ROOT.
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./a5-checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
          clean: false
          # Bootstrap only fetches the public .github/actions tree; it doesn't
          # need the token persisted into .git/config afterward (zizmor artipacked).

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          checkout-path: a5-checkout
          needs-device: 'true'
          pip-cache-name: pip-a5
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_a5;build_package_sim
          # Python and GCC come from the pypto-toolchain bundle, like every
          # other self-hosted job. The npu-a5 pool is provisioned with the
          # bundle and carries no conda env, so this is not optional here.
          toolchain: bundle

      - name: mixed-kernel-tests-a5
        # The client waits up to 120m total for queueing plus execution, while
        # --max-time independently caps device execution at 60m. Leave another
        # five minutes for the client to report a timeout and clean up.
        timeout-minutes: 125
        # Mechanism B: one task-submit card session wrapping a single pytest run
        # (no precompile pipeline), executed in-process on the borrowed card. The
        # suite is parametrized over the platform ids, so --platform=a5 selects
        # exactly the a5 variants and deselects the a2a3-marked ones. The FP32
        # matmul cases verify entry initialization after deliberately enabling HF32.
        # The rsqrt cases check both API entries against a FP64 ULP reference.
        # --forked isolates each case's device init, as the daily a5 job does.
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          task-submit --device "$DEVICE_ID" --timeout 7200 --max-time 3600 \
            --run "cd $GITHUB_WORKSPACE/a5-checkout && source activate.sh && python -m pytest \
              tests/st/runtime/cross_core/test_cross_core.py \
              tests/st/runtime/ops/test_matmul.py::test_fp32_matmul_clears_inherited_hf32 \
              tests/st/runtime/ops/test_rsqrt.py::test_a5_rsqrt_precision_ulp \
              -v --forked --platform=a5 --device=\$TASK_DEVICE"

      - name: mx-tests-a5
        # Match the 120m total client wait, 60m device execution cap, and five
        # extra minutes for reporting and cleanup used by mixed-kernel-tests-a5.
        timeout-minutes: 125
        # Same card session shape as mixed-kernel-tests-a5. matmul_mx covers
        # host-prequant MXFP8 / FP4×FP8; quant_mx covers on-board TQUANT; the
        # staged case verifies the produced data and scale feed a later matmul.
        run: |
          source activate.sh
          echo "[device] DEVICE_ID=$DEVICE_ID"
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          task-submit --device "$DEVICE_ID" --timeout 7200 --max-time 3600 \
            --run "cd $GITHUB_WORKSPACE/a5-checkout && source activate.sh && python -m pytest \
              tests/st/runtime/ops/test_matmul_mx.py \
              tests/st/runtime/ops/test_quant_mx.py \
              tests/st/runtime/ops/test_quantized_matmul_mx.py \
              -v --forked --platform=a5 --device=\$TASK_DEVICE"

      - name: vf-tests-a5
        id: vf-tests
        shell: bash
        timeout-minutes: 125
        # Each acceptance test already isolates its Worker in a bounded child
        # process. Keep pytest serial and use the card reserved by task-submit.
        run: |
          source activate.sh
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          mkdir -p build
          output=$(mktemp -d "$PWD/build/vpto-ci.XXXXXX")
          echo "artifacts=$output" >> "$GITHUB_OUTPUT"
          task-submit --device "$DEVICE_ID" --timeout 7200 --max-time 3600 \
            --run "cd '$GITHUB_WORKSPACE/a5-checkout' && source activate.sh && \
              export PYPTO_RUN_VPTO_ONBOARD=1 PYPTO_VPTO_DEVICE_ID=\$TASK_DEVICE \
                PYPTO_VPTO_TIMEOUT=900 PYPTO_SKIP_RUNTIME_PIN_CHECK=0 \
                PYPTO_VPTO_RUNTIME_OUTPUT='$output' && \
              python -m pytest tests/st/runtime/vpto --platform=a5 -k persistent -v \
                --junitxml='$output/junit.xml'" 2>&1 | tee "$output/task-submit.log"

      - name: Upload VF A5 results
        if: always() && steps.vf-tests.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: vf-a5-results
          path: ${{ steps.vf-tests.outputs.artifacts }}
          if-no-files-found: error
          retention-days: 14

      - name: Build extended register ST artifacts
        id: reg-extended-build
        shell: bash
        timeout-minutes: 125
        # Compile without reserving an NPU. Execution below consumes these
        # production artifacts and checks all 18 ops across 126 numerical cases.
        run: |
          source activate.sh
          mkdir -p build
          output=$(mktemp -d "$PWD/build/reg-extended-ci.XXXXXX")
          echo "artifacts=$output" >> "$GITHUB_OUTPUT"
          task-submit --no-device --timeout 7200 --max-time 1800 \
            --run "cd '$GITHUB_WORKSPACE/a5-checkout' && source activate.sh && \
              export TORCH_DEVICE_BACKEND_AUTOLOAD=0 PYPTO_SKIP_RUNTIME_PIN_CHECK=0 && \
              python tests/st/runtime/vpto/test_reg_extended_onboard.py --build '$output'" \
            2>&1 | tee "$output/build.log"

      - name: reg-extended-tests-a5
        shell: bash
        timeout-minutes: 125
        env:
          REG_EXTENDED_OUTPUT: ${{ steps.reg-extended-build.outputs.artifacts }}
        run: |
          source activate.sh
          test -n "$DEVICE_ID" || { echo "DEVICE_ID is empty in the runner env"; exit 1; }
          task-submit --device "$DEVICE_ID" --timeout 7200 --max-time 900 \
            --run "cd '$GITHUB_WORKSPACE/a5-checkout' && source activate.sh && \
              export TORCH_DEVICE_BACKEND_AUTOLOAD=0 PYPTO_SKIP_RUNTIME_PIN_CHECK=0 \
                PYPTO_RUN_VPTO_ONBOARD=1 PYPTO_VPTO_DEVICE_ID=\$TASK_DEVICE \
                PYPTO_VPTO_RUNTIME_OUTPUT='$REG_EXTENDED_OUTPUT' && \
              python -m pytest tests/st/runtime/vpto/test_reg_extended_onboard.py \
                --platform=a5 --device=\$TASK_DEVICE -v \
                --junitxml='$REG_EXTENDED_OUTPUT/junit.xml'" \
            2>&1 | tee "$REG_EXTENDED_OUTPUT/task-submit.log"

      - name: Upload extended register A5 results
        if: always() && steps.reg-extended-build.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: reg-extended-a5-results
          path: ${{ steps.reg-extended-build.outputs.artifacts }}
          if-no-files-found: error
          retention-days: 14

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: a5-checkout

  onboard-tests-a5-distributed:
    # Allow both test steps (35 + 40 minutes) plus setup and cleanup.
    timeout-minutes: 85
    # Run Host-domain acceptance on two A5 cards independently of the
    # four-card URMA async suite. /ci full uses the workflow from main;
    # automatic integration PR runs use their merge revision's workflow.
    # A missing async suite fails instead of passing a bootstrap placeholder.
    needs: [changes, toolchain, lint-gate]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.full == 'true'
    permissions:
      contents: read
    runs-on: [self-hosted, linux, npu-a5]
    defaults:
      run:
        working-directory: a5-dist-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/a5-dist-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: a5-dist-checkout
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          needs-device: 'true'
          pip-cache-name: pip-a5
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_a5
          # Keep runner-specific ring settings out of this job's environment.
          unset-ring: 'true'
          toolchain: bundle

      - name: Run Host communication-domain tests
        timeout-minutes: 35
        run: |
          source activate.sh
          HOST_DOMAIN_LOGDIR="$GITHUB_WORKSPACE/a5-dist-checkout/outputs/host_comm_domain/ascend"
          mkdir -p "$HOST_DOMAIN_LOGDIR"
          export ASCEND_PROCESS_LOG_PATH="$HOST_DOMAIN_LOGDIR"
          # Exercise local Host access and file/tensor initialization with all
          # reset policies independently of the URMA async suite.
          task-submit --device auto --device-num 2 --timeout 1800 --max-time 900 \
            --run "cd $GITHUB_WORKSPACE/a5-dist-checkout && source activate.sh && python -m pytest \
              tests/st/distributed/test_l3_host_comm_domain.py \
              -v --platform=a5 --device=\$TASK_DEVICE --durations=0 \
              --junitxml=$GITHUB_WORKSPACE/a5-dist-checkout/ci-host-domain-junit.xml"

      - name: Run distributed tests
        timeout-minutes: 40
        run: |
          source activate.sh
          LOGDIR="$GITHUB_WORKSPACE/a5-dist-checkout/outputs/urma_async/ascend"
          mkdir -p "$LOGDIR"
          export ASCEND_PROCESS_LOG_PATH="$LOGDIR"
          # Four cards select the P=4 cases. No --forked: JIT compilation can
          # leave a child that pytest-forked waits on beyond its timeout.
          # The suite passes in ~5.5 min (slow path ~12 min). Bound a hung
          # case at 15 min of execution and 20 min of card-queue wait so a
          # failure reaches the log quickly instead of after the old 65/30-min caps.
          task-submit --device auto --device-num 4 --timeout 1200 --max-time 900 \
            --run "cd $GITHUB_WORKSPACE/a5-dist-checkout && source activate.sh && python -m pytest \
              tests/st/distributed/test_l3_urma_async.py \
              -v --platform=a5 --device=\$TASK_DEVICE --durations=0 \
              --junitxml=$GITHUB_WORKSPACE/a5-dist-checkout/ci-distributed-junit.xml"

      - name: Upload distributed test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-distributed-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            a5-dist-checkout/ci-host-domain-junit.xml
            a5-dist-checkout/outputs/host_comm_domain/ascend/**
            a5-dist-checkout/ci-distributed-junit.xml
            a5-dist-checkout/outputs/urma_async/ascend/**

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: a5-dist-checkout

  system-tests-a5sim:
    permissions:
      contents: read
      packages: read
    # Lint gate (see the lint-gate job); `toolchain` is ungated and runs
    # alongside it.
    # Docs-only gate (see the `changes` job) — prose cannot break a build.
    #
    # The gate is spelled out rather than left implicit because
    # `prebuild-wheels-github` joined `needs`: the default "skip when a
    # dependency failed" would let a failed prebuild skip this job, and a
    # skipped required context reads as satisfied. Lint still gates it exactly
    # as before; the prebuild only decides whether the install step has a wheel
    # to use.
    needs: [changes, toolchain, lint-gate, prebuild-wheels-github]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.lint-gate.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      PTOAS_ROOT: ${{ github.workspace }}/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      # Build inputs from build-constraints.txt; see the unit-tests job.
      PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
    container:
      image: ghcr.io/hw-native-sys/pypto/github-ci:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_sha }}
          persist-credentials: false
          submodules: true

      # Same story as unit-tests: 7m52 of from-scratch compiling on run
      # 32452961616 because a GitHub-hosted runner keeps nothing between runs.
      # Kept as a separate cache from that job's on purpose — this one builds
      # inside ghcr.io/.../github-ci (ubuntu 22.04, gcc-15), unit-tests builds
      # on the runner image, and mixing objects from two toolchains in one
      # namespace is how a compile cache starts serving the wrong ones.
      # Both wheels come from prebuild-wheels-github, which runs in this same
      # image — so unlike the unit-tests job there is not even a container
      # boundary between building them and installing them.
      - name: Download the prebuilt wheels
        if: needs.prebuild-wheels-github.outputs.artifact_name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          name: ${{ needs.prebuild-wheels-github.outputs.artifact_name }}

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          whl="$(ls wheelhouse/pypto-*.whl 2>/dev/null | head -1)"
          if [ -n "$whl" ]; then
            echo "installing the prebuilt wheel: $whl"
            pip install "pypto[dev] @ file://$PWD/$whl"
          else
            echo "::warning::no prebuilt wheel — building in place"
            pip install -v .[dev]
          fi

      - name: Cache ptoas environment
        id: cache-ptoas
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ptoas-bin
          key: ptoas-x86_64-${{ env.PTOAS_VERSION }}-${{ env.PTOAS_SHA256 }}

      - name: Install ptoas
        if: steps.cache-ptoas.outputs.cache-hit != 'true'
        run: |
          PTOAS_PACKAGE_VERSION="${PTOAS_VERSION#v}"
          PTOAS_WHEEL_NAME="ptoas-${PTOAS_PACKAGE_VERSION}-cp310-cp310-manylinux_2_34_x86_64.whl"
          PTOAS_WHEEL="/tmp/$PTOAS_WHEEL_NAME"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/hw-native-sys/PTOAS/releases/download/${PTOAS_VERSION}/${PTOAS_WHEEL_NAME}" \
            -o "$PTOAS_WHEEL"
          echo "${PTOAS_SHA256}  $PTOAS_WHEEL" | sha256sum -c -
          rm -rf "$PTOAS_ROOT"
          python -m venv "$PTOAS_ROOT" --system-site-packages
          "$PTOAS_ROOT/bin/python" -m pip install "$PTOAS_WHEEL"
          "$PTOAS_ROOT/bin/ptoas" --version

      - name: Install simpler
        run: |
          whl="$(ls wheelhouse/simpler-*.whl 2>/dev/null | head -1)"
          if [ -n "$whl" ]; then
            echo "installing the prebuilt wheel: $whl"
            pip install "simpler @ file://$PWD/$whl"
          else
            echo "::warning::no prebuilt wheel — building in place"
            rm -rf ./runtime/build
            pip install -v ./runtime
          fi
          python -c "import pypto, simpler; print('env OK:', pypto.__file__)"

      - name: Test PTOAS compilation regressions
        # Reuse the pinned compiler above. Missing or incompatible PTOAS must
        # fail this step instead of skipping the native compilation assertions.
        run: >-
          python -m pytest tests/ut/codegen/
          --require-ptoas -m ptoas_compile -v

      - name: Test CPU simulator target admission
        # The unit-test job lacks Simpler. Require both optional prerequisites
        # here so all four architecture/core cases run instead of skipping.
        run: |
          python -c "import simpler_setup"
          g++-15 --version
          python -m pytest tests/ut/runtime/test_cpu_sim_target.py -v

      - name: Test fillpad_inplace numerical correctness with PTOAS
        # The default ST planner is PYPTO. Select PTOAS explicitly to exercise
        # shared views and compare both valid and padded rows with the golden.
        run: >-
          python -m pytest tests/st/runtime/ops/test_fillpad_inplace.py
          --memory-planner=ptoas --platform=a2a3sim,a5sim --forked -v

      - name: Test A5 system tests (simulator)
        # TestMscatter is deselected: the a5 simulator compiles incore kernels
        # against the runtime's bundled pto-isa, which still clones from the
        # stale PTO-ISA/pto-isa mirror (lacks pto::Coalesce) until the runtime
        # submodule is bumped past simpler #806. Re-enable once that lands.
        run: pytest tests/st/runtime/ops/test_assemble.py tests/st/runtime/ops/test_gather.py tests/st/runtime/ops/test_gatherb.py tests/st/runtime/ops/test_mscatter.py tests/st/runtime/ops/test_prelu.py tests/st/runtime/ops/test_random.py tests/st/runtime/ops/test_sels.py tests/st/runtime/ops/test_tri.py tests/st/runtime/framework_and_models/test_qwen3_decode_scope3_mixed.py tests/st/runtime/control_flow/test_dyn_orch_shape.py::TestDynOrchShapeOperations::test_dyn_orch_paged_attention -v --platform=a5sim --forked -k "not TestMscatter"

      - name: Test cast scratch planning and A2A3 numerical results
        # This job installs PTOAS, so the codegen matrix also assembles both backends.
        run: |
          pytest tests/ut/codegen/test_ptoas_planner_views.py -v -k "tcvt_"
          pytest tests/st/runtime/ops/test_cast_saturation.py -v --forked --platform=a2a3sim

      - name: Test A5 cross-core system tests (simulator)
        run: pytest tests/st/runtime/cross_core/test_cross_core.py -v --forked --platform=a5sim

      - name: Test A2A3 cross-core system tests (simulator)
        run: pytest tests/st/runtime/cross_core/test_cross_core.py -v --forked --platform=a2a3sim

  # Always run after all tests, including failed/skipped dependencies. A skipped
  # job counts as success to GitHub rulesets, so only this explicit validation
  # may produce the full-result signal consumed by the trusted status publisher.
  full-result:
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.pr_number != ''
    needs:
      - changes
      - toolchain
      - pre-commit
      - clang-tidy
      - lint-gate
      - codegen-tests
      - dist-system-tests
      - docs-examples
      - examples-tests
      - onboard-tests-a5
      - onboard-tests-a5-distributed
      - prebuild-wheels
      - prebuild-wheels-github
      - pypto-lib-compile
      - pypto-lib-model
      - serving-guard
      - system-tests
      - system-tests-a5sim
      - system-tests-direct
      - unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # This fresh hosted job runs trusted control code only. Test jobs retain
      # read-only tokens; explicit dispatches also run after failed-job reruns.
      actions: write
    steps:
      - name: Checkout trusted result validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Require every applicable full test
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_control.py aggregate
      - name: Request full status publication
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run ci-full-status.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f run_id="$GITHUB_RUN_ID" -f wait_for_completion=true
      - name: Reconcile full job checks
        if: always()
        # Progress is informational; its dispatch cannot invalidate passing tests.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run ci-full-progress.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f run_id="$GITHUB_RUN_ID"

  # Native PR checks attach to the test merge without the main-only publisher.
  full-pr-result:
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'integration/urma-ccu-test'
    needs:
      - changes
      - toolchain
      - pre-commit
      - clang-tidy
      - lint-gate
      - codegen-tests
      - dist-system-tests
      - docs-examples
      - examples-tests
      - onboard-tests-a5
      - onboard-tests-a5-distributed
      - prebuild-wheels
      - prebuild-wheels-github
      - pypto-lib-compile
      - pypto-lib-model
      - serving-guard
      - system-tests
      - system-tests-a5sim
      - system-tests-direct
      - unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted result validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Require every applicable full test
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_control.py aggregate
