name: CI Full
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
      && format('CI full PR #{0} @{1} base:{2}', inputs.pr_number, inputs.head_sha, inputs.base_sha)
      || (github.event_name == 'pull_request'
          && format('CI full PR #{0} @{1} base:{2}', github.event.pull_request.number,
                    github.event.pull_request.head.sha, github.event.pull_request.base.sha))
      || format('CI {0} {1}', github.event_name, github.ref_name) }}

on:
  pull_request:
    branches: [ "integration/urma-ccu-test" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (normally supplied by /ci full; empty tests the selected branch)
        type: string
        default: ''
      head_sha:
        description: Authorized PR head SHA
        type: string
        default: ''
      base_sha:
        description: Authorized PR base SHA
        type: string
        default: ''
      merge_sha:
        description: Immutable test merge SHA with base/head parents
        type: string
        default: ''

# PR test code never receives Actions/status write credentials. Publishing the
# merge gate happens in ci-full-status.yml on a fresh GitHub-hosted runner.
permissions:
  contents: read

# Enforced by the cache service, including cache API calls made by PR code.
# Wheel transfer uses run artifacts; cache key naming is not a security boundary.
cache-mode: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.pr_number && format('full-run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      # The classifier needs pull-requests: read. On dispatched full runs the
      # controller comes from trusted main and never executes the PR checkout.
      contents: read
      pull-requests: read
      actions: read
    outputs:
      full: ${{ steps.target.outputs.full }}
      reuse_lint: ${{ steps.target.outputs.reuse_lint }}
      checkout_sha: ${{ steps.target.outputs.checkout_sha }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      ptoas_version_changed: ${{ steps.classify.outputs.ptoas_version_changed }}
    steps:
      - name: Checkout CI controller
        uses: actions/checkout@v4
        with:
          # PR edits to ci_control.py cannot select the tier. The helper must
          # already exist on main; repository variables may be absent on forks.
          # PR workflow edits themselves still require runner-policy controls.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Validate and pin the test revision
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # Older base revisions still use the rollout flag in prepare. Pin
          # it on until those helpers are retired; never read it from vars.
          CI_COMMENT_TIERS_ENABLED: 'true'
        run: python .github/scripts/ci_control.py prepare
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ steps.target.outputs.full }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          PR_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only a pull request has a well-defined "files this change touches"
          # list; everything else runs the full pipeline.
          if [ -z "$PR_NUMBER" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            # `ptoas_version_changed` gates the serving guard, which is opt-in
            # on cost rather than conservative on correctness: the pin only
            # ever moves through a pull request, so a push to main re-running
            # it would buy no signal. workflow_dispatch stays true so the guard
            # can be forced by hand.
            if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
              echo "ptoas_version_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "ptoas_version_changed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "event '$EVENT_NAME' is not a pull request -> full pipeline"
            exit 0
          fi

          # Every failure below writes docs_only=false and exits 0 rather than
          # letting the step die. A *failed* `changes` job would skip every job
          # that needs it (the promised conservative path is the FULL pipeline,
          # not a skip), and for the matrix `unit-tests` a skip is worse still --
          # see the note on that job.
          fail_open() {
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            # Also open for the serving guard: an unreadable file list cannot
            # prove the pin did not move, and a toolchain bump reaching serving
            # unguarded is worth more than the cards a spurious run costs.
            echo "ptoas_version_changed=true" >> "$GITHUB_OUTPUT"
            echo "$1 -> full pipeline"
            exit 0
          }

          # Classify the immutable revisions selected by prepare. The mutable
          # pulls/{number}/files endpoint can describe another head after a push.
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            fail_open 'missing or invalid pinned comparison revisions'
          fi
          if ! comparison="$(gh api "repos/$REPO/compare/$PR_BASE_SHA...$PR_HEAD_SHA?per_page=1")"; then
            fail_open 'pinned comparison request failed'
          fi
          if ! expected="$(jq -er '.files | if type == "array" then length else error("missing files") end' \
                               <<< "$comparison")"; then
            fail_open 'pinned comparison did not return a file list'
          fi

          # Compare returns files only on page one, capped at 300 even when the
          # commits are paginated. At the cap we cannot prove completeness, so
          # enable all checks rather than trusting a possibly truncated list.
          if [ "$expected" -eq 0 ] || [ "$expected" -ge 300 ]; then
            fail_open 'pinned comparison file list is empty or potentially truncated'
          fi

          # Keep BOTH names: renaming src/foo.cpp to docs/foo.md still removes
          # a build-relevant path. TSV escaping keeps unusual filenames on one
          # row without interpreting repository-controlled text as shell code.
          if ! files="$(jq -er '.files[] | [.filename, (.previous_filename // "")] | @tsv' \
                            <<< "$comparison")"; then
            fail_open 'pinned comparison files could not be decoded'
          fi

          # Allowlist. Every entry must be incapable of affecting a build or a
          # test result:
          #   docs/**    the documentation tree, including docs/requirements.txt
          #              (only the docs.yml toolchain reads it)
          #   **/*.md    prose anywhere -- README, .claude/ rules, docs pages.
          #
          # `docs_only` means "no build, no device tests". It does NOT mean the
          # change is inert: the user manual carries runnable code blocks that
          # `tests/docs/run_doc_examples.py` extracts and executes, so a doc edit
          # can break a real check. `docs_changed` below gates the `docs-examples`
          # job, which runs those blocks on the paths this fast path skips.
          # The markdown lint scripts (check_docs_nav / check_docs_en_zh_parity)
          # run in `pre-commit`, which stays ungated.
          #   mkdocs.yml site config, consumed only by docs.yml
          # `case` globs are not path-aware, so `*.md` matches at any depth.
          # One full pass, no early exit: `docs_only` and `docs_changed` are
          # independent questions, and short-circuiting on the first
          # non-documentation path would answer the second by file order alone.
          # `ptoas_version_changed` is a third, independent question: did this
          # PR change the pinned PTOAS_VERSION value? The version-file path is
          # only a cheap first filter: below, the assignment is compared at the
          # PR base and head so comments and wheel-sha updates do not consume
          # cards for `serving-guard`.
          docs_only=true
          docs_changed=false
          ptoas_version_changed=false
          versions_env_changed=false
          while IFS="$(printf '\t')" read -r new_path old_path; do
            for f in "$new_path" "$old_path"; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/*) docs_changed=true ;;
              esac
              case "$f" in
                toolchain/versions.env)
                  versions_env_changed=true
                  ;;
              esac
              case "$f" in
                docs/*|*.md|mkdocs.yml) ;;
                *)
                  if [ "$docs_only" = 'true' ]; then
                    echo "non-documentation change: $f -> full pipeline"
                  fi
                  docs_only=false
                  ;;
              esac
            done
          done <<< "$files"

          if [ "$versions_env_changed" = 'true' ]; then
            read_ptoas_version() {
              gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/$REPO/contents/toolchain/versions.env?ref=$1" |
                sed -nE 's/^PTOAS_VERSION=([^[:space:]]+)$/\1/p'
            }

            is_single_version() {
              [ -n "$1" ] && [ "$(printf '%s\n' "$1" | wc -l)" -eq 1 ]
            }

            if ! base_ptoas_version="$(read_ptoas_version "$PR_BASE_SHA")" ||
              ! head_ptoas_version="$(read_ptoas_version "$PR_HEAD_SHA")" ||
              ! is_single_version "$base_ptoas_version" ||
              ! is_single_version "$head_ptoas_version"; then
              fail_open 'PTOAS_VERSION could not be read exactly once at both PR revisions'
            fi

            if [ "$base_ptoas_version" != "$head_ptoas_version" ]; then
              ptoas_version_changed=true
              echo "PTOAS_VERSION changed: $base_ptoas_version -> $head_ptoas_version; serving guard enabled"
            else
              echo "PTOAS_VERSION unchanged ($head_ptoas_version); serving guard disabled"
            fi
          fi

          # Explicit full means core tests actually execute, even for docs-only
          # PRs. Keep docs_changed/ptoas_version_changed independently computed.
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] || [ "${FULL_CI:-false}" = 'true' ]; then
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "ptoas_version_changed=$ptoas_version_changed" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = 'true' ]; then
            echo "all $expected changed paths are documentation:"
            printf '%s\n' "$files" | cut -f1 | sed 's/^/  /'
          fi

  toolchain:
    needs: changes
    # Single source of truth for the toolchain versions every device job uses.
    # ptoas is declared in toolchain/versions.env (pypto-owned); pto-isa is
    # DERIVED from the pinned runtime submodule's runtime/pto_isa.pin (the
    # runtime owns it and enforces build == run). Both are re-exported as outputs
    # consumed via `needs.toolchain.outputs.*`. Bumping the runtime submodule
    # moves pypto's pto-isa in lockstep.
    #
    # Only greps/reads pinned files (no build, no pip), so it runs on a
    # GitHub-hosted runner — the same as daily_ci.yml's toolchain job — instead of
    # occupying an in-house self-hosted slot behind a container.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pto_isa_commit: ${{ steps.read.outputs.PTO_ISA_COMMIT }}
      ptoas_version: ${{ steps.read.outputs.PTOAS_VERSION }}
      ptoas_sha256_aarch64: ${{ steps.read.outputs.PTOAS_SHA256_AARCH64 }}
      ptoas_sha256_x86_64: ${{ steps.read.outputs.PTOAS_SHA256_X86_64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_sha }}
          persist-credentials: false
          submodules: true
      - name: Read pinned toolchain versions
        id: read
        run: |
          # ptoas: pypto-owned, from versions.env
          grep -E '^[A-Z0-9_]+=' toolchain/versions.env >> "$GITHUB_OUTPUT"
          # pto-isa: derived from the pinned runtime submodule (runtime owns it)
          commit="$(tr -d '[:space:]' < runtime/pto_isa.pin)"
          if ! printf '%s' "$commit" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error file=runtime/pto_isa.pin::expected a 40-char hex commit, got '$commit'"
            exit 1
          fi
          echo "PTO_ISA_COMMIT=$commit" >> "$GITHUB_OUTPUT"
          echo "pinned pto-isa (from runtime submodule): $commit"
      - name: Guard against un-centralized toolchain literals
        run: |
          status=0
          if grep -rn -- '--pto-isa''-commit' python/ tests/ .github/workflows/; then
            echo "::error::The PyPTO pto-isa commit override has been removed. Bump runtime/pto_isa.pin instead."
            status=1
          fi
          if grep -rnE 'git checkout [0-9a-f]{40}' .github/workflows/; then
            echo "::error::Hardcoded pto-isa commit found in a workflow. Use needs.toolchain.outputs.pto_isa_commit; pto-isa is bumped via the runtime submodule (runtime/pto_isa.pin)."
            status=1
          fi
          if grep -rnE 'PTOAS_SHA256(_[A-Z0-9]+)?: *[0-9a-f]{64}' .github/workflows/; then
            echo "::error::Hardcoded PTOAS_SHA256 found in a workflow. Reference needs.toolchain.outputs.ptoas_sha256_* and bump toolchain/versions.env instead."
            status=1
          fi
          exit $status

  # Shared lint definitions are also used to generate the PR-only ci.yml.
  # Main CI runs fresh lint; comment-dispatched full runs reuse a verified PR
  # result and pass through lint-gate without repeating these two jobs.
  onboard-tests-a5-distributed:
    timeout-minutes: 50
    # The trusted full-tier lane installed by #3389 runs the real A5 URMA
    # acceptance suite. /ci full loads this workflow from main, so the suite
    # comes from the PR merge checkout; a missing suite fails loudly instead
    # of silently passing a bootstrap placeholder.
    needs: [changes, toolchain]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.toolchain.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.full == 'true'
    permissions:
      contents: read
    runs-on: [self-hosted, linux, npu-a5]
    defaults:
      run:
        working-directory: a5-dist-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/a5-dist-checkout/ptoas-bin
      PTOAS_VERSION: ${{ needs.toolchain.outputs.ptoas_version }}
      PTOAS_SHA256_AARCH64: ${{ needs.toolchain.outputs.ptoas_sha256_aarch64 }}
      PTOAS_SHA256_X86_64: ${{ needs.toolchain.outputs.ptoas_sha256_x86_64 }}
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: a5-dist-checkout
          checkout-ref: ${{ needs.changes.outputs.checkout_sha }}
          needs-device: 'true'
          pip-cache-name: pip-a5
          pto-isa-commit: ${{ needs.toolchain.outputs.pto_isa_commit }}
          runtime-targets: build_package_a5
          # Keep runner-specific ring settings out of this job's environment.
          unset-ring: 'true'
          toolchain: bundle

      - name: Run distributed tests
        timeout-minutes: 40
        run: |
          source activate.sh
          LOGDIR="$GITHUB_WORKSPACE/a5-dist-checkout/outputs/urma_async/ascend"
          mkdir -p "$LOGDIR"
          export ASCEND_PROCESS_LOG_PATH="$LOGDIR"
          # Four cards select the P=4 cases. No --forked: JIT compilation can
          # leave a child that pytest-forked waits on beyond its timeout.
          # The suite passes in ~5.5 min (slow path ~12 min). Bound a hung
          # case at 15 min of execution and 20 min of card-queue wait so a
          # failure reaches the log quickly instead of after the old 65/30-min caps.
          # Stop at the first failing case (-x): a device failure otherwise
          # repeats its ~2.5 min failure path for every remaining case.
          task-submit --device auto --device-num 4 --timeout 2100 --max-time 900 \
            --run "cd $GITHUB_WORKSPACE/a5-dist-checkout && source activate.sh && python -m pytest \
              tests/st/distributed/test_l3_urma_async.py -k 'test_put_only and not fp16 and 4' \
              -v -x --platform=a5 --device=\$TASK_DEVICE --durations=0 \
              --junitxml=$GITHUB_WORKSPACE/a5-dist-checkout/ci-distributed-junit.xml"

      - name: Upload distributed test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-distributed-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            a5-dist-checkout/ci-distributed-junit.xml
            a5-dist-checkout/outputs/urma_async/ascend/**

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: a5-dist-checkout

