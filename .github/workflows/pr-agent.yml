name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    if: >-
      vars.PR_AGENT_ENABLED == 'true' &&
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.issue.state == 'open' && github.event.comment.body == '/review' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check model credentials
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo '::error::Add the DeepSeek API key as the repository Actions secret OPENAI_KEY.'
            exit 1
          fi

      # Fetch PR data through GitHub's API. Never check out or execute PR code
      # in this workflow: pull_request_target has access to repository secrets.
      - name: Review pull request
        uses: docker://pragent/pr-agent:0.45.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI.API_BASE: ${{ vars.PR_AGENT_API_BASE || 'https://api.deepseek.com' }}
          CONFIG.MODEL: openai/${{ vars.PR_AGENT_MODEL || 'deepseek-flash' }}
          CONFIG.FALLBACK_MODELS: '[]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: '128000'
          CONFIG.MAX_MODEL_TOKENS: '128000'
          CONFIG.USE_REPO_SETTINGS_FILE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          PR_REVIEWER.PERSISTENT_COMMENT: 'true'
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            Focus on actionable correctness, regression, and security issues.
            For PyPTO, check consistency between C++ headers, implementations,
            Python bindings, and type stubs when public APIs change.
            Check that compiler passes preserve IR semantics and that tests
            cover changed behavior. Avoid style-only findings.
