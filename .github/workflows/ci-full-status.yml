name: CI Full Status

# Includes native reruns: requested alone does not fire when a run is rerun.
on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]

permissions: {}

jobs:
  route:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.display_title, 'CI full PR #')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.route.outputs.key }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted status router
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Validate origin before joining the status writer queue
        id: route
        run: python .github/scripts/ci_control.py route

  publish:
    needs: route
    if: needs.route.outputs.key != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Commands and publishers share one writer; queued events cannot replace
      # a pending completion writer. State is re-read after acquiring the slot.
      group: ci-full-status-${{ needs.route.outputs.key }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted status publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Update the PR head's full CI status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_control.py publish
