[package]
name = "ptoas_rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ptoas-rs -- lift PTO assembly back to tile-rs, and report what the lift and the Rust compiler can prove about it."

[lib]
path = "src/lib.rs"

[[bin]]
name = "ptoas-rs"
path = "src/bin/ptoas-rs.rs"

# The plan differ. Separate because it answers a different question -- what moved
# between two memory plans -- and is useful without lifting anything.
[[bin]]
name = "pto-diff"
path = "src/bin/pto-diff.rs"

[dependencies]
