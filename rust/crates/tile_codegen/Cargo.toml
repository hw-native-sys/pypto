[package]
name = "tile_codegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The CodegenTarget trait, the target registry, and the hardware parameters a target is described by. Standard library only."

[lib]
path = "src/lib.rs"

# No dev-dependency on a GPU crate. The upstream version of this manifest
# carried `metal = "0.29"` under a macOS target gate, to run emitted Apple
# shaders in its tests; that emitter and its tests are not part of this tree.
