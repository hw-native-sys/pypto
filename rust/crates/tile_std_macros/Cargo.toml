[package]
name = "tile_std_macros"
version = "0.0.1"
edition = "2024"
license = "LicenseRef-CANN-Open-Software-License-Agreement-Version-2.0"
description = "The `#[tile_kernel]` / `#[aiv_kernel]` attribute macros for tile_std"

# Excluded from the workspace with `tile_std`, which is its only consumer.
# It would build on stable, but it is the one crate here with third-party
# dependencies, and keeping it out is what lets the tools' dependency-free
# property stay checkable by `cargo tree`.

[lib]
proc-macro = true

[dependencies]
quote = "1.0.38"
syn = { version = "2.0.96", features = ["full"] }
proc-macro2 = "1.0.93"
