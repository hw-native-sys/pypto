[package]
name = "pto_to_ascendc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "pto-to-ascendc -- emit AscendC C++, for comparing the PTO, tile-rs and tile representations of a kernel."

[lib]
path = "src/lib.rs"

[[bin]]
name = "pto-to-ascendc"
path = "src/bin/pto-to-ascendc.rs"

[dependencies]
ascendc_emit = { path = "../ascendc_emit" }
tile_codegen = { path = "../tile_codegen" }
