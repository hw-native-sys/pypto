[package]
name = "ascendc_emit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MLIR -> AscendC C++ for bisheng, registered through tile_codegen's CodegenTarget trait."

[lib]
path = "src/lib.rs"

[dependencies]
tile_codegen = { path = "../tile_codegen" }

# No serde, no serde_json, no thiserror. They arrived only through an
# optimization-knowledge lookup that has been removed; see the note at its
# former call site in src/mlir_to_cpp.rs. This crate needs nothing beyond std.
