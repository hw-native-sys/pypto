[workspace]
resolver = "2"
members = ["crates/controller", "crates/engine_ascend", "crates/engine_core"]

# A SEPARATE workspace from `rust/`, deliberately. The frontend tools there have
# no third-party dependencies at all, and that is a property worth keeping
# checkable: a serving utility needs a SQLite registry, a signature verifier and
# a memory map, and folding them into one workspace would make "the tools need
# nothing" stop being true of anything.
#
# It shares the repository's licence and its stable-Rust pin.

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "LicenseRef-CANN-Open-Software-License-Agreement-Version-2.0"

[workspace.dependencies]
anyhow = "1"
