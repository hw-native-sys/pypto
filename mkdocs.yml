#
# MkDocs configuration for the PyPTO documentation site.
#
# The markdown under `docs/` is the single source of truth and must stay readable
# directly on GitHub; this file only describes how it is rendered. The built site
# is never committed -- CI publishes it to GitHub Pages (see .github/workflows/docs.yml).
#
# Build locally:
#   pip install -r docs/requirements.txt
#   mkdocs serve            # live preview on http://127.0.0.1:8000
#   mkdocs build --strict   # what CI runs; warnings (broken links) fail the build

site_name: PyPTO
site_description: A high-performance programming framework for tile-centric computing
site_url: https://hw-native-sys.github.io/pypto/
repo_url: https://github.com/hw-native-sys/pypto
repo_name: hw-native-sys/pypto
edit_uri: edit/main/docs/
copyright: Copyright &copy; PyPTO Contributors

docs_dir: docs
site_dir: site

# Build inputs that live under docs/ but are not content.
exclude_docs: |
  requirements.txt
  /superpowers/

# Broken internal links must fail the build, not warn. `mkdocs build --strict`
# promotes every warning to an error; these settings decide what counts as one.
validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  # `lang: [en, zh]` needs `jieba` for Chinese word segmentation -- it ships in
  # docs/requirements.txt.
  - search:
      lang:
        - en
        - zh
  # Folder-structured i18n: `docs/en/**` is the default locale and is served at
  # the site root, `docs/zh/**` under `/zh/`. The `nav` below is declared
  # with default-locale (`en/...`) paths; the plugin swaps in the localized file
  # for every other locale, so page titles come from each locale's own H1.
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            User Manual: 用户手册
            Reference: 参考
            API Reference: API 参考
            Developer: 开发者
            Runtime: 运行时
            PTO ISA: PTO ISA
            IR: IR
            Passes: Passes
            Language: 语言
            Code Generation: 代码生成
            Backend: 后端
            Debug: 调试
            Distributed: 分布式
  # Both locales render the same API bodies, so every mkdocstrings identifier has
  # two anchors -- one under `/api/`, one under `/zh/api/`. Without `resolve_closest`
  # autorefs cannot pick between them ("Multiple primary URLs found for ..."),
  # which `--strict` turns into a build failure the moment
  # anything cross-references the identifier -- the operator catalog does, 142
  # times per locale. Resolving to the closest anchor is also what a reader wants:
  # a link on a zh page lands on the zh page.
  - autorefs:
      resolve_closest: true
  # Renders API pages from source docstrings. The `pl.*` namespaces are wired
  # into the nav as a top-level `API Reference` tab; `pypto.runtime.*` is not
  # rendered yet (see issue #2120).
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            # `__all__` in each of these modules is hand-grouped by concept -- create
            # before read before write, `mul` next to `muls`, the whole fillpad family
            # together -- so it is the reading order the author already chose. Without
            # this the page falls back to alphabetical *within kind*, which splits
            # constants from classes from functions and scatters every family across
            # 270 entries. `source` is the fallback for class members, where `__all__`
            # does not apply.
            members_order: ["__all__", "source"]
            # Without this, members are bucketed attributes/classes/functions before
            # `__all__` is applied within each bucket -- which splits exactly the pairs
            # `__all__` puts side by side (`jit` from `JITFunction`, `function` /
            # `inline` / `program` from `InlineFunction`). One sequence, author order.
            group_by_category: false
            # Default `false` silently drops any member without a docstring -- which was
            # hiding 34 public `pl.*` names, `jit` and every dtype (`FP16`, `INT32`, ...)
            # among them. A reader looking one up found nothing at all. Showing the name
            # and its value beats omitting it; a missing description is a docstring to
            # write, not a reason to leave the symbol undiscoverable.
            show_if_no_docstring: true

# Rewrites repo-relative links that escape `docs/` (source files, `.claude/rules`,
# `examples/`) into GitHub blob URLs at build time. The markdown keeps working
# relative links for readers browsing the repo, and the site gets links that
# resolve -- without which `--strict` fails on every such reference.
hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hw-native-sys/pypto
      name: PyPTO on GitHub

